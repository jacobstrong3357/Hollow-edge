<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#171927" />
  <title>Thank you · Hollow's Edge</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; font-family: Georgia, "Times New Roman", serif; background: #171927; color: #f0e5d1; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 0, #3c2947 0, #25263c 30%, #171927 70%); }
    main { width: min(100% - 32px, 540px); padding: 36px 28px; border-left: 3px solid #f3c780; background: #111521; }
    .eyebrow { color: #f3c780; font-size: 12px; letter-spacing: .23em; text-transform: uppercase; font-weight: bold; }
    h1 { font-size: clamp(30px, 8vw, 42px); line-height: 1.1; margin: 14px 0; font-weight: normal; }
    p { color: #ddd2c0; line-height: 1.55; }
    a { color: #f3c780; text-underline-offset: 3px; }
    a:focus-visible { outline: 3px solid #f3c780; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Hollow's Edge · beta</div>
    <h1>Thanks for playing.</h1>
    <p>Your feedback has been sent. I'll read it as I work on the next version.</p>
    <a href="/">Return to the game →</a>
  </main>
</body>
</html>
