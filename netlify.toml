# The game is index.html alone; repo docs stay out of the published site.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/AGENTS.md"
  to = "/"
  status = 404
  force = true

# The local test rig (vendoring script + smoke test) is developer tooling.
[[redirects]]
  from = "/tools/*"
  to = "/"
  status = 404
  force = true

# The design handoff (README, canvas, mock runtime) is reference for the
# redesign, not part of the game.
[[redirects]]
  from = "/design_handoff_hollows_edge_redesign/*"
  to = "/"
  status = 404
  force = true
