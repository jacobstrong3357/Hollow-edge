[build]
  command = "npm run build"
  publish = "dist"

# Repo docs stay out of the published site.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 404
  force = true

# The design handoff (README, canvas, mock runtime) is reference for the
# redesign, not part of the game.
[[redirects]]
  from = "/design_handoff_hollows_edge_redesign/*"
  to = "/"
  status = 404
  force = true

# The game now serves compact WebP derivatives while retaining the PNG files
# as source masters. Let repeat visits reuse those derivatives without a
# network round-trip; one week keeps art revisions under stable filenames sane.
[[headers]]
  for = "/assets/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"
