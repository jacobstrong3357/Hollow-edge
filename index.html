  /* -------- window.storage shim --------
     The Claude artifact runtime provides an async key/value store. Outside it,
     back the same API with localStorage so the Black Book still persists,
     per-browser, between sessions. Same shape: {key, value} or null. */
  (function () {
    var P = 'he:';
    var mem = {};
    var ok = (function () {
      try { localStorage.setItem(P + '__t', '1'); localStorage.removeItem(P + '__t'); return true; }
      catch (e) { return false; }   /* private mode / file:// lockdown -> in-memory */
    })();
    var read  = function (k) { return ok ? localStorage.getItem(P + k) : (k in mem ? mem[k] : null); };
    var write = function (k, v) { if (ok) localStorage.setItem(P + k, v); else mem[k] = v; };
    var drop  = function (k) { if (ok) localStorage.removeItem(P + k); else delete mem[k]; };
    var keys  = function () {
      if (!ok) return Object.keys(mem);
      var out = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(P) === 0) out.push(k.slice(P.length));
      }
      return out;
    };
    window.storage = {
      get: async function (key) { var v = read(key); return v === null ? null : { key: key, value: v, shared: false }; },
      set: async function (key, value) { write(key, String(value)); return { key: key, value: String(value), shared: false }; },
      delete: async function (key) { drop(key); return { key: key, deleted: true, shared: false }; },
      list: async function (prefix) {
        var ks = keys().filter(function (k) { return !prefix || k.indexOf(prefix) === 0; });
        return { keys: ks, prefix: prefix, shared: false };
      }
    };
  })();

  /* surface any failure instead of leaving a black screen */
  window.__bootFail = function (msg) {
    var b = document.getElementById('boot');
    if (!b) return;
    b.querySelector('.s').textContent = 'The game did not start. Check the internet connection and reload.';
    document.getElementById('bootErr').textContent = String(msg || '').slice(0, 800);
  };
  window.addEventListener('error', function (e) { window.__bootFail(e.message); });
  if (!window.React || !window.ReactDOM || !window.Tone || !window.Babel) {
    window.__bootFail('A library failed to load (React / Tone / Babel / Tailwind come from the internet on first load).');
  }
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;


/* ================= SOUND ================= */
/* All synthesized. Wind under everything, a bell that counts the nights,
   a heartbeat when the dark gets close, and one chord each for dawn and ruin. */
const Snd = {
  enabled: false, built: false, heartLoop: null,
  async init() {
    if (this.built) return true;
    try {
      await Tone.start();
      this.windVol = new Tone.Volume(-100).toDestination();
      this.windFilter = new Tone.Filter(220, "lowpass").connect(this.windVol);
      this.windLfo = new Tone.LFO(0.05, 120, 420).start();
      this.windLfo.connect(this.windFilter.frequency);
      this.wind = new Tone.Noise("pink").connect(this.windFilter).start();
      this.bellVol = new Tone.Volume(-16).toDestination();
      this.bell = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.002, decay: 2.2, sustain: 0, release: 2.6 } }).connect(this.bellVol);
      this.bell2 = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.002, decay: 1.4, sustain: 0, release: 1.6 } }).connect(this.bellVol);
      this.heart = new Tone.MembraneSynth({ octaves: 2.2, pitchDecay: 0.04 }).toDestination();
      this.heart.volume.value = -12;
      this.pad = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "triangle" }, envelope: { attack: 0.4, decay: 1.4, sustain: 0.15, release: 3 } }).toDestination();
      this.pad.volume.value = -16;
      /* -- Pass H: a few more distinct one-shots, built once here like
         everything else, never constructed lazily inside their methods -- */
      this.dangerVol = new Tone.Volume(-14).toDestination();
      this.dangerNoise = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.14, sustain: 0, release: 0.05 } }).connect(this.dangerVol);
      this.dangerPad = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "sawtooth" }, envelope: { attack: 0.002, decay: 0.4, sustain: 0, release: 0.3 } }).connect(this.dangerVol);
      this.chimeVol = new Tone.Volume(-24).toDestination();
      this.chime = new Tone.Synth({ oscillator: { type: "sine" }, envelope: { attack: 0.01, decay: 0.6, sustain: 0.1, release: 1.0 } }).connect(this.chimeVol);
      this.howlVol = new Tone.Volume(-20).toDestination();
      this.howl = new Tone.Synth({ oscillator: { type: "sine" }, portamento: 0.4, envelope: { attack: 0.4, decay: 0.8, sustain: 0.3, release: 1.8 } }).connect(this.howlVol);
      this.built = true;
      return true;
    } catch (e) { return false; }
  },
  wind_(db) { if (this.built && this.enabled) this.windVol.volume.rampTo(db, 2); },
  toll(times) {
    if (!this.built || !this.enabled) return;
    const t = Tone.now() + 0.1;
    for (let i = 0; i < Math.min(times, 4); i++) {
      this.bell.triggerAttackRelease("A3", 2, t + i * 1.6);
      this.bell2.triggerAttackRelease("E4", 1.1, t + i * 1.6 + 0.015);
    }
  },
  beat(on) {
    if (!this.built) return;
    if (on && this.enabled) {
      if (!this.heartLoop) {
        this.heartLoop = new Tone.Loop((time) => {
          this.heart.triggerAttackRelease("A1", "16n", time, 0.9);
          this.heart.triggerAttackRelease("E1", "16n", time + 0.24, 0.55);
        }, 1.05);
      }
      this.heartLoop.start(0); Tone.Transport.start();
    } else if (this.heartLoop) { this.heartLoop.stop(); }
  },
  sting() { if (this.built && this.enabled) this.pad.triggerAttackRelease(["C2", "F#2", "C3"], 3.5); },
  dawn() { if (this.built && this.enabled) { const t = Tone.now(); ["A3", "C4", "E4", "A4"].forEach((nn, i) => this.pad.triggerAttackRelease(nn, 1.6, t + i * 0.35)); } },
  /* -- Pass H: a sharp, dissonant burst for the "something is closing in"
     hide beat. Short and jarring on purpose, distinct from sting()'s slower
     held chord. -- */
  danger() {
    if (!this.built || !this.enabled) return;
    const t = Tone.now();
    this.dangerNoise.triggerAttackRelease("16n", t);
    this.dangerPad.triggerAttackRelease(["C2", "Db2", "Gb2"], 0.35, t + 0.02);
  },
  /* -- a small, quiet rising interval for surviving the hide beat: relief,
     not triumph, so it stays well under dawn()'s volume. -- */
  relief() {
    if (!this.built || !this.enabled) return;
    const t = Tone.now();
    this.chime.triggerAttackRelease("E4", 0.5, t);
    this.chime.triggerAttackRelease("A4", 0.7, t + 0.12);
  },
  /* -- a single unsettling swell for the "you hear something" sound beat:
     a slow pitch glide up and back down, monster-agnostic. -- */
  wail() {
    if (!this.built || !this.enabled) return;
    const t = Tone.now();
    this.howl.triggerAttack("C3", t);
    this.howl.frequency.rampTo("G3", 1.2, t + 0.1);
    this.howl.frequency.rampTo("D3", 1.4, t + 1.3);
    this.howl.triggerRelease(t + 2.6);
  },
  /* -- a muted, sustained variant of the night-count bell for the
     climactic "offer" scene: one low, held toll under a low drone,
     never counted, never repeated like toll() is. -- */
  offerDrone() {
    if (!this.built || !this.enabled) return;
    const t = Tone.now();
    this.bell.triggerAttackRelease("D2", 4.5, t);
    this.bell2.triggerAttackRelease("A2", 3.5, t + 0.05);
    this.pad.triggerAttackRelease(["D2", "Ab2"], 5, t + 0.3);
  },
  /* -- a couple of soft, consonant notes for a positive social beat
     (a friendly mingle, a disposition tick up in an interview). -- */
  warm() {
    if (!this.built || !this.enabled) return;
    const t = Tone.now();
    this.chime.triggerAttackRelease("G4", 0.4, t);
    this.chime.triggerAttackRelease("B4", 0.5, t + 0.1);
  },
  async setEnabled(on) {
    if (on) { const ok = await this.init(); if (!ok) return false; this.enabled = true; this.wind_(-30); return true; }
    this.enabled = false;
    if (this.built) { this.windVol.volume.value = -100; this.beat(false); }
    return false;
  },
};

const MONSTERS = [
  { id: "werewolf", name: "Werewolf", signs: ["claw", "tracks", "bite"], rhythm: { kind: "strict", n: 3 }, attack: "kill", reach: "out", method: "silver", hunts: ["Dark Forest", "Village Square"], lore: "Bound to the moon. It hunts on exact, ritual nights, every third, and cannot break the pattern. Takes only those caught outdoors, and takes them apart. The books prescribe the silver blade." },
  { id: "vampire", name: "Vampire", signs: ["bite", "reflect", "cold"], rhythm: { kind: "loose", p: 0.5, gap: 1 }, attack: "turn", reach: "home", method: "stake", hunts: ["Village Square", "Tavern"], lore: "Its first feeding is always too deep: one body, torn, to open the account. After that it feeds when the thirst takes it, never two nights running, and slips through any door. From then on its victims do not die. They change, and they hide it. Only the stake ends it." },
  { id: "wraith", name: "Wraith", signs: ["reflect", "cold", "flora"], rhythm: { kind: "loose", p: 0.75, gap: 0 }, attack: "kill", reach: "outOnly", method: "salt", hunts: ["Old Church", "Graveyard"], lore: "Stalks almost every night, but takes only those who wander after dark. Bar your door and it passes by. It is unmade inside a ring of salt." },

/* Two wrong names is one too many: on the second, the thing stops feeding on
   the village and comes for the one who kept naming it wrong. Appends a death
   scene to the given beats and sets the loss. */
function monsterKillsAccuser(s, beats, intro, where) {
  const m = monsterOf(s);
  const mn = npcById(s, s.monster.vid);
  if (intro) beats.push(intro);
  beats.push(...(DEATH_SCENES[m.id] || DEATH_SCENES.wraith)(mn ? mn.name : "it", where || "your own door"));
  s.over = { win: false, reason: "slain", text: `Twice you named it wrong, and the second time was one too many. It stopped feeding on the village and came for you the same night, and the neighbours whose trust you had spent did not come when you called.` };
}

/* One roll for what a stay-home watch turns up, so the live walk and the
   morning recap always agree: it is computed once and carried on the shared
   night facts. Never fires on the monster (never a giveaway). */
function rollHomeWatch(s, id) {
  const target = npcById(s, id);
  if (!target || id === s.monster.vid) return { kind: "quiet" };
  const roll = Math.random();
  const others = s.npcs.filter((x) => x.alive && !x.fled && x.id !== id && x.id !== s.monster.vid);
  if (SECRETS[id] && !target.secretKnown && roll < 0.3) return { kind: "secret", short: SECRETS[id].short };
  if (others.length && roll < 0.52) return { kind: "visitor", visitorId: pick(others).id };
  if (roll < 0.7) return { kind: "restless", ri: Math.floor(Math.random() * WATCH_RESTLESS.length) };
  return { kind: "quiet" };
}

  ansel: [`"I stand up on Sunday and tell them God is watching over Hollow's Edge." He turns his cup a full circle before he goes on. "Something is watching. That much of the sermon is true."`, `"I am tired in a place sleep doesn't reach. But they keep coming to me with their fear, and a shepherd doesn't get to put the crook down mid-wolf. So. I am well, is the answer I'd thank you to repeat."`],
  greta: [`"I'm the only one in this village sleeping properly, and I pay for it: they've noticed. Nothing makes people trust a wise-woman less than steady nerves in a bad season." She snorts. "Steady nerves are just knowing which things are actually worth fearing."`, `"My grandmother lived through the last trouble like this. She said the trick was to keep doing your work with your hands and your counting with your head. My hands are fine." She looks at you. "It's everyone else's counting that frightens me."`],
  wilhelm: [`"The boys ask me every night if it can get in. Every night I say no. A man shouldn't get that good at a lie." He works the bellows once, hard, for nothing. "Ask me something about iron."`, `"Holding up. Aye. A forge holds up. Doesn't mean nothing's burning inside it." That is all you get, and from him it is a confession.`],
  liesel: [`"Business is roaring, love. Fear drinks like a sailor." She laughs the tankard-rattling laugh, and then lets it die honestly. "I count them out the door every night, my drinkers. Lately I count them again at the window, all the way up the lane."`, `"I've been left before. I know how to live in a house that's short one voice. But this - " she gestures at the whole dark outside " - this is the whole village learning it at once, and I'm out of practice at watching."`],
  falk: [`"At my age, holding up is a technical term. The hip is a ruin, the eyes are a scandal, and I sleep in my chair because lying flat feels like rehearsal." He raps his cane once on the floor. "But the hands still work. So it isn't allowed to matter."`, `"I have signed a great many certificates in my life, and there was always a cause to write in the little box. Lately I leave the box empty. You want to know how I am? I am a doctor with an empty box, and it is making a superstitious old fool of me."`],
  rosa: [`"You are the first person in two springs to ask me that." She lets the silence sit a moment, deciding something. "Frightened. Same as you. It is almost a relief, everyone else finally knowing how it feels to watch the dark for something with your name in it."`, `"I sew. The needle doesn't care what's outside. In and out, in and out - you can build a whole night out of that, if you have to. I have built a great many nights out of that."`],
};
/* "Tell me about before." - the life each of them had. Asked once, ever. */
const PAST_LINES = {
  marta: [`"I wasn't born to flour. I married into it - married Klaus for his laugh and got the ovens in the bargain. First year I burned everything. He ate it all anyway, every brick of it, and swore it was good." She shakes her head. "Three winters gone and I still bake like he's going to walk in and lie to me about it."`],
  tobias: [`"Buried my first man at fourteen, alongside my father, who did the teaching. Buried my father at nineteen. Two wives since, God keep the both of them, and most everyone I ever drank with." He counts none of it on his fingers. He doesn't need to. "Folk think grave-digging is about the dead. It's not. It's the last kindness anyone can't return."`],
  ansel: [`"I was going to be a city scholar. Books, debates, a soft chair by a library fire. Then the seminary sent me here for one year, to season me." He looks around the vestry, twenty years deep in candle smoke. "Somewhere in that year, the village decided I belonged to it. Villages do that. You'll have noticed."`],
  greta: [`"My grandmother raised me on roots and warnings. Half the village called her a witch, and the same half knocked at her door the moment a child coughed wrong." She strips a stem clean without looking at it. "I inherited the garden, the book, and the knocking. The name they call me changes with the season. The knocking never stops."`],
  wilhelm: [`"My grandfather's forge, my father's forge, mine. The boys' after, if God's got any decency left." He touches the anvil the way other men touch a church door. "Anja and I had four good years. She gave me the lads and the fever took her a week after the little one came. The iron doesn't fill it. The iron just gives the days a shape."`],
  liesel: [`"This bar was my mother's, and her mother's before that. Three generations of pouring for this village's sorrows." She polishes a spot that needs nothing. "My husband thought a tavern was money. Turned out a tavern is work, and he had opinions about work. One market day he walked out for tobacco. The tobacco was in the drawer. I've kept it. Spite keeps, love. Spite keeps beautifully."`],
  falk: [`"The city veterinarium, thirty years. Duchesses' lapdogs and dray horses and once, memorably, a circus bear with a toothache." The old eyes go somewhere pleasant for a moment. "I retired here for the quiet. You may laugh at that whenever you're ready."`],
  rosa: [`A long stillness, the needle paused mid-stitch. "Before is a country I don't visit." Then, perhaps because you asked plainly and didn't press: "There was a city. There was a house that looked handsome from the street. I left both between one bell and the next, and I took nothing but the needle, and the needle was the only thing in that house that had never been used against me." She resumes the stitch. "Hollow's Edge was as far as the money went. It has been far enough."`],

function dispTier(d) {
  const v = d || 0;
  if (v <= -2) return "hate";
  if (v === -1) return "cool";
  if (v === 0) return "neutral";
  if (v === 1) return "warm";
  return "fond";
}
const clampDisp = (v) => Math.max(-3, Math.min(3, v));
/* Disposition nudges the odds of any bonus/volunteered information a
   villager offers: liked NPCs are more forthcoming, disliked ones less. */
function dispChance(p, disp) {
  const d = disp || 0;
  const adj = d >= 1 ? p * 1.25 : d <= -1 ? p * 0.6 : p;
  return Math.random() < Math.min(0.92, adj);
}

/* ================= HELPERS ================= */

const pick = (a) => a[Math.floor(Math.random() * a.length)];
const _recent = new Map();
function pickFreshIdx(key, arr, memory = 2) {
  const seen = _recent.get(key) || [];
  const candidates = arr.map((_, i) => i).filter((i) => !seen.includes(i));
  const idx = candidates.length ? candidates[Math.floor(Math.random() * candidates.length)] : Math.floor(Math.random() * arr.length);
  _recent.set(key, [idx, ...seen].slice(0, Math.min(memory, Math.max(arr.length - 1, 0))));
  return arr[idx];
}
const chance = (p) => Math.random() < p;
const monsterOf = (s) => MONSTERS.find((m) => m.id === s.monster.type);
const npcById = (s, id) => s.npcs.find((n) => n.id === id);
const untainted = (s) => s.npcs.filter((n) => n.alive && !n.turned && n.id !== s.monster.vid);
const turnedAlive = (s) => s.npcs.filter((n) => n.alive && n.turned);
const aliveNpcs = (s) => s.npcs.filter((n) => n.alive && !n.fled);
const possibleMonsters = (ticked) => MONSTERS.filter((m) => ticked.every((sg) => m.signs.includes(sg)));
/* pri ranks a dawn card for the five-card cap: 2 = must-keep (deaths, a
   villager marked for the rope, the note), 1 = normal (your own night's
   findings), 0 = atmosphere, dropped first. */
const ev = (t, pid, pri) => ({ t, pid, pri: pri === undefined ? 1 : pri });
const turnNightOf = (s, id) => { const d = s.deaths.find((x) => x.id === id && x.kind === "turned"); return d ? d.night : null; };

function ritePreparer(s, excludeId) {
  const ok = (id) => { const n = npcById(s, id); return n && n.alive && !n.fled && !n.turned && id !== excludeId; };
  if (ok("ansel")) return "Father Ansel";
  if (ok("greta")) return "Greta, who keeps her grandmother's lore";
  if (ok("wilhelm")) return "Wilhelm, from the rites his grandfather kept behind the anvil";
  return "You yourself, from the old books";
}

/* Same priority order as ritePreparer, with the success odds the Rite of
   Unbinding hangs on: the priest first, then Greta, then Wilhelm or, failing
   everyone, the player's own unsteady hand. */
function officiantFor(s, excludeId) {
  const ok = (id) => { const n = npcById(s, id); return n && n.alive && !n.fled && !n.turned && id !== excludeId; };
  if (ok("ansel")) return { name: "Father Ansel", p: 0.65 };
  if (ok("greta")) return { name: "Greta", p: 0.45 };
  if (ok("wilhelm")) return { name: "Wilhelm", p: 0.3 };
  return { name: "you yourself", p: 0.3 };
}

/* ---------- Rite of Unbinding: what leaves, and what is left ---------- */
function unbindSuccessScene(nm) {
  return [
    `${nm} arches up off the ground as if something inside them is trying to leave through the ceiling. For a moment there are two voices coming out of one throat, and only one of them is ${nm}'s.`,
    `Then it goes out of them all at once, like a held breath finally let go: through the mouth, or the eyes, or nowhere you can point to. The room goes cold, and then, slowly, does not.`,
    `${nm} collapses, sobbing, entirely their own again, and the first thing they do with their own mouth is apologize for whatever it made them say while it was wearing them.`,
  ];
}
function unbindFailDeathScene(nm) {
  return [
    `${nm} fights it, and for one terrible moment it looks almost like it might work: the shaking slows, the wrong voice under their voice thins to a thread.`,
    `Then what holds them holds tighter, and the body loses the argument all at once. Something in the throat gives way with a sound like a knuckle popping, and the jaw keeps moving after the eyes have already stopped.`,
    `It is not quick, and it is not kind, and by the time it stops, there is nothing left in ${nm} to unbind. What is left still stands, breathing, and looks at you with a patience that was never ${nm}'s own.`,
  ];

function unbindFailSurviveLine(nm) {
  return `The rite breaks against whatever has ${nm}, and does not even leave a mark on it. ${nm} goes on breathing, unbound, unhelped, and looks at you afterward the way you look at someone who has just tried and failed to save you.`;
}

function descriptorFor(s) {
  const monsterNpc = npcById(s, s.monster.vid);
  const alive2 = s.npcs.filter((x) => x.alive);
  const sexMatch = alive2.filter((x) => x.sex === monsterNpc.sex);
  const buildMatch = alive2.filter((x) => x.build === monsterNpc.build);
  // Never let a single glimpse narrow the field below 3 living candidates.
  if (buildMatch.length >= 3 && chance(0.5)) return { descr: `${monsterNpc.build} of build`, names: buildMatch.map((x) => x.name) };
  if (sexMatch.length >= 3) return { descr: monsterNpc.sex === "f" ? "a woman" : "a man", names: sexMatch.map((x) => x.name) };
  if (buildMatch.length >= 3) return { descr: `${monsterNpc.build} of build`, names: buildMatch.map((x) => x.name) };
  return { descr: "a face you knew, though you could not say whose", names: alive2.map((x) => x.name) };
}

/* Build sightings are uncertain: each yields the true build plus one plausible
   decoy. Sightings intersect across nights: a second look can settle it. */
const BUILDS = ["slight", "stooped", "tall", "stout"];
const buildCandidates = (s) => (s.buildClues && s.buildClues.length ? BUILDS.filter((b) => s.buildClues.every((c) => c.includes(b))) : null);
function addBuildClue(s) {
  const b = npcById(s, s.monster.vid).build;
  const pair = [b, pick(BUILDS.filter((x) => x !== b))];
  if (chance(0.5)) pair.reverse();
  s.buildClues = [...(s.buildClues || []), pair];
  const cands = buildCandidates(s);
  if (cands.length === 1) s.knownBuild = b;
  const names = s.npcs.filter((x) => x.alive && cands.includes(x.build)).map((x) => x.name);
  return { pair, cands, names, b };
}
const buildPhrase = (pair) => `${pair[0]} of build, or ${pair[1]}; the dark would not let you swear which`;

/* ================= GAME SETUP ================= */

function newGame() {
  const type = pick(MONSTERS);
  const vid = pick(NPC_DEFS).id;
  const s = {
    nightNum: 0, dayNum: 0, lastActive: -9, gameId: Math.random().toString(36).slice(2),
    planted: [], searchCount: {}, burned: [],
    monster: { type: type.id, vid },
    npcs: NPC_DEFS.map((n) => ({ ...n, alive: true, turned: false, known: false, fled: false, sawYouWatching: null, offendedExam: null, secretKnown: false, disp: [-2, -1, 0, 1, 2][Math.floor(Math.random() * 5)] })),
    patience: Object.fromEntries(NPC_DEFS.map((n) => [n.id, PERSONA[n.id].patience])),
    askedLog: {}, monsterClaims: {}, grudges: {},
    foundSigns: [], playerSigns: [], struckNpcs: [], locEvidence: Object.fromEntries(LOCS.map((l) => [l, []])),
    deaths: [], nightLogs: [], statements: [], playerSaw: [], clues: [], hardCleared: [],
    sideQuest: null, secretSpread: {},
    knownBuild: null, buildClues: [], monsterSawYou: false, mob: null, embolden: 0,
    dawn: [], dawnScene: null, dayEvents: [],
    ap: 2, questionedToday: [], investigatedNight: null, wrongExecutions: 0, defendedToday: false,
    enraged: false, fled: false, riteFails: 0, wrongGuesses: 0, over: null,
    struck: [], nightBeats: [], beatTitle: null, phase: "night",
    /* -- hidden fondness mechanic (Pass G2): a coin flip decided once, at
       the start of the game, never shown to the player directly. Bond only
       ever accrues when this is true, so the whole mechanic stays fully
       inert and undetectable for the majority of games where it isn't. -- */
    monsterFancies: Math.random() < 0.35, bond: 0, offerMade: false,
    coerceNote: null, monsterProtects: false, pendingOffer: null,
    offerBeats: [], noteExposedPending: false,
  };
  const pre = [];
  if (chance(0.4)) pre.push(ev(`${soundFor(type.id)} At the well this morning it is agreed, loudly, that it was only the wind.`, undefined, 0));
  return resolveNight(s, "home", pre);
}

function isActive(s, m, n) {
  if (n === 1) return true;
  if (n === s.embolden) return true;
  if (m.rhythm.kind === "strict") return (n - 1) % m.rhythm.n === 0;
  if (n - s.lastActive <= m.rhythm.gap) return false;
  return chance(m.rhythm.p);
}

/* ================= NIGHT RESOLUTION ================= */

/* Sample everything the night has decided: who is out and why, the weather,
   whether the thing hunts and where. The interactive night walk samples this
   before the player commits, and passes it back in as plan.facts, so what the
   player sees in the lanes is always the same night the dawn reports on. */
function sampleNight(s, m, n) {
  const active = isActive(s, m, n);
  const wx = chance(0.3) ? pick(["fog", "storm", "frost"]) : null;
  let evn = null;
  /* Night one is its own bespoke chapter: no village gathering competing with it. */
  if (n === 1) evn = null;
  else if (chance(wx === "storm" ? 0.07 : 0.15)) evn = pick(EVENTS);
  const eventLoc = evn ? evn.loc : null;
  const huntsCrowd = active && !!evn && m.reach !== "home" && chance(0.5);
  const outMap = {};
  const secretOut = {};
  const sc = s.searchCount || {};
  for (const npc of s.npcs) {
    if (!npc.alive) continue;
    if (npc.id === s.monster.vid) {
      if (huntsCrowd) outMap[npc.id] = eventLoc;
      else if (active) {
        /* A hunted thing shifts its ground: it leans away from wherever you keep searching. */
        const [a, b] = m.hunts;
        outMap[npc.id] = (sc[a] || 0) !== (sc[b] || 0) && chance(0.7) ? ((sc[a] || 0) < (sc[b] || 0) ? a : b) : pick(m.hunts);
      } else if (evn && chance(0.55)) outMap[npc.id] = eventLoc;
      else outMap[npc.id] = "home";
    } else if (evn) {
      if (npc.turned) outMap[npc.id] = chance(0.5) ? eventLoc : "home";
      else if (chance(0.75)) outMap[npc.id] = eventLoc;
      else if (SECRETS[npc.id] && chance(SECRETS[npc.id].outP)) { secretOut[npc.id] = true; outMap[npc.id] = SECRETS[npc.id].loc; }
      else outMap[npc.id] = "home";
    } else if (!npc.turned && SECRETS[npc.id] && chance(SECRETS[npc.id].outP)) {
      secretOut[npc.id] = true; outMap[npc.id] = SECRETS[npc.id].loc;
    } else {
      outMap[npc.id] = chance(0.25) ? pick(LOCS) : "home";
    }
  }
  /* Night one always draws blood: if the horror can only take those caught
     outdoors, force one villager into its path so the first kill cannot fail
     to land. (Monsters that can reach into homes never needed this push.) */
  if (n === 1 && active && m.reach !== "home") {
    const cand = s.npcs.filter((npc) => npc.alive && npc.id !== s.monster.vid);
    const someoneOut = cand.some((npc) => outMap[npc.id] && outMap[npc.id] !== "home");
    if (cand.length && !someoneOut) {
      const forced = pick(cand);
      outMap[forced.id] = pick(m.hunts);
    }
  }
  const huntLoc = active ? outMap[s.monster.vid] : null;
  return { active, wx, evn, eventLoc, huntsCrowd, outMap, secretOut, huntLoc };
}

function resolveNight(prev, planIn, preEvents) {
  const s = JSON.parse(JSON.stringify(prev));
  const m = monsterOf(s);
  const n = s.nightNum + 1;
  s.nightNum = n; s.dayNum = n;
  for (const id of Object.keys(s.patience)) {
    const pnpc = npcById(s, id);
    const dbonus = pnpc ? (pnpc.disp >= 1 ? 1 : pnpc.disp <= -1 ? -1 : 0) : 0;
    const cap = PERSONA[id].patience + (dbonus > 0 ? 1 : 0);
    s.patience[id] = Math.max(0, Math.min(cap, s.patience[id] + 1 + dbonus));
  }
  s.defendedToday = false;
  const plan = typeof planIn === "string" ? (planIn === "home" ? { kind: "home" } : { kind: "out", loc: planIn }) : planIn;
  const preBeats = [];

  /* ---- the mob's ultimatum falls due at this dusk ---- */
  if (s.mob && n === s.mob.deadline && !s.fled) {
    const tgt = npcById(s, s.mob.target);
    const acc = npcById(s, s.mob.accuser);
    if (tgt && tgt.alive) {
      preBeats.push(`At dusk, ${acc && acc.alive ? acc.name : "the mob"} makes good on the threat. Torches gather at ${tgt.name}'s door, and no one moves to stop them. Not even you.`);
      if (tgt.id === s.monster.vid) {
        preBeats.push(`The rope goes over the beam. ${tgt.name} does not struggle. ${tgt.name} smiles, and keeps smiling while the knot is tied, and it is the smiling that empties the front row.`);
        preBeats.push(`The rope snaps like thread. What stands up out of the dust is not ${tgt.name}, and never was. "Clever," it says into the silence, in a voice like something enjoying a new mouth. "Clever, clever ${acc && acc.alive ? acc.name : "little village"}. You counted right." It looks around the square, taking all the time in the world. "Nobody else did."`);
        if (acc && acc.alive) {
          preBeats.push(`Then it takes ${acc.name}. Not quickly. In the middle of the square, in front of everyone, while the torches gutter and nobody's legs will answer them, and what it says while it works is worse than the work itself: "${acc.name} always was the sharp one. Yes. I think I will keep the sharp part." When it finally goes over the churchyard wall, it takes that with it, and leaves the rest for the village to clean.`);
          s.npcs = s.npcs.map((x) => (x.id === acc.id ? { ...x, alive: false } : x));
          s.deaths.push({ night: n, id: acc.id, name: acc.name, kind: "slain", where: "Village Square", examined: false, found: [] });
        }
        preBeats.push("The mob was right about the face and knew nothing of the name. Learn its true nature from what it leaves behind. It will come back every night until there is no one left to come back for.");
        s.fled = true;
        s.npcs = s.npcs.map((x) => (x.id === tgt.id ? { ...x, fled: true } : x));
        s.mob = null;
      } else {
        s.npcs = s.npcs.map((x) => (x.id === tgt.id ? { ...x, alive: false, known: x.turned ? true : x.known } : x));
        s.deaths.push({ night: n, id: tgt.id, name: tgt.name, kind: "mobbed" });
        if (acc && acc.alive && !tgt.turned) s.ropeStain = acc.id;
        if (!tgt.turned) s.calmHope = tgt.name;
        if (tgt.turned) preBeats.push(`As the rope draws tight, ${tgt.name}'s eyes flash with something that was never theirs. A moan goes through the crowd. Changed. And hanged too late to matter.`);
        else preBeats.push(`${tgt.name} calls your name at the end. Not the mob's. Yours. Because you could have found the truth, and did not, in time.`);
        s.mob = null;
      }
    } else { s.mob = null; }
  }

  /* ---- fled endgame: it besieges the village ---- */
  if (s.fled) {
    const beats = [...preBeats];
    const dawn = [...(preEvents || [])];
    const monsterNpc = npcById(s, s.monster.vid);
    if (plan.kind === "rite") {
      const declared = MONSTERS.find(x => x.id === plan.typeId);
      beats.push(`At dusk, what is left of Hollow's Edge gathers in the square. ${ritePreparer(s)} prepares the rite for a ${declared.name}: the ${METHODS[declared.method]}.`);
      beats.push("You do not have to summon it. It has been waiting for exactly this.");
      if (plan.typeId === s.monster.type) {
        beats.push(`It comes out of the dark straight at the circle, sure of itself, and the rite is the right rite.`);
        beats.push(METHOD_KILL_LINES[declared.method]);
        beats.push(`What dies in the square wore ${monsterNpc.name}'s face for years. It will not wear anyone's again.`);
        s.over = { win: true, reason: "won", text: `You named it truly at the last: a ${m.name}. The ${METHODS[m.method]} ended it in the square, in front of everyone it fed on.` };
        s.nightBeats = beats; s.beatTitle = "THE LAST RITE"; s.phase = "night"; s.dawn = dawn;
        s.nightLogs.push({ night: n, active: true, huntLoc: "Village Square", outMap: {}, wail: false, weather: null, event: null });
        return s;
      }
      s.riteFails += 1;
      s.wrongGuesses += 1;
      beats.push(`It comes out of the dark, walks to the very edge of the circle, and stops. The ${METHODS[declared.method]} means nothing to it.`);
      if (s.wrongGuesses >= 2) {
        monsterKillsAccuser(s, beats, "It does not take a neighbour this time. It steps across the dead circle, unhurried, straight to you, and the village that stood here on your word steps back and lets it.", "the square");
        s.nightBeats = beats; s.beatTitle = `NIGHT ${n} \u00b7 UNDER SIEGE`; s.phase = "night"; s.dawn = dawn;
        s.nightLogs.push({ night: n, active: true, huntLoc: null, outMap: {}, wail: false, weather: null, event: null });
        return s;
      }
      const cand = untainted(s);
      if (cand.length) {
        const v = pick(cand);
        beats.push(`It takes ${v.name} from the edge of the torchlight, almost gently, and is gone before the screaming starts.`);
        s.npcs = s.npcs.map((x) => (x.id === v.id ? { ...x, alive: false } : x));
        s.deaths.push({ night: n, id: v.id, name: v.name, kind: "slain", where: "Village Square", examined: false, found: [] });
        dawn.push(ev(`${v.name} ${v.role} was taken at the failed rite. What is left was found at the tree line.`, v.id, 2));
      }
      beats.push("Wrong. The books, the signs, something. You have very little village left to be wrong with, and no wrong names left at all.");
    } else {
      beats.push("You barricade with the others in the church and listen to it work its way around the walls, patient as weather.");
      const cand = untainted(s);
      if (cand.length && chance(0.85)) {
        const v = pick(cand);
        const sk = pickFreshIdx("siegeKills", SIEGE_KILLS);
        beats.push(sk.beat(v));
        s.npcs = s.npcs.map((x) => (x.id === v.id ? { ...x, alive: false } : x));
        s.deaths.push({ night: n, id: v.id, name: v.name, kind: "slain", where: "home", examined: false, found: [] });
        dawn.push(ev(sk.dawn(v), v.id, 2));
      } else {
        dawn.push(ev("The night passes. It circles, and tests, and finds no one. There will not be many more such nights."));
      }
    }
    s.nightLogs.push({ night: n, active: true, huntLoc: null, outMap: {}, wail: false, weather: null, event: null });
    s.dawn = dawn; s.nightBeats = beats; s.beatTitle = `NIGHT ${n} \u00b7 UNDER SIEGE`; s.phase = "night";
    s.dawnScene = { loc: "Old Church", kind: s.deaths.find(d => d.night === n && d.kind === "slain") ? "body" : "quiet" };
    s.dayEvents = []; s.ap = 2; s.questionedToday = []; s.investigatedNight = null;
    if (!s.over && untainted(s).length <= 1) {
      s.over = { win: false, reason: "lost", text: `It took them all, one patient night at a time, while you searched the books for its true name. ${monsterNpc.name}'s face was the last thing most of them saw.` };
    }
    return s;
  }

  const out = plan.kind === "out";
  const watching = plan.kind === "watch" ? plan.id : null;
  const exposed = out || !!watching;
  const f = plan.facts || sampleNight(s, m, n);
  const { active, wx, evn, eventLoc, huntsCrowd, outMap, secretOut, huntLoc } = f;
  if (active) s.lastActive = n;
  const dawn = [...(preEvents || [])];
  const beats = [...preBeats];
  const mods = plan.mods || {};
  const monsterNpc = npcById(s, s.monster.vid);

  /* event incidents */
  let evFight = null, evPair = null, evWander = null, evOdd = [], evSweepFind = null, evSweepSense = null;
  if (evn) {
    const attendees = s.npcs.filter((x) => x.alive && outMap[x.id] === eventLoc);
    evOdd = attendees.filter((x) => x.turned && chance(0.6)).map((x) => x.id);
    if (attendees.length >= 2 && chance(0.2)) { const a = pick(attendees); const b = pick(attendees.filter((x) => x.id !== a.id)); evFight = [a.id, b.id]; s.grudges[a.id] = { other: b.id, until: n + 3 }; s.grudges[b.id] = { other: a.id, until: n + 3 }; }
    if (attendees.length >= 2 && chance(0.25)) { const cand2 = attendees.filter((x) => !evFight || !evFight.includes(x.id)); if (cand2.length >= 2) { const a = pick(cand2); const b = pick(cand2.filter((x) => x.id !== a.id)); evPair = [a.id, b.id]; } }
    if (attendees.length && chance(0.15)) { const w = pick(attendees.filter((x) => x.id !== s.monster.vid && x.id !== mods.follow && x.id !== mods.hailed)); if (w) { evWander = w.id; outMap[w.id] = "Dark Forest"; } }
    if (evn.id === "sweep") { const unfound = s.locEvidence["Graveyard"].filter((sg) => !s.foundSigns.includes(sg)); if (unfound.length && chance(0.35)) { evSweepFind = pick(unfound); evSweepSense = senseFor(evSweepFind); s.foundSigns.push(evSweepFind); } }
  }

  if (n === 1) {
    /* Night one is its own bespoke chapter: no generic dusk pool, no weather
       aside, no gathering, no watch/out variants: the game always resolves
       the very first night as a night spent behind a barred door. */
    beats.push(...pickFreshIdx("n1open", NIGHT_ONE_OPENINGS, 8));
    beats.push(pickFreshIdx("n1home", NIGHT_ONE_HOME_LINES, 4));
  } else {
    beats.push(pickFreshIdx("duskLines", DUSK_LINES));
    /* -- follow-through: last night's panic, or last night's false calm,
       gets one echo line at this dusk before the night moves on -- */
    if (s.lastPanic && s.lastPanic.night === n - 1) {
      const echoPool = PANIC_ECHOES[s.lastPanic.kind] || PANIC_ECHOES[0];
      beats.push(pick(echoPool)(s.lastPanic.name));
      s.lastPanic = null;
    }
    if (s.calmEchoNight === n - 1) {
      beats.push(`Doors that stood unbarred yesterday are shut fast again tonight, one by one, and nobody quite meets anybody's eye about why.`);
      s.calmEchoNight = null;
    }
    if (wx) beats.push(WEATHER[wx].beat);
    if (evn) {
      beats.push(evn.intro);
      if (evFight) beats.push(pick(EVENT_INCIDENT_FIGHT)(npcById(s, evFight[0]).name, npcById(s, evFight[1]).name));
      if (evPair) beats.push(pick(EVENT_INCIDENT_PAIR)(npcById(s, evPair[0]).name, npcById(s, evPair[1]).name));
      if (evWander) beats.push(`${npcById(s, evWander).name} drifts off from the ${evn.name} alone, toward the trees, and no one thinks to call them back.`);
      if (evSweepFind) beats.push(`A shout goes up from the search: something found among the stones. ${evSweepSense} It is passed hand to hand in the torchlight, and nobody wants to hold it long.`);
    }
    if (plan.kind === "home") beats.push(pickFreshIdx("homeLines", HOME_LINES));
    else if (out && !plan.facts) beats.push(pickFreshIdx("outLines", OUT_LINES)(plan.loc));
    else if (watching && !plan.facts) beats.push(pickFreshIdx("watchLines", WATCH_LINES)(npcById(s, watching).name));
    /* interactive out/watch walks already opened AND arrived on-screen, live,
       in the night walk itself (walk.log, seeded from OUT_LINES/WATCH_LINES
       at startWalk/startWatchWalk): the recap must never re-narrate a
       second, differently worded telling of the same opening beat. */
  }

  const wailTonight = n === 1 ? false : ((m.id === "banshee" && n % m.rhythm.n === 0) || (m.id === "hag" && active));
  if (wailTonight) {
    beats.push("A thin wailing rises over the rooftops, from everywhere and nowhere at once. It goes on far too long.");
    dawn.push(ev(n <= 3
      ? "In the small hours, a thin wailing rolled over the rooftops. Wind, said some. Not wind, said others."
      : "The wailing came again in the night, closer this time."));
    if (exposed && !s.foundSigns.includes("wail")) {
      s.foundSigns.push("wail");
      dawn.push(ev(`You were out when it came. That was no wind. ${senseFor("wail")}`));
    }
  }

  if (n > 1 && active && wx !== "storm" && chance(0.35)) beats.push(soundFor(m.id));
  if (n > 1 && chance(0.18)) {
    if (chance(0.25)) beats.push(pickFreshIdx("gossipNamed", GOSSIP_NAMED)(pick(s.npcs.filter((x) => x.alive)).name));
    else beats.push(pickFreshIdx("gossip", GOSSIP));
  }

  const finish = () => {
    s.nightLogs.push({ night: n, active, huntLoc, outMap, secretOut, you: out ? { kind: "out", loc: plan.loc } : watching ? { kind: "watch", id: watching } : { kind: "home" }, wail: wailTonight, weather: wx, event: evn ? { id: evn.id, name: evn.name, loc: eventLoc, odd: evOdd, fight: evFight, pair: evPair } : null });
    /* Cap the morning at five cards, keeping the most important: rank by pri
       (deaths, a villager marked, the note first), stable within a tier so the
       night still reads in order, and drop trailing atmosphere. */
    s.dawn = dawn.length > 5
      ? dawn.map((e, i) => ({ e, i })).sort((a, b) => ((b.e.pri || 1) - (a.e.pri || 1)) || (a.i - b.i)).slice(0, 5).sort((a, b) => a.i - b.i).map((x) => x.e)
      : dawn;
    s.nightBeats = beats; s.beatTitle = `NIGHT ${n}`; s.phase = "night";
    return s;
  };

  /* -- follow consequences: the reveal was LIVED in the walk; here we settle
     the ledger. Shared by both the "out" walk's lane-follow and the "watch a
     villager" flow: whichever way the player ended up tailing someone, the
     resolution logic and its odds are identical. -- */
  const applyFollowConsequence = () => {
    const fw = npcById(s, mods.follow);
    const fDest = outMap[fw.id] || plan.loc;
    s.playerSaw.push({ night: n, id: fw.id, loc: fDest });
    if (fw.id === s.monster.vid && active) {
      const act = mods.followAct || "flee";
      /* -- the armed confrontation: if the player's journal has been worked
         down to exactly ONE possible creature, they went out carrying that
         creature's remedy. Confront it and name it truly, and it dies here,
         in the dark, before it can take another soul. Name it wrong, and
         what is in your hands is so much tin. -- */
      if (act === "confront") {
        const reckoning = MONSTERS.filter((mm) => !s.struck.includes(mm.id) && (s.playerSigns || []).every((sg) => mm.signs.includes(sg)));
        if (reckoning.length === 1) {
          const guess = reckoning[0];
          if (guess.id === s.monster.type) {
            if (chance(0.75)) {
              beats.push(`You step out of the shadow with the ${METHODS[guess.method]} already in your hands, and you say ${fw.name}'s name, and then the other one. The true one.`);
              beats.push(`It goes very still. For one long breath the two of you stand together in the dark it thought it owned, and it understands, before anyone else in the village does, that you have done the arithmetic.`);
              beats.push(METHOD_KILL_LINES[guess.method]);
              beats.push(`What dies at the ${fDest} wore ${fw.name}'s face for years. No torches. No square. No rope. Just you, and the dark, and the end of it, one full night before it would have fed again.`);
              s.over = { win: true, reason: "won", text: `You did not wait for dusk and a crowd. You named it at the ${fDest}: a ${guess.name}. The ${METHODS[guess.method]} ended it in the dark, before it could take one more soul.` };
              return true;
            }
            beats.push(`You step out with the ${METHODS[guess.method]} in your hands and the right name in your mouth, and you are half a heartbeat too slow with both.`);
            beats.push(...(DEATH_SCENES[m.id] || DEATH_SCENES.wraith)(fw.name, fDest));
            s.over = { win: false, reason: "slain", text: `You named it truly at the ${fDest}. It was faster than the truth.` };
            return true;
          }
          /* the wrong name, carried into the dark */
          if (chance(0.7)) {
            beats.push(`You step out with the ${METHODS[guess.method]} raised and say the wrong name. It looks at what you are holding the way a man looks at a child's wooden sword, and then it laughs, low and delighted, and the laugh is what tells your legs to run before your mind has finished understanding.`);
            beats.push(...(DEATH_SCENES[m.id] || DEATH_SCENES.wraith)(fw.name, fDest));
            s.over = { win: false, reason: "slain", text: `You confronted it at the ${fDest} carrying the wrong rite. It let you finish saying the wrong name before it began.` };
            return true;
          }
          if (!s.struck.includes(guess.id)) s.struck = [...s.struck, guess.id];
          s.clues.push(`Night ${n}: you put the ${METHODS[guess.method]} to it and the thing only laughed. Whatever wears ${fw.name}'s face, it is NOT a ${guess.name}. Strike the name and start the arithmetic again.`);
          s.fled = true;
          s.npcs = s.npcs.map((x) => (x.id === fw.id ? { ...x, fled: true } : x));
          beats.push(`You step out with the ${METHODS[guess.method]} raised, and it does not even flinch. It smiles with far too much of its face, drops the pretence like a coat, and is over the churchyard wall before your heart restarts. Wrong name. Right face. It has nothing left to hide now, and nothing left to lose.`);
          dawn.push(ev(`The village knows the face now: ${fw.name}. And you know one thing more than they do: it is no ${guess.name}. Only the right rite ends this, and you will not get more than two tries.`, fw.id));
          return false;
        }
      }
      let deathP2 = act === "confront" ? 0.6 : act === "watch" ? 0.35 : 0.15;
      if (s.monsterProtects) deathP2 = Math.max(0.02, deathP2 - 0.15);
      if (chance(deathP2)) {
        /* -- Pass G2: the climactic offer, in place of death -- */
        if (s.monsterFancies && s.bond >= OFFER_BOND_MIN && n >= OFFER_MIN_NIGHT && !s.offerMade) {
          s.offerMade = true;
          s.pendingOffer = { name: fw.name, where: fDest, overText: `You followed ${fw.name} out past the last house. Only one of you came back, and it was not you.` };
          s.offerBeats = (OFFER_SCENES[m.id] || OFFER_SCENES.wraith)(fw.name);
          finish();
          s.phase = "offer";
          return "offer";
        }
        beats.push(act === "confront" ? `You step out of the shadow and say ${fw.name}'s name. It is very glad you did.` : "You move. And it is already facing you. It was always already facing you.");
        beats.push(...(DEATH_SCENES[m.id] || DEATH_SCENES.wraith)(fw.name, fDest));
        s.over = { win: false, reason: "slain", text: `You followed ${fw.name} out past the last house. Only one of you came back, and it was not you.` };
        return true;
      }
      s.clues.push(`Night ${n}: you followed ${fw.name} to the ${fDest} and watched ${fw.name} stop being ${fw.name}. Whatever wears that face, you are certain of the face now.`);
      if (s.monsterFancies) s.bond = (s.bond || 0) + 1;
      if (act === "confront") {
        s.fled = true;
        s.npcs = s.npcs.map((x) => (x.id === fw.id ? { ...x, fled: true } : x));
        beats.push(`You step out and say the name aloud. It goes very still. Then it smiles with far too much of its face, drops the last of the pretence like a coat, and is over the churchyard wall before your heart restarts. The mask is off. It has nothing left to hide, and nothing left to lose.`);
        dawn.push(ev(`The village knows the face now: ${fw.name}. It does not know the name of the thing, and only the right rite will end this. Study the signs. You will not get more than two tries.`, fw.id));
      } else if (act === "watch") {
        if (!s.knownBuild) { s.knownBuild = fw.build; s.buildClues = [...(s.buildClues || []), [fw.build, fw.build]]; }
        s.monsterSawYou = chance(0.6) ? true : s.monsterSawYou;
        beats.push(`You stay, and you watch, and you memorize everything: the gait, the build, the wrongness, until it lifts its head and tastes the air, and you leave before it finishes.`);
        dawn.push(ev(`What you watched ${fw.name} do at the ${fDest} last night has an entry in your journal now, written in a hand that shakes.`, fw.id));
      } else {
        s.monsterSawYou = chance(0.4) ? true : s.monsterSawYou;
        beats.push(`You go back the way you came, slowly, placing each foot like a debt, and do not breathe properly until your own bolt is thrown.`);
        dawn.push(ev(`You fled quietly from what you saw at the ${fDest}. Your journal holds the rest.`, fw.id));
      }
    } else if (fw.turned) {
      s.npcs = s.npcs.map((x) => (x.id === fw.id ? { ...x, known: true } : x));
      const helped = mods.followAct === "help";
      s.clues.push(`Night ${n}: you followed ${fw.name} to the ${fDest} and watched them stand facing away from the moon, hour on hour. ${fw.name} is changed.`);
      beats.push(helped
        ? `You step out and try to reach them: a hand at the shoulder, their name said twice, softly. ${fw.name} turns toward you with a face that almost remembers being glad to see you, and then does not. Whatever is left to reach is not close enough to the surface tonight. You let go before it decides to reach back.`
        : "You slip away with what you know, and what you know follows you home.");
      dawn.push(ev(`What you watched ${fw.name} do in the night was not the act of a living neighbour. You are certain now: they are changed.${helped ? " You tried to reach them. Whatever answered was not quite them yet." : ""}`, fw.id));
    } else if (secretOut[fw.id]) {
      const sec = SECRETS[fw.id];
      s.npcs = s.npcs.map((x) => (x.id === fw.id ? { ...x, secretKnown: true } : x));
      beats.push("You leave without being seen. Some secrets are only secrets.");
      s.clues.push(`Night ${n}: ${fw.name}'s night errand, witnessed: ${sec.short}. Human, and nothing worse. Their lies about the nights are explained.`);
      dawn.push(ev(`You know ${fw.name}'s secret now: ${sec.short}. Whatever they claim about their nights, you know the human truth of it.`, fw.id));
    } else {
      beats.push(`You leave ${fw.name} to their blameless errand and take yourself home, feeling a fool, and glad of the feeling.`);
      dawn.push(ev(pickFreshIdx("dawnPlainFollow", DAWN_PLAIN_FOLLOW)(fw.name, fDest), fw.id));
    }
    return false;
  };
  if (mods.follow) {
    const followEnded = applyFollowConsequence();
    if (followEnded === "offer") return s;
    if (followEnded) return finish();
  }

  /* --- player out searching --- */
  let playerGlimpsed = false;
  if (out) {
    s.searchCount = s.searchCount || {};
    s.searchCount[plan.loc] = (s.searchCount[plan.loc] || 0) + 1;

    /* -- someone hailed in the lane during the walk -- */
    if (mods.hailed) {
      const hw = npcById(s, mods.hailed);
      const hDest = outMap[hw.id];
      s.playerSaw.push({ night: n, id: hw.id, loc: hDest });
      s.npcs = s.npcs.map((x2) => (x2.id === hw.id ? { ...x2, sawYouOut: [...(x2.sawYouOut || []), { night: n, loc: "the lanes", met: true }] } : x2));
      if (hw.id === s.monster.vid && active) {
        s.monsterSawYou = true;
        if (s.monsterFancies) s.bond = (s.bond || 0) + 1;
        s.clues.push(`Night ${n}: you hailed ${hw.name} in the lane. The smile took a beat too long to arrive. It knows your voice now.`);
        dawn.push(ev(`You spoke to ${hw.name} in the dark last night, and something about the exchange has not let you sleep since. It knows you walk at night now.`, hw.id));
      } else if (secretOut[hw.id]) {
        s.clues.push(`Night ${n}: you met ${hw.name} in the lane, bound for the ${hDest}. They claimed sleeplessness, and claimed it badly.`);
        dawn.push(ev(`${hw.name} was out last night, whatever they say by daylight. You met them in the lane, making for the ${hDest}, hiding something ordinary or something not.`, hw.id));
      } else if (hDest && hDest !== "home") {
        dawn.push(ev(`You met ${hw.name} in the lane last night, bound openly for the ${hDest}. One person's night is accounted for, from their own mouth, to your own face.`, hw.id));
      }
    }

    /* someone watched openly on the way past (plain follow, then carried on) */
    if (mods.followSeen && npcById(s, mods.followSeen)) {
      const fs2 = npcById(s, mods.followSeen);
      s.playerSaw.push({ night: n, id: fs2.id, loc: outMap[fs2.id] || plan.loc });
      dawn.push(ev(`${fs2.name}'s night is accounted for: you watched their errand yourself, and it was nobody's business but theirs.`, fs2.id));
    }

    /* -- boundary-circuit sightings: lived live in the walk, settled here -- */
    if (mods.circleSaw && npcById(s, mods.circleSaw)) {
      const cw = npcById(s, mods.circleSaw);
      const cDest = outMap[cw.id] || plan.loc;
      if (!s.playerSaw.some((psw) => psw.night === n && psw.id === cw.id)) s.playerSaw.push({ night: n, id: cw.id, loc: cDest });
      dawn.push(ev(`From the boundary lanes you saw ${cw.name} abroad in the night, making for the ${cDest}. One more night accounted for in your journal, whatever they claim by daylight.`, cw.id));
    }
    if (mods.circleFigure && active && huntLoc && !s.over) {
      if (!s.knownBuild && chance(0.6)) {
        const bc = addBuildClue(s);
        if (bc.cands.length === 1) {
          s.clues.push(`Night ${n}: the hooded shape from the boundary lanes, bound for the ${huntLoc}. Taken with what you saw before, its build is certain now: ${bc.b}. That fits: ${bc.names.join(", ")}.`);
          dawn.push(ev(`The shape you saw from the boundary lanes was making for the ${huntLoc}. Taken together, your sightings agree on its build: ${bc.b}. That narrows the field.`));
        } else {
          s.clues.push(`Night ${n}: the hooded shape from the boundary lanes, bound for the ${huntLoc}: ${bc.pair[0]} or ${bc.pair[1]} of build, you could not swear which. That fits: ${bc.names.join(", ")}.`);
          dawn.push(ev(`A hooded shape crossed between the houses in the night, making for the ${huntLoc}. Its build: ${bc.pair[0]}, or perhaps ${bc.pair[1]}. Another look might settle it.`));
        }
      } else {
        dawn.push(ev(`Something crossed between the houses last night, making for the ${huntLoc}, with a purpose nothing innocent owns. Whoever claims that road was empty is lying.`));
      }
    }

    if (mods.soundChase) {
      if (active) {
        const heard = mods.soundHeard || soundFor(m.id);
        /* interactive walks already lived and resolved this on-screen in the
           new "chased" stage: only the non-interactive fallback narrates it
           here. Either way, the clue/dawn bookkeeping still lands. */
        if (!plan.facts) beats.push(`You follow the sound until it stops being ahead of you and starts being everywhere at once. You stand very still in the middle of it, and listen, and learn something you will not be able to unlearn. ${heard}`);
        s.clues.push(`Night ${n}: you chased a sound through the lanes and nearly caught it: ${heard}`);
        dawn.push(ev("What you followed through the dark last night left no prints. But the sound of it is written in your journal, and sounds do not lie the way faces do."));
      } else if (!plan.facts) {
        beats.push(pickFreshIdx("soundChaseMundane", SOUND_CHASE_MUNDANE));
      }
    }
    if (mods.follow && mods.followAct === "home" && !s.over) {
      /* saw their blameless errand and went home */
    } else if (mods.approach === "back") {
      beats.push(`Short of the ${plan.loc}, your nerve makes the decision for you. You turn for home, skin prickling, and do not run only because running invites the chase.`);
      dawn.push(ev(`You turned back before the ${plan.loc} last night. Whatever was there kept what it knows, and so did you. But you are alive to be careful again.`));
    } else if (active && plan.loc === huntLoc && mods.follow !== s.monster.vid) {
      const press = mods.approach === "press";
      /* a hunt playing out at the edge of an event's own firelight/crowd gives
         cover: lower odds of being caught, higher odds of a glimpse in the
         crush of people */
      const atEventCrowd = !!(huntsCrowd && evn && plan.loc === eventLoc);
      let deathP = (mods.approach === "press" ? (s.enraged ? 0.7 : 0.5) : mods.approach === "shadow" ? (s.enraged ? 0.5 : 0.22) : (s.enraged ? 0.6 : 0.35)) + (mods.soundChase ? 0.08 : 0);
      /* what happened during the "something in the lane" hide beat, if there
         was one, carries forward into how exposed you are here */
      if (mods.hid === "still") deathP += 0.25;
      else if (mods.hid === "shadow") deathP -= 0.05;
      else if (mods.hid === "doorway") deathP -= 0.03;
      if (atEventCrowd) deathP -= 0.08;
      if (s.monsterProtects) deathP -= 0.15;
      deathP = Math.min(0.92, Math.max(0.05, deathP));
      if (chance(deathP)) {
        if (s.monsterFancies && s.bond >= OFFER_BOND_MIN && n >= OFFER_MIN_NIGHT && !s.offerMade) {
          s.offerMade = true;
          s.pendingOffer = { name: monsterNpc.name, where: plan.loc, overText: `Something found you at the ${plan.loc}. Your lantern was discovered at dawn, still burning beside what remained.` };
          s.offerBeats = (OFFER_SCENES[m.id] || OFFER_SCENES.wraith)(monsterNpc.name);
          finish();
          s.phase = "offer";
          return s;
        }
        beats.push(...(DEATH_SCENES[m.id] || DEATH_SCENES.wraith)(monsterNpc.name, plan.loc));
        s.over = { win: false, reason: "slain", text: `Something found you at the ${plan.loc}. Your lantern was discovered at dawn, still burning beside what remained.` };
        return finish();
      }
      if (wx !== "fog" && chance((press ? 0.75 : mods.hid === "doorway" ? 0.65 : 0.5) + (atEventCrowd ? 0.1 : 0))) {
        const d = descriptorFor(s);
        s.clues.push(`Night ${n}: at the ${plan.loc}, a glimpse: ${d.descr}. That fits ${d.names.join(", ")}.`);
        beats.push(`A shape crosses your lantern light. A face, half-seen: ${d.descr}. Then nothing but the dark and your own heartbeat.`);
        dawn.push(ev(`You came face to face with something at the ${plan.loc}, and lived. What you saw: ${d.descr}. Among the living, that fits ${d.names.join(", ")}.`));
        playerGlimpsed = true;
      } else {
        s.playerSaw.push({ night: n, id: null, loc: plan.loc });
        beats.push(`Across the open ground, a shape moves with terrible purpose${wx === "fog" ? ", smeared to nothing by the fog" : ""}. You press yourself flat against cold stone and watch.`);
        if (!s.knownBuild && chance(press ? 1 : wx === "fog" ? 0.4 : 0.9)) {
          const bc = addBuildClue(s);
          if (bc.cands.length === 1) {
            beats.push(`Between this night and the last, one thing is settled: the shape is ${bc.b} of build. No doubt is left in it.`);
            s.clues.push(`Night ${n}: the shape at the ${plan.loc} again. Taken with what you saw before, its build is certain now: ${bc.b}. By day, that fits: ${bc.names.join(", ")}.`);
            dawn.push(ev(`A dark shape moved at the ${plan.loc}. Taken together, your sightings agree on its build: ${bc.b}. That narrows the field.`));
          } else {
            beats.push(`One thing you half-caught before the dark took it back: the shape was ${buildPhrase(bc.pair)}.`);
            s.clues.push(`Night ${n}: the shape at the ${plan.loc} was ${bc.pair[0]} or ${bc.pair[1]} of build; you could not swear which. By day, that fits: ${bc.names.join(", ")}.`);
            dawn.push(ev(`A dark shape moved at the ${plan.loc} with terrible purpose. Its build: ${bc.pair[0]}, or perhaps ${bc.pair[1]}. Another look might settle it.`));
          }
        } else {
          dawn.push(ev(`Again a dark shape at the ${plan.loc}. Whoever claims that place was quiet last night is lying.`));
        }
      }
    } else if (!plan.facts && active && chance(mods.style === "circle" ? 0.55 : 0.25)) {
      /* phantom-encounter guard: this is a purely fact-driven random sighting
         with no corresponding beat in the interactive walk's own queue: the
         walk's "lane" node is the only lane encounter the player actually
         lived through, so this only fires for the non-interactive fallback. */
      if (!s.knownBuild && chance(0.6)) {
        const bc = addBuildClue(s);
        if (bc.cands.length === 1) {
          s.clues.push(`Night ${n}: a hooded figure passed you in the lane, hurrying toward the ${huntLoc}. Taken with what you saw before, its build is certain now: ${bc.b}. That fits: ${bc.names.join(", ")}.`);
          beats.push(`A hooded figure passes you in the lane, hurrying toward the ${huntLoc}. And this time the sighting settles it: ${bc.b} of build, past all doubt. Neither of you speaks.`);
          dawn.push(ev(`A hooded figure passed you in the night, making for the ${huntLoc}. Taken together, your sightings agree on its build: ${bc.b}.`));
        } else {
          s.clues.push(`Night ${n}: a hooded figure passed you in the lane, hurrying toward the ${huntLoc}. ${bc.pair[0].charAt(0).toUpperCase() + bc.pair[0].slice(1)} or ${bc.pair[1]} of build; you could not swear which. That fits: ${bc.names.join(", ")}.`);
          beats.push(`A hooded figure passes you in the lane, hurrying the other way, toward the ${huntLoc}. ${buildPhrase(bc.pair).charAt(0).toUpperCase() + buildPhrase(bc.pair).slice(1)}. Neither of you speaks.`);
          dawn.push(ev(`A hooded figure passed you in the night, making for the ${huntLoc}. You could not see the face. Its build: ${bc.pair[0]}, or perhaps ${bc.pair[1]}.`));
        }
      } else {
        beats.push(`A hooded figure passes you in the lane, hurrying toward the ${huntLoc}. You keep your eyes down and your feet moving.`);
        dawn.push(ev(`Someone hooded passed you in the night, making for the ${huntLoc}. Whoever claims they slept soundly may be worth pressing.`));
      }
    }
    /* went home after following someone on a blameless errand: the night ends
       here, safe, without rolling the outdoor search/danger the rest of the walk uses */
    const wentHome = mods.follow && mods.followAct === "home";
    let wraithHomeP = 0.2;
    if (s.monsterProtects) wraithHomeP = Math.max(0.02, wraithHomeP - 0.15);
    if (!wentHome && m.id === "wraith" && active && plan.loc !== huntLoc && !s.over && chance(wraithHomeP)) {
      beats.push("The lane behind you has gone wrong-quiet. The cold arrives before it does.");
      if (s.monsterFancies && s.bond >= OFFER_BOND_MIN && n >= OFFER_MIN_NIGHT && !s.offerMade) {
        s.offerMade = true;
        s.pendingOffer = { name: monsterNpc.name, where: "road home", overText: "A cold you had never known closed around you on the road home. The Wraith takes those who wander." };
        s.offerBeats = (OFFER_SCENES[m.id] || OFFER_SCENES.wraith)(monsterNpc.name);
        finish();
        s.phase = "offer";
        return s;
      }
      beats.push(...DEATH_SCENES.wraith(monsterNpc.name, "road home"));
      s.over = { win: false, reason: "slain", text: "A cold you had never known closed around you on the road home. The Wraith takes those who wander." };
      return finish();
    }
    if (!wentHome && mods.approach !== "back") {
      const unfound = s.locEvidence[plan.loc].filter((sg) => !s.foundSigns.includes(sg));
      if (plan.facts && mods.searchRoll) {
        /* the interactive walk already rolled and SHOWED this result live;
           here we only settle the ledger, never re-roll or re-narrate */
        if (mods.searchRoll.found && !s.foundSigns.includes(mods.searchRoll.found)) {
          s.foundSigns.push(mods.searchRoll.found);
          dawn.push(ev(`Searching the ${plan.loc} by lantern light, you found something. ${mods.searchRoll.sense}`));
        } else if (!mods.searchRoll.found && !playerGlimpsed) {
          dawn.push(ev(pickFreshIdx("searchNothing", SEARCH_NOTHING)(plan.loc)));
        }
      } else {
        let findP = wx === "frost" && unfound.some((sg) => SIGN_CATS.ground.includes(sg)) ? 0.8 : 0.6;
        if (mods.style === "ground") findP = Math.min(0.92, findP + 0.25);
        /* shifting for a better look during the mid-vigil beat trades safety for signal */
        if (mods.vigil === "shift") findP = Math.min(0.95, findP + 0.15);
        if (wx === "storm") findP = Math.max(0.15, findP - 0.2);
        if (unfound.length && chance(findP)) {
          const sg = pick(unfound);
          s.foundSigns.push(sg);
          const sense = senseFor(sg);
          beats.push(`Your lantern catches something half-hidden at your feet. You crouch, and look, and wish you had not. ${sense}`);
          dawn.push(ev(`Searching the ${plan.loc} by lantern light, you found something. ${sense}`));
        } else if (!playerGlimpsed) {
          dawn.push(ev(pickFreshIdx("searchNothing", SEARCH_NOTHING)(plan.loc)));
        }
      }
      if (plan.facts) {
        /* interactive walk: the ONLY other villagers reported here are the
           ones the walk's own "company" node actually showed the player
           (mods.company, computed once at startWalk from the same facts):
           never a fresh scan of the full roster, so the dawn report can
           never describe an encounter that never happened on screen. */
        for (const id of mods.company || []) {
          const npc = npcById(s, id);
          if (!npc || !npc.alive) continue;
          if (s.playerSaw.some((psw) => psw.night === n && psw.id === npc.id)) continue;
          s.playerSaw.push({ night: n, id: npc.id, loc: plan.loc });
          if (chance(mods.vigil === "shift" ? 0.85 : 0.6)) s.npcs = s.npcs.map((x2) => (x2.id === npc.id ? { ...x2, sawYouOut: [...(x2.sawYouOut || []), { night: n, loc: plan.loc }] } : x2));
          if (mods.style === "wait" && secretOut[npc.id] && !npc.secretKnown) {
            const sec = SECRETS[npc.id];
            s.npcs = s.npcs.map((x) => (x.id === npc.id ? { ...x, secretKnown: true } : x));
            s.clues.push(`Night ${n}: ${npc.name}'s night errand, witnessed from your vantage: ${sec.short}. Human, and nothing worse.`);
            dawn.push(ev(`You know ${npc.name}'s secret now: ${sec.short}. Whatever they claim about their nights, you know the human truth of it.`, npc.id));
          } else {
            dawn.push(ev(`You saw ${npc.name} at the ${plan.loc} in the night.`, npc.id));
          }
        }
      } else {
        /* non-interactive fallback (no walk was lived this night, e.g. the
           mob-deadline dusk that skips straight to resolveNight): there is
           no walk log to defer to, so this is the only pass that reports
           who else was out: the original full-roster scan. */
        const seenHere = [];
        for (const npc of s.npcs) {
          if (!npc.alive || npc.id === s.monster.vid || npc.id === mods.follow || npc.id === mods.hailed || npc.id === mods.followSeen || npc.id === mods.mingledWith) continue;
          if (s.playerSaw.some((psw) => psw.night === n && psw.id === npc.id)) continue;
          if (outMap[npc.id] === plan.loc) {
            s.playerSaw.push({ night: n, id: npc.id, loc: plan.loc });
            seenHere.push(npc.name);
            if (chance(mods.vigil === "shift" ? 0.85 : 0.6)) s.npcs = s.npcs.map((x2) => (x2.id === npc.id ? { ...x2, sawYouOut: [...(x2.sawYouOut || []), { night: n, loc: plan.loc }] } : x2));
            if (mods.style === "wait" && secretOut[npc.id] && !npc.secretKnown) {
              const sec = SECRETS[npc.id];
              s.npcs = s.npcs.map((x) => (x.id === npc.id ? { ...x, secretKnown: true } : x));
              beats.push(`From your vantage, you watch long enough to understand. ${sec.walk(npc.name)}`);
              s.clues.push(`Night ${n}: ${npc.name}'s night errand, witnessed from your vantage: ${sec.short}. Human, and nothing worse.`);
              dawn.push(ev(`You know ${npc.name}'s secret now: ${sec.short}. Whatever they claim about their nights, you know the human truth of it.`, npc.id));
            } else {
              dawn.push(ev(`You saw ${npc.name} at the ${plan.loc} in the night.`, npc.id));
            }
          }
        }
        if (seenHere.length) beats.push(seenHere.length === 1
          ? `A lantern across the ${plan.loc}: ${seenHere[0]}, about some errand of their own. You keep to your shadow and let them pass.`
          : `You are not alone out here. ${seenHere.join(" and ")} cross the ${plan.loc} in the dark, each about their own business.`);
      }
    }
    /* the walk's own "return" stage already showed a closure line, live:
       reuse exactly what the player saw (mods.closureLine, carried over by
       commitWalk) instead of re-picking a fresh, differently worded one. */
    if (!s.over && plan.facts && !(mods.follow && mods.followAct !== "home")) beats.push(mods.closureLine || pickFreshIdx("walkClosures", WALK_CLOSURES)(plan.loc));
  }

  /* --- player watching a villager --- */
  let watchStayedHome = null;
  if (watching) {
    const target = npcById(s, watching);
    const tLoc = outMap[watching];
    if (tLoc && tLoc !== "home") {
      if (plan.facts) {
        /* interactive watch: the reveal was already lived through in the
           night walk, and applyFollowConsequence() (run earlier, keyed off
           mods.follow, which commitWatch always sets to the watched id) has
           already settled the ledger. Nothing left to do here. */
      } else {
        beats.push(`${target.name}'s door opens, soft as breath. A figure slips out, and you follow, keeping to the walls.`);

          let watchNoticeP = 0.45;
          if (s.monsterProtects) watchNoticeP = Math.max(0.05, watchNoticeP - 0.15);
          if (chance(watchNoticeP)) {
            if (chance(0.45)) {
              beats.push("Past the last house, it stops. Turns. It had known you were there the whole way.");
              if (s.monsterFancies && s.bond >= OFFER_BOND_MIN && n >= OFFER_MIN_NIGHT && !s.offerMade) {
                s.offerMade = true;
                s.pendingOffer = { name: target.name, where: "lanes", overText: `You followed ${target.name} out past the last house. Only one of you came back, and it was not you.` };
                s.offerBeats = (OFFER_SCENES[m.id] || OFFER_SCENES.wraith)(target.name);
                finish();
                s.phase = "offer";
                return s;
              }
              beats.push(...(DEATH_SCENES[m.id] || DEATH_SCENES.wraith)(target.name, "lanes"));
              s.over = { win: false, reason: "slain", text: `You followed ${target.name} out past the last house. Only one of you came back, and it was not you.` };
              return finish();
            }
            s.monsterSawYou = true;
            if (s.monsterFancies) s.bond = (s.bond || 0) + 1;
            s.playerSaw.push({ night: n, id: watching, loc: huntLoc });
            s.clues.push(`Night ${n}: ${target.name} stopped in the lane, turned, and looked directly at the shadow you stood in. Then walked on. It knows you follow.`);
            beats.push("It stops in the lane. Turns. Looks directly at the shadow you are standing in, for three long heartbeats. Then it walks on, unhurried, as if you were nothing worth the trouble. Yet.");
            dawn.push(ev(`${target.name} saw you last night. You are sure of it. And they said nothing, and did nothing, and that is the worst answer of all.`, watching));
          } else {
            if (s.monsterFancies) s.bond = (s.bond || 0) + 1;
            s.playerSaw.push({ night: n, id: watching, loc: huntLoc });
            s.clues.push(`Night ${n}: you followed ${target.name} toward the ${huntLoc}. Halfway there, their shadow bent wrong. Too long in the arm, too many joints. Whatever left that house was not ${target.name}.`);
            beats.push(`Halfway down the lane, ${target.name}'s shadow bends wrong. Too long in the arm, too many joints. You stop following. You stop breathing.`);
            dawn.push(ev(`It is written in your journal in a hand that shakes: whatever walked out of ${target.name}'s door last night was not ${target.name}.`, watching));
          }
        } else if (target.turned) {
          s.playerSaw.push({ night: n, id: watching, loc: tLoc });
          if (chance(0.6)) {
            s.npcs = s.npcs.map((x) => (x.id === watching ? { ...x, known: true } : x));
            s.clues.push(`Night ${n}: you followed ${target.name} to the ${tLoc}. They stood facing away from the moon for an hour, perfectly still. ${target.name} is changed. They belong to it now.`);
            beats.push(`You trail the figure to the ${tLoc}. There they stop, facing away from the moon, and stand. And stand. You count an hour before you can bear to leave.`);
            dawn.push(ev(`What you watched ${target.name} do in the night was not the act of a living neighbour. You are certain now: they are changed.`, watching));
          } else {
            beats.push(`You trail the figure through the lanes to the ${tLoc}. They keep to the shadows better than you would expect.`);
            dawn.push(ev(`You followed ${target.name} to the ${tLoc} last night. Something about the errand sat wrong with you, though you could not say what.`, watching));
          }
        } else {
          s.playerSaw.push({ night: n, id: watching, loc: tLoc });
          if (chance(0.25)) {
            s.npcs = s.npcs.map((x) => (x.id === watching ? { ...x, sawYouWatching: n, disp: clampDisp((x.disp || 0) - 1) } : x));
            const p = s.patience; p[watching] = Math.max(0, (p[watching] || 3) - 2);
            beats.push(`At the ${tLoc} they stop, and turn, and look straight back down the lane at you. There is nowhere to pretend to be.`);
            dawn.push(ev(`${target.name} caught you following them last night. That will not be forgotten, and it will not be forgiven quickly.`, watching));
          } else {
            beats.push(`You trail the figure through the lanes to the ${tLoc}. ${pick(["They keep looking over their shoulder.", "They walk quickly, head down.", "They seem to know the way well, even in the dark.", "Twice they stop dead to listen, and twice your heart stops with them."])}`);
            dawn.push(ev(`You followed ${target.name} to the ${tLoc} last night. ${pick(["They met no one.", "They went about some errand and were home before the church bell.", "Whatever their business, it looked like ordinary business."])}`, watching));
          }
        }
      }
    } else if (tLoc === "home") {
      /* interactive watch already showed this live, in the walk's own
         "quiet"/"retire" stages (QUIET_WATCH_LINES + the candle-gutters-out
         line): narrating it again here would be the same duplicate-recap
         problem as the out-walk's arrival/closure lines. */
      if (!plan.facts) beats.push(`${target.name}'s door stays shut. The candle behind the shutter gutters out around midnight, and does not relight.`);
      watchStayedHome = watching;
      /* A stay-home watch is no longer a dead end. It turns up their own human
         secret, a visitor nobody has mentioned, or a house that never slept.
         The outcome was rolled once (interactive: carried on plan.facts and
         already lived in the walk; non-interactive: rolled fresh here) so the
         morning journal always matches what the night showed. */
      const hw = (plan.facts && plan.facts.homeWatch) ? plan.facts.homeWatch : rollHomeWatch(s, watching);
      if (hw.kind === "secret") {
        s.npcs = s.npcs.map((x) => (x.id === watching ? { ...x, secretKnown: true } : x));
        s.clues.push(`Night ${n}: watching ${target.name}'s house, you learned the human truth of their nights: ${hw.short}. It explains their lies, and it is not the thing you are hunting.`);
        dawn.push(ev(`${target.name} never left, but you saw enough through the shutter to know their secret: ${hw.short}. Human, and sad, and not what stalks Hollow's Edge.`, watching));
      } else if (hw.kind === "visitor") {
        const visitor = npcById(s, hw.visitorId);
        if (visitor) {
          s.clues.push(`Night ${n}: while you watched ${target.name}'s door, ${visitor.name} came to it in the dark, was let in without a knock, and was gone before the bell. Those two keep company nobody has mentioned.`);
          dawn.push(ev(`You caught ${target.name} at nothing, but you caught ${visitor.name} slipping to their door in the dark, let in without a knock and gone before the bell. Whatever ties those two, they keep it quiet.`, visitor.id));
        }
      } else if (hw.kind === "restless") {
        dawn.push(ev(WATCH_RESTLESS[hw.ri % WATCH_RESTLESS.length](target.name), watching));
      }
    } else {
      if (!plan.facts) beats.push("The house you watch stands dark and empty. Nothing stirs there at all.");
    }
  }

  /* --- the monster's attack --- */
  let victim = null, victimWhere = null, victimKind = null;
  if (active && !s.over) {
    const cand = s.npcs.filter((x) => x.alive && !x.turned && x.id !== s.monster.vid);
    let pool = m.reach === "home" ? cand : cand.filter((x) => outMap[x.id] !== "home");
    if (huntsCrowd) { const cp = pool.filter((x) => outMap[x.id] === eventLoc); if (cp.length) pool = cp; }
    if (pool.length) {
      victim = pick(pool);
      victimWhere = outMap[victim.id];
      /* the collecting kinds announce themselves: one gruesome kill, then never another body */
      const firstBlood = m.attack === "turn" && !s.deaths.some((d) => d.kind === "slain");
      victimKind = firstBlood ? "kill" : m.attack;
      if (victimKind === "kill") {
        if (n === 1) {
          beats.push(pickFreshIdx("n1kill", NIGHT_ONE_KILL_LINES, 4));
        } else {
          beats.push(huntsCrowd && victimWhere === eventLoc
            ? pick(EVENT_KILL)(evn.name, victim.name)
            : wx === "storm" && chance(0.5)
            ? "Under the thunder, something happens that no one hears. The storm keeps its counsel till morning."
            : pickFreshIdx("screamLines", SCREAM_LINES)(victimWhere));
        }
        s.npcs = s.npcs.map((x) => (x.id === victim.id ? { ...x, alive: false } : x));
        s.deaths.push({ night: n, id: victim.id, name: victim.name, kind: "slain", where: victimWhere, examined: false, found: [] });
        if (n === 1) {
          NIGHT_ONE_DAWN(victim, victimWhere).forEach((t) => dawn.push(ev(t, victim.id, 2)));
          /* The opening kill is the collector's one gruesome statement. Let the
             first body carry a visceral detail most of the time, so night one
             lands hard instead of tastefully. */
          if (chance(0.75)) dawn.push(ev(pickFreshIdx("brutalDetails", BRUTAL_DETAILS)(victim.name), victim.id));
        } else {
          dawn.push(ev(pickFreshIdx("bodyFound", BODY_FOUND)(victim, victimWhere), victim.id, 2));
          if (chance(0.85)) dawn.push(ev(pickFreshIdx("brutalDetails", BRUTAL_DETAILS)(victim.name), victim.id));
        }
        if (!s.monsterProtects && (s.monsterSawYou || s.wrongExecutions > 0) && chance(0.3)) {
          const km = pick(KILLER_MESSAGES);
          dawn.push(ev(km.line(victim.name)));
          s.clues.push(`Night ${n}: ${km.clue}`);
        }
        if (firstBlood && n > 1) {
          const fk = npcById(s, "falk");
          dawn.push(fk && fk.alive && !fk.fled && fk.id !== victim.id
            ? ev(`Doctor Falk looks at the wounds a long time and writes nothing down. "Whatever did this," he says at last, "was not hungry. It was signing its name."`, "falk")
            : ev("Whoever examines the wounds says the same thing the last one did, in fewer words: this was not hunger. This was a signature."));
        }
        /* some nights it kills past need, for the pleasure of it */
