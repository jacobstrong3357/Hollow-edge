          )}
          {!done && ivSub === "catP" && (
            <div className="mt-4">
              <div className="mv-display" style={{ fontSize: 11, letterSpacing: 2, color: C.dim }}>PRESS THEM</div>
              <div className="grid grid-cols-1 gap-2 mt-1">
                <Btn small disabled={suspectUsed} onClick={() => askQ("suspect", "")}>Who do you suspect?</Btn>
                <Btn small disabled={craftUsed} onClick={() => askQ("craft")}>{PERSONA[iv.id].craftLabel}</Btn>
                {s.mob && npcById(s, s.mob.target) && npcById(s, s.mob.target).alive && iv.id !== s.mob.accuser && iv.id !== s.mob.target && (
                  <Btn small onClick={() => askQ("mobview")}>What do you make of the accusation?</Btn>
                )}
                <Btn small onClick={() => setIvSub(null)}>← Back</Btn>
              </div>
            </div>
          )}
          {!done && ivSub === "catV" && (
            <div className="mt-4">
              <div className="mv-display" style={{ fontSize: 11, letterSpacing: 2, color: C.dim }}>THE VILLAGE</div>
              <div className="grid grid-cols-1 gap-2 mt-1">
                <Btn small disabled={gossipUsed} onClick={() => askQ("gossip")}>What's the talk of the village?</Btn>
                {shareCandidates.length > 0 && <Btn small onClick={() => setIvSub("share")}>Share what you know</Btn>}
                {canReport && <Btn small kind="amber" onClick={() => askQ("report")}>Tell them what you saw</Btn>}
                {s.coerceNote && !s.coerceNote.shown && <Btn small kind="red" onClick={showNote}>Show them the note</Btn>}
                <Btn small onClick={() => setIvSub(null)}>← Back</Btn>
              </div>
            </div>
          )}
          {!done && ivSub === "catH" && (
            <div className="mt-4">
              <div className="mv-display" style={{ fontSize: 11, letterSpacing: 2, color: C.dim }}>THE PERSON</div>
              <div className="grid grid-cols-1 gap-2 mt-1">
                <Btn small disabled={talkUsed} onClick={() => askQ("talk")}>Sit a while. Talk of nothing.</Btn>
                <Btn small disabled={howareUsed} onClick={() => askQ("howare")}>How are you holding up?</Btn>
                <Btn small disabled={pastUsed} onClick={() => askQ("past")}>Tell me about before.</Btn>
                <Btn small onClick={() => setIvSub(null)}>← Back</Btn>
              </div>
            </div>
          )}
          {!done && ivSub === "person" && (
            <div className="mt-4">
              <div className="mv-display" style={{ fontSize: 11, letterSpacing: 2, color: C.dim }}>ABOUT WHOM?</div>
              <div className="grid grid-cols-4 gap-2 mt-2">
                {pickTargets.map((x) => (
                  <button key={x.id} onClick={() => setIvSub({ pid: x.id })} className="mv-btn flex flex-col items-center gap-1 rounded px-1 py-2"
                    style={{ background: "transparent", border: `1px solid ${C.line}`, cursor: "pointer" }}>
                    <Portrait id={x.id} size={36} dead={!x.alive} turnedKnown={x.turned && x.known} />
                    <span style={{ fontSize: 11, color: C.text }}>{x.name}</span>
                  </button>
                ))}
              </div>
              <div className="mt-2"><Btn small full onClick={() => setIvSub("catN")}>← Back</Btn></div>
            </div>
          )}
          {!done && ivSub === "share" && (
            <div className="mt-4">
              <div className="mv-display" style={{ fontSize: 11, letterSpacing: 2, color: C.dim }}>TELL THEM ABOUT WHOM?</div>
              <div className="grid grid-cols-4 gap-2 mt-2">
                {shareCandidates.map((x) => (
                  <button key={x.id} onClick={() => askQ("share", x.id)} className="mv-btn flex flex-col items-center gap-1 rounded px-1 py-2"
                    style={{ background: "transparent", border: `1px solid ${C.line}`, cursor: "pointer" }}>
                    <Portrait id={x.id} size={36} dead={!x.alive} turnedKnown={x.turned && x.known} />
                    <span style={{ fontSize: 11, color: C.text }}>{x.name}</span>
                  </button>
                ))}
              </div>
              <div className="mt-2"><Btn small full onClick={() => setIvSub("catV")}>← Back</Btn></div>
            </div>
          )}
          {!done && ivSub && ivSub.pid && (() => {
            const t = npcById(s, ivSub.pid);
            return (
              <div className="mt-4">
                <div className="flex items-center gap-2">
                  <Portrait id={t.id} size={36} dead={!t.alive} turnedKnown={t.turned && t.known} />
                  <span className="mv-display" style={{ fontSize: 14, color: C.parch }}>{t.name}</span>
                </div>
                <div className="grid grid-cols-1 gap-2 mt-2">
                  <Btn small onClick={() => askQ("about", t.id)}>Did you see {t.name} that night?</Btn>
                  {t.alive && !t.fled && <Btn small onClick={() => askQ("opinion", t.id)}>What do you make of {t.name}?</Btn>}
                  <Btn small onClick={() => setIvSub("person")}>← Back</Btn>
                </div>
              </div>
            );
          })()}
          {done && <p className="mt-4" style={{ fontSize: 13, color: C.dim }}>They have said all they will say today.</p>}
          <div className="mt-4"><Btn full kind="amber" onClick={endInterview}>End the interview</Btn></div>
        </div>
      </div>
    );
  })();

  /* --- death scene investigation --- */
  const openInvest = () => {
    const s2 = JSON.parse(JSON.stringify(s));
    s2.ap -= 1; s2.investigatedNight = s2.nightNum;
    setS(s2);
    setInvest({ left: 2, used: [], findings: [] });
  };
  const investModal = invest && freshDeath && (() => {
    const loc = freshDeath.where === "home" ? "Cottage" : freshDeath.where;
    return (
      <div className="fixed inset-0 z-30 flex flex-col" style={{ background: "rgba(8,10,18,0.9)" }}>
        <div className="mt-auto rounded-t-xl overflow-hidden mv-body max-h-[92vh] overflow-y-auto" style={{ background: C.panel, borderTop: `1px solid ${C.redBright}`, color: C.text, WebkitOverflowScrolling: "touch", overscrollBehavior: "contain" }}>
          <Scene loc={loc} kind="body" height={100} />
          <div className="p-4">
            <div className="mv-display" style={{ color: C.redBright, fontSize: 14, letterSpacing: 2 }}>WHERE {freshDeath.name.toUpperCase()} FELL</div>
            <p style={{ fontSize: 13, color: C.dim }} className="mt-1">Choose carefully where to look. You have time for {invest.left} more before the village takes the body away.</p>
            {invest.findings.map((f, i) => (
              <div key={i} className="mt-2">
                <p style={{ fontSize: 13, color: C.amber }}>{f.label}</p>
                <p style={{ fontSize: 15 }}>{f.line}</p>
              </div>
            ))}
            {invest.left > 0 && (
              <div className="grid grid-cols-1 gap-2 mt-3">
                {INVEST_ACTS.filter((a) => !invest.used.includes(a.key)).map((a) => (
                  <Btn key={a.key} small onClick={() => {
                    const { s: ns, line } = investLook(s, a.key);
                    setS(ns);
                    setInvest({ left: invest.left - 1, used: [...invest.used, a.key], findings: [...invest.findings, { label: a.label, line }] });
                  }}>{a.label}</Btn>
                ))}
              </div>
            )}
            {invest.left <= 0 && <p className="mt-3" style={{ fontSize: 13, color: C.dim }}>{(() => { const tb = npcById(s, "tobias"); return tb && tb.alive && !tb.fled ? "Old Tobias is waiting with the cart. There is no more time." : "The burial detail is waiting with the cart. There is no more time."; })()}</p>}
            <div className="mt-4"><Btn full kind="amber" onClick={() => setInvest(null)}>Step away from the body</Btn></div>
          </div>
        </div>
      </div>
    );
  })();

  const examineModal = modal === "examine" && modalWrap("Have whom examined for the change?", (
    <div className="flex flex-col gap-2">
      <p style={{ color: C.dim, fontSize: 13 }}>Doctor Falk claims he can tell a changed soul by the coldness of the blood. Greta can examine Falk himself, if it comes to that. A clean result proves little, and the innocent do not enjoy being examined like cattle.</p>
      {aliveNpcs(s).map((n) => villagerBtn(n, () => doAction((x) => actLookOver(x, n.id))))}
    </div>
  ));

  const planModal = modal === "plan" && modalWrap("Night falls. Where will you be?", (
    s.fled ? (
      <div className="flex flex-col gap-2">
        <Btn full kind="amber" onClick={() => nightfall({ kind: "siege" })}>Barricade in the church with the others</Btn>
        <Btn full kind="red" onClick={() => setModal("rite")}>Perform the rite at dusk</Btn>
        <p style={{ color: C.dim, fontSize: 12 }} className="mt-1">It comes back every night now. Every rite performed with the wrong name costs a life, and the village will not stand in the circle for a third mistake. The right one ends this.</p>
      </div>
    ) : (
      <div className="flex flex-col gap-2">
        <Btn full kind="amber" onClick={() => setModal("watch")}>Watch a villager's door</Btn>
        <Btn full kind="amber" onClick={() => setModal("nightwalk")}>Search an area</Btn>
        {s.nightNum <= 2 && <p style={{ color: C.dim, fontSize: 12 }} className="mt-1">Watching a door reveals where one person truly goes. Searching may find signs, or the thing itself. Behind a barred door you are safest, but you learn nothing.</p>}
        <div className="mt-2 pt-2" style={{ borderTop: `1px solid ${C.line}` }}>
          <Btn full kind="ghost" onClick={() => nightfall({ kind: "home" })}>Stay home, bar the door</Btn>
        </div>
      </div>
    )
  ));

  const riteModal = modal === "rite" && modalWrap("Circle the creature. The rite follows the name.", (
    <div>
      <div className="grid grid-cols-4 gap-2">
        {MONSTERS.map((mm) => {
          const struckM = s.struck.includes(mm.id);
          const dim = struckM || !compatM(mm);
          const sel = accuseType === mm.id;
          return (
            <button key={mm.id} onClick={() => setAccuseType(mm.id)} className="flex flex-col items-center gap-1"
              style={{ background: "transparent", border: "none", cursor: "pointer", padding: 4, borderRadius: 10, boxShadow: sel ? `0 0 0 2px ${C.redBright}` : "none", opacity: dim && !sel ? 0.35 : 1 }}>
              <MonsterArt id={mm.id} size={44} />
              <span style={{ fontSize: 10, color: sel ? C.redBright : C.dim, textDecoration: struckM ? "line-through" : "none" }}>{mm.name}</span>
            </button>
          );
        })}
      </div>
      {accuseType && (
        <p className="mt-3" style={{ fontSize: 14, color: C.parch }}>
          The books prescribe the <strong>{METHODS[MONSTERS.find((x) => x.id === accuseType).method]}</strong> for a {MONSTERS.find((x) => x.id === accuseType).name}. Every wrong rite costs a life, and the village has faith left for two attempts. No more.
        </p>
      )}
      <div className="grid grid-cols-2 gap-2 mt-3">
        <Btn onClick={() => { setAccuseType(null); setModal("plan"); }}>Back</Btn>
        <Btn kind="red" disabled={!accuseType} onClick={() => { const ty = accuseType; setAccuseType(null); nightfall({ kind: "rite", typeId: ty }); }}>Perform the rite at dusk</Btn>
      </div>
    </div>
  ));

  const watchModal = modal === "watch" && modalWrap("Whose door will you watch?", (
    <div className="flex flex-col gap-2">
      {s.nightNum <= 2 && <p style={{ color: C.dim, fontSize: 13 }}>If they stay in on a night of killing, they are cleared beyond doubt, and that proof can later stand between them and a rope. If they leave, you follow. Follow the wrong figure too far into the dark, and you may not come back.</p>}
      {aliveNpcs(s).map((n) => villagerBtn(n, () => startWatchWalk(n.id)))}
    </div>
  ));

  const unbindModal = modal === "unbind" && modalWrap("Unbind whom of what holds them?", (
    <div className="flex flex-col gap-2">
      <p style={{ color: C.dim, fontSize: 13 }}>This costs the whole of the day, every hour you have left, and can be tried on each of the changed only once. If it works, whatever leaves them may remember something useful. If it fails, the thing they carry feels the working, and does not forgive it lightly.</p>
      {eligibleUnbind.map((n) => villagerBtn(n, () => doAction((x) => actUnbind(x, n.id))))}
    </div>
  ));

  const accuseModal = modal === "accuse" && modalWrap(accusePick ? `Now circle what wears ${npcById(s, accusePick).name}'s face` : "Circle the accused", (
    accusePick ? (
      <div>
        <div className="flex gap-3 items-center mb-2">
          <Portrait id={accusePick} size={44} />
          <p style={{ fontSize: 13, color: C.dim }}>Right on both counts ends it tonight. Wrong on either, and the village pays.</p>
        </div>
      <div className="grid grid-cols-4 gap-2">
        {MONSTERS.map((mm) => {
          const struckM = s.struck.includes(mm.id);
          const dim = struckM || !compatM(mm);
          const sel = accuseType === mm.id;
          return (
            <button key={mm.id} onClick={() => setAccuseType(mm.id)} className="flex flex-col items-center gap-1"
              style={{ background: "transparent", border: "none", cursor: "pointer", padding: 4, borderRadius: 10, boxShadow: sel ? `0 0 0 2px ${C.redBright}` : "none", opacity: dim && !sel ? 0.35 : 1 }}>
              <MonsterArt id={mm.id} size={44} />
              <span style={{ fontSize: 10, color: sel ? C.redBright : C.dim, textDecoration: struckM ? "line-through" : "none" }}>{mm.name}</span>
            </button>
          );
        })}
      </div>
        {accuseType && (
          <p className="mt-3" style={{ fontSize: 14, color: C.parch }}>
            Put <strong>{npcById(s, accusePick).name}</strong> to the rite of the <strong>{MONSTERS.find((x) => x.id === accuseType).name}</strong>: the <strong>{METHODS[MONSTERS.find((x) => x.id === accuseType).method]}</strong>, by {ritePreparer(s, accusePick)}'s hand.
          </p>
        )}
        <div className="grid grid-cols-2 gap-2 mt-3">
          <Btn onClick={() => { setAccusePick(null); setAccuseType(null); }}>Back</Btn>
          <Btn kind="red" disabled={!accuseType} onClick={() => { const id = accusePick, ty = accuseType; setModal(null); setAccusePick(null); setAccuseType(null); setS(actAccuse(s, id, ty)); }}>Say it aloud</Btn>
        </div>
      </div>
    ) : (
      <div>
        <p style={{ fontSize: 13, color: C.dim }} className="mb-2">The village hangs whoever you circle, and no verdict is read out. An innocent dead on your word emboldens the thing, and a second is the end of you.</p>
        <div className="grid grid-cols-4 gap-2">
          {aliveNpcs(s).map((n) => {
            const struckP = s.struckNpcs.includes(n.id);
            return (
              <button key={n.id} onClick={() => setAccusePick(n.id)} className="flex flex-col items-center gap-1" style={{ background: "transparent", border: "none", cursor: "pointer", padding: 4, opacity: struckP ? 0.4 : 1 }}>
                <Portrait id={n.id} size={48} turnedKnown={n.turned && n.known} />
                <span style={{ fontSize: 10, color: C.dim, textDecoration: struckP ? "line-through" : "none" }}>{n.name}</span>
              </button>
            );
          })}
        </div>
      </div>
    )
  ));

  const resultSheet = sheet && !tab && !modal && !profile && !iv && !invest && (
    <div className="fixed inset-0 z-30 flex flex-col" style={{ background: "rgba(8,10,18,0.7)" }} onClick={() => setSheet(null)}>
      <div className="mt-auto rounded-t-xl p-4 pb-6 mv-body max-h-[70vh] overflow-y-auto" style={{ background: C.panel, borderTop: `1px solid ${C.amber}`, color: C.text, WebkitOverflowScrolling: "touch", overscrollBehavior: "contain" }} onClick={(e) => e.stopPropagation()}>
        {sheet.map((e, i) => (<EventLine key={i} e={e} s={s} />))}
        <div className="mt-4"><Btn full kind="amber" onClick={() => setSheet(null)}>Continue</Btn></div>
      </div>
    </div>
  );

  const profileModal = profile && (() => {
    const n = npcById(s, profile);
    const lore = NPC_LORE[n.id];
    const death = s.deaths.find((d) => d.id === n.id && d.kind !== "turned");
    const turnRec = s.deaths.find((d) => d.id === n.id && d.kind === "turned");
    const struckP = s.struckNpcs.includes(n.id);
    const facts = [];
    s.playerSaw.filter((f) => f.id === n.id).forEach((f) => facts.push({ o: f.night * 10, t: `Night ${f.night}: you saw them near the ${f.loc}.` }));
    (n.sawYouOut || []).forEach((e2) => facts.push({ o: e2.night * 10 + 2, t: `Night ${e2.night}: they ${e2.met ? "met you in the lanes, and will remember it" : `saw YOU abroad, near the ${e2.loc}. The village talks`}.` }));
    s.statements.filter((st) => st.id === n.id && st.q === "where").forEach((st) => facts.push({ o: (st.night || 0) * 10 + 5, t: `Day ${st.day}: claimed they were ${st.claim === "home" ? "home all night" : `at the ${st.claim}`} on Night ${st.night}.`, flag: st.flag }));
    s.statements.forEach((st) => (st.mentions || []).forEach((mn) => {
      if (mn.id === n.id) facts.push({ o: (st.night || 0) * 10 + 6, t: `Day ${st.day}: ${st.name} ${mn.kind === "vouch" ? "swears they were safe at home" : mn.kind === "passed" ? `passed them on the road, heading to the ${mn.loc}` : mn.kind === "with" ? `saw them at the ${mn.loc}` : mn.kind === "placed" ? `claims to have seen them near the ${mn.loc}` : mn.kind === "craft" ? `saw them coming from the ${mn.loc} way, Night ${mn.night}` : mn.kind === "odd" ? "has noticed something has gone out of them lately" : mn.kind === "absent" ? "marked them absent from a gathering everyone else attended" : mn.kind === "cleared" ? (mn.loc ? `vouched it cannot be them, together at the ${mn.loc} on a killing night` : "insisted it certainly is not them") : mn.kind === "suspects" ? (mn.evidenced ? "claims to have SEEN them out on a killing night" : "voiced suspicion of them") : mn.kind === "gossip" ? "came up in a bit of village gossip" : "spoke of them"}.` });
    }));
    s.clues.filter((c) => c.includes(n.name)).forEach((c) => facts.push({ o: 999, t: c, clue: true }));
    facts.sort((a, b) => a.o - b.o);
    let status = "Alive, as far as you know.";
    if (n.fled && n.id === s.monster.vid) status = "Unmasked, and fled into the woods. It comes back at night.";
    else if (n.fled) status = "Gone from the village. Whatever drove them out, they did not stay to explain it, and they have not been seen since.";
    else if (death) status = death.kind === "executed"
      ? `Executed on your accusation, Day ${death.night}.${n.turned && n.known ? " Their eyes betrayed the change as they died." : ""}`
      : death.kind === "mobbed"
        ? `Hanged by the mob, Night ${death.night}.${n.turned && n.known ? " The rope revealed the change in them, too late to matter." : " You did not find the truth in time to stop it."}`
        : `Slain, Night ${death.night}. ${death.examined ? (death.found && death.found.length ? `The scene yielded this much: ${death.found.map((f) => senseFor(f, 0)).join(" ")}` : "The scene yielded nothing conclusive.") : "The death was never investigated."}`;
    else if (n.cured) status = `Unbound, Day ${n.unbindDay || s.dayNum}. The rite drew what held them out into the open air, and it is gone. They are not unmarked by it.`;
    else if (turnRec && n.known) status = `Changed, Night ${turnRec.night}. They are no longer wholly themselves. Their word serves the thing that took them.`;
    return modalWrap(`${n.name} ${n.role}`, (
      <div>
        <div className="flex gap-3 items-start">
          <div className="shrink-0"><Portrait id={n.id} size={64} dead={!n.alive} turnedKnown={n.turned && n.known} /></div>
          <div>
            <p style={{ fontSize: 13, fontStyle: "italic", color: C.dim }}>{lore.body}</p>
            <p className="mt-1" style={{ fontSize: 12, color: C.dim }}>{n.build} of build{n.alive && s.knownBuild === n.build ? ": like the shape in the dark" : n.alive && !s.knownBuild && buildCandidates(s) && buildCandidates(s).includes(n.build) ? ": could be the shape in the dark" : ""}</p>
            {n.secretKnown && SECRETS[n.id] && (
              <p className="mt-1" style={{ fontSize: 12, color: C.amber, fontStyle: "italic" }}>Their secret, kept: {SECRETS[n.id].short}.</p>
            )}
            {n.alive && !n.fled && (
              <p className="mt-1" style={{ fontSize: 12, color: C.dim, fontStyle: "italic" }}>{pickFreshIdx(`mood:${n.id}:${dispTier(n.disp)}`, DISP_MOOD[dispTier(n.disp)])}</p>
            )}
          </div>
        </div>
        <p className="mt-2" style={{ fontSize: 13, color: !n.alive || n.fled ? C.redBright : n.turned && n.known ? C.turn : n.cured ? C.amber : C.text }}>{status}</p>
        <div className="mv-display mt-3" style={{ color: C.amber, fontSize: 13, letterSpacing: 2 }}>WHAT YOU KNOW</div>
        {facts.length === 0 && <p style={{ fontSize: 14, color: C.dim }} className="mt-1">Nothing yet. You have not seen them at night, nor heard a word of their movements.</p>}
        {(() => {
          const PAGE = 4;
          const total = Math.max(1, Math.ceil(facts.length / PAGE));
          const cur = factPage === -1 ? total - 1 : Math.min(factPage, total - 1);
          return (
            <>
              {facts.slice(cur * PAGE, cur * PAGE + PAGE).map((f, i) => (
                <p key={i} className="mt-1" style={{ fontSize: 14, fontStyle: f.clue ? "italic" : "normal" }}>
                  {f.t}{f.flag && <span style={{ color: C.redBright, fontWeight: 700 }}> ✕ {f.flag}</span>}
                </p>
              ))}
              {facts.length > PAGE && (
                <div className="flex items-center justify-between mt-2">
                  <Btn small disabled={cur === 0} onClick={() => setFactPage(cur - 1)}>‹ Earlier</Btn>
                  <span style={{ fontSize: 12, color: C.dim }}>page {cur + 1} of {total}</span>
                  <Btn small disabled={cur >= total - 1} onClick={() => setFactPage(cur + 1)}>Later ›</Btn>
                </div>
              )}
            </>
          );
        })()}
        {n.alive && !n.fled && (
          <div className="mt-4">
            <Btn full onClick={() => setS({ ...s, struckNpcs: struckP ? s.struckNpcs.filter((x) => x !== n.id) : [...s.struckNpcs, n.id] })}>
              {struckP ? "Restore them to your suspicion" : "Strike them from your suspicion"}
            </Btn>
            <div className="grid grid-cols-2 gap-2 mt-2">
              <Btn disabled={s.ap < 1 || s.questionedToday.includes(n.id)} onClick={() => { setProfile(null); startInterview(n.id); }}>Interview them</Btn>
              <Btn kind="red" disabled={s.fled} onClick={() => { setProfile(null); setAccusePick(n.id); setModal("accuse"); }}>Accuse them</Btn>
            </div>
          </div>
        )}
      </div>
    ));
  })();

  /* ---------- Day screen ---------- */
  return (
    <div className="min-h-screen mv-body" style={{ background: C.bg, color: C.text }}>
      <style>{CSS_ALL}</style>
      {journal}{searchModal}{nightWalkModal}{questionModal}{interviewModal}{investModal}{examineModal}{planModal}{walkModal}{riteModal}{watchModal}{unbindModal}{accuseModal}{profileModal}{resultSheet}

      <div className="sticky top-0 z-20 px-4 pt-2.5 pb-1.5" style={{ background: C.bg, borderBottom: `1px solid ${C.line}` }}>
        <div className="max-w-md mx-auto">
          <div className="flex items-baseline justify-between">
            <span className="mv-display" style={{ fontSize: 19, color: C.parch }}>Day {s.dayNum}{s.fled ? " · under siege" : ""}</span>
            <span style={{ fontSize: 12, color: C.dim }}>
              <button onClick={toggleSound} className="mv-body mr-2" style={{ background: "transparent", border: "none", color: C.dim, fontSize: 12, cursor: "pointer", padding: 0 }}>{snd ? "♪" : "♪·off"}</button>
              {aliveNpcs(s).length} living{knownChanged ? ", and some walk changed" : ""}
            </span>
          </div>
          <div className="mt-1"><MoonStrip s={s} /></div>
        </div>
      </div>

      {s.mob && mobT && mobT.alive && (
        <div className="px-4 py-2" style={{ background: "rgba(158,48,57,0.18)", borderBottom: `1px solid ${C.red}` }}>
          <div className="max-w-md mx-auto flex items-center gap-3">
            <Portrait id={mobT.id} size={36} turnedKnown={mobT.turned && mobT.known} />
            <p style={{ fontSize: 13, color: C.parch }}>
              <strong>{mobA ? mobA.name : "The mob"}</strong> has sworn to hang <strong>{mobT.name}</strong> at {s.mob.deadline === s.nightNum + 1 ? "TOMORROW'S dusk" : "THIS dusk"} unless the truth is found first. Accuse the guilty, speak for {mobT.name} in the square, or let the rope decide.
            </p>
          </div>
        </div>
      )}

      {s.sideQuest && npcById(s, s.sideQuest.giver) && npcById(s, s.sideQuest.giver).alive && (() => {
        const giver = npcById(s, s.sideQuest.giver);
        const sqTarget = npcById(s, s.sideQuest.target);
        return (
          <div className="px-4 py-2" style={{ background: "rgba(217,164,65,0.14)", borderBottom: `1px solid ${C.amber}` }}>
            <div className="max-w-md mx-auto flex items-center gap-3">
              <Portrait id={giver.id} size={32} turnedKnown={giver.turned && giver.known} />
              <p style={{ fontSize: 13, color: C.parch }}>
                {s.sideQuest.done
                  ? <><strong>{giver.name}</strong> is waiting to hear what you saw of <strong>{sqTarget ? sqTarget.name : "them"}</strong>.</>
                  : <><strong>{giver.name}</strong> asked you to watch <strong>{sqTarget ? sqTarget.name : "them"}</strong> tonight.</>}
              </p>
            </div>
          </div>
        );
      })()}

      <div className="max-w-md mx-auto px-4 pb-20">
        <div className="mt-3 rounded-lg overflow-hidden" style={{ background: C.panel, border: `1px solid ${C.line}` }}>
          {s.dawnScene && (
            <div style={{ position: "relative" }}>
              <Scene loc={s.dawnScene.loc} kind={s.dawnScene.kind} height={s.dayNum <= 1 ? 130 : 84} />
              <div style={{ position: "absolute", inset: 0, pointerEvents: "none", background: DAY_TINTS[s.dayNum % DAY_TINTS.length] }} />
            </div>
          )}
          <div className="p-3 pt-2">
            <div className="mv-display" style={{ color: C.amber, fontSize: 12, letterSpacing: 2 }}>AT DAWN{s.dawnScene ? `, ${s.dawnScene.loc.toUpperCase()}` : ""}</div>
            {s.dawn.length > 1 ? (
              dawnDone ? (
                <button onClick={() => setDawnDone(false)} className="mv-body mt-2" style={{ background: "transparent", border: "none", color: C.dim, fontSize: 13, cursor: "pointer", padding: 0, textAlign: "left" }}>
                  {s.dawn.length} things happened in the night · read again ▾
                </button>
              ) : (
                <div className="mt-2"><DawnCarousel items={s.dawn} s={s} onOpen={setProfile} onDone={() => setDawnDone(true)} /></div>
              )
            ) : (
              s.dawn.map((e, i) => (<EventLine key={i} e={e} s={s} onOpen={setProfile} />))
            )}
            {s.enraged && <p className="mt-2" style={{ color: C.redBright, fontSize: 13, fontWeight: 700 }}>It knows your face now. The dark is more dangerous for you than for anyone.</p>}
            {s.wrongGuesses === 1 && <p className="mt-2" style={{ color: C.redBright, fontSize: 13 }}>You have named it wrong once. Name it wrong again, the wrong person or the wrong creature, and it stops taking neighbours and comes for you.</p>}
          </div>
        </div>

        {s.dayEvents.length > 0 && (
          <div className="mt-2 rounded-lg p-3 pt-1.5" style={{ background: C.panel2, border: `1px solid ${C.line}` }}>
            {(dayEventsExpanded ? s.dayEvents : s.dayEvents.slice(-2)).map((e, i) => (<EventLine key={i} e={e} s={s} onOpen={setProfile} />))}
            {s.dayEvents.length > 2 && (
              <button onClick={() => setDayEventsExpanded((v) => !v)} className="mv-body mt-1.5" style={{ background: "transparent", border: "none", color: C.dim, fontSize: 12, cursor: "pointer", padding: 0 }}>
                {dayEventsExpanded ? "▴ show less" : `· · ·  show more (${s.dayEvents.length - 2} earlier)`}
              </button>
            )}
          </div>
        )}

        <div className="mt-3 grid grid-cols-4 gap-y-2 place-items-center">
          {s.npcs.map((n) => {
            const struckP = s.struckNpcs.includes(n.id) && n.alive;
            const cands = !s.knownBuild ? buildCandidates(s) : null;
            const ring = n.fled ? C.redBright : s.mob && s.mob.target === n.id && n.alive ? C.red : n.alive && s.knownBuild === n.build ? C.amber : n.alive && cands && cands.length < BUILDS.length && cands.includes(n.build) ? "rgba(217,164,65,0.4)" : null;
            return (
              <button key={n.id} onClick={() => setProfile(n.id)} className="flex flex-col items-center gap-0.5 mv-btn" style={{ width: 72, background: "transparent", border: "none", cursor: "pointer", padding: 0, opacity: struckP ? 0.5 : 1 }}>
                <div style={{ borderRadius: 12, boxShadow: ring ? `0 0 0 2px ${ring}` : "none" }}>
                  <Portrait id={n.id} size={44} dead={!n.alive} turnedKnown={n.turned && n.known} />
                </div>
                <div className="text-center" style={{ fontSize: 10.5, color: C.dim, lineHeight: "12px", textDecoration: struckP ? "line-through" : "none" }}>
                  {n.name}{n.fled ? <><br /><span style={{ color: C.redBright }}>in the woods</span></> : n.turned && n.known ? <><br /><span style={{ color: C.turn }}>changed</span></> : n.cured ? <><br /><span style={{ color: C.amber }}>unbound</span></> : s.mob && s.mob.target === n.id && n.alive ? <><br /><span style={{ color: C.redBright }}>marked</span></> : null}
                </div>
              </button>
            );
          })}
        </div>

        <div className="mt-3">
          <div className="flex items-center justify-between">
            <span className="mv-display" style={{ fontSize: 13, letterSpacing: 2, color: C.dim }}>DAYLIGHT REMAINING</span>
            <span>{[0, 1].map((i) => (<span key={i} className="inline-block rounded-full ml-1.5" style={{ width: 10, height: 10, background: i < s.ap ? C.amber : "transparent", border: `1.5px solid ${C.amber}` }} />))}</span>
          </div>
          <div className="grid grid-cols-1 gap-1.5 mt-1.5">
            <Btn small disabled={s.ap < 1 || !freshDeath || s.investigatedNight === s.nightNum} onClick={openInvest}>
              {investigateLabel(s, freshDeath)}
            </Btn>
            <Btn small disabled={s.ap < 1} onClick={() => setModal("search")}>Search a location in daylight</Btn>
            <Btn small disabled={s.ap < 1 || s.questionedToday.length >= aliveNpcs(s).length} onClick={() => setModal("question")}>Hold an interview</Btn>
            <Btn small disabled={s.ap < 1 || !canExamine} onClick={() => setModal("examine")}>{examineLabel(canExamine)}</Btn>
            {s.mob && mobT && mobT.alive && (
              <Btn small disabled={s.ap < 1 || s.defendedToday} onClick={() => doAction((x) => actDefend(x))}>
                {defendLabel(s, mobT)}
              </Btn>
            )}
            {eligibleUnbind.length > 0 && (
              <Btn small disabled={s.ap < 1} onClick={() => setModal("unbind")}>Attempt the Rite of Unbinding</Btn>
            )}
          </div>
          <div className="grid grid-cols-2 gap-2 mt-3">
            <Btn kind="red" disabled={s.fled} onClick={() => setModal("accuse")}>{s.fled ? "It is unmasked" : "Accuse"}</Btn>
            <Btn kind="amber" onClick={() => setModal("plan")}>Nightfall →</Btn>
          </div>
        </div>
      </div>

      <div className="mvVignette" />
      <div className="mvGrainF" />
      <button onClick={() => { setTab("evidence"); setClueSeen(s.clues.length); }}
        className="mv-display fixed bottom-0 left-1/2 -translate-x-1/2 z-10 px-6 py-2 rounded-t-lg"
        style={{ background: C.parch, color: C.ink, fontSize: 14, letterSpacing: 2, border: `1px solid ${C.parchLine}`, borderBottom: "none" }}>
        ☰ JOURNAL {remainCount < MONSTERS.length ? `· ${remainCount} remain` : ""}
        {s.clues.length > clueSeen && <span style={{ position: "absolute", top: 6, right: 8, width: 8, height: 8, borderRadius: 4, background: C.red, boxShadow: `0 0 6px ${C.redBright}` }} />}
      </button>
    </div>
  );
}


/* -------- mount -------- */
try {
  ReactDOM.createRoot(document.getElementById("root")).render(<MonsterVillage />);
  requestAnimationFrame(function () {
    setTimeout(function () {
      var b = document.getElementById("boot");
      if (b) b.remove();
    }, 60);
  });
} catch (err) {
  window.__bootFail(err && err.message ? err.message : err);
}
</script>
</body>
</html>
