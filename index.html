    (nm) => `${nm} tried to outrun something that cannot tire and will not be reasoned with. The distance never mattered. The patience did, and the patience always wins.`,
  ],
  doppel: [
    (nm) => `${nm} let someone wearing a dead neighbour's face in through the door one night, because the voice was exactly, perfectly right, right up until the moment it very deliberately was not.`,
    (nm) => `Whatever wore ${nm}'s face afterward had studied them a long while first: the mouth, the eyes, the last expression, filed away for later use, and worn since with an accuracy that unsettles everyone who loved them.`,
    (nm) => `${nm} is gone, and for a little while afterward there were two of somebody else walking the lanes, and only one of them remembered what it felt like to actually be alive.`,
  ],
  hag: [
    (nm) => `${nm} went to bed tired, the way everyone is tired now, and did not wake. Whatever rode them down into that sleep left no mark but the scream caught behind their own face, twisted mid-cry and never released.`,
    (nm) => `They found ${nm} in bed, sheets barely disturbed, expression almost peaceful except around the eyes, and utterly, permanently gone. The hag does not leave a struggle to clean up after; she prefers her work tidy.`,
    (nm) => `${nm}'s heart stopped somewhere in the deepest part of the night, ridden down by something delighted, unhurried, and far heavier than it looked, that took its time about finishing.`,
  ],
  generic: [
    (nm) => `${nm} did not survive the thing that finally, fully took the village. What is left of the story does not include how.`,
    (nm) => `${nm} is dead, one of the last, taken in the general ruin, and by then no one remained steady enough to record more than the name.`,
    (nm) => `By the end nobody was keeping a careful account any longer. ${nm} simply stopped being among the counted.`,
    (nm) => `Whatever took the village in the end took ${nm} too, in the crowd of everyone else it took, until the difference between one death and the general ruin stopped mattering.`,
  ],
};
const LOSS_ENSLAVED = [
  (nm) => `${nm} still answers to their name, when it uses it. They set its table, wind its clocks, warm its bed, and somewhere very deep down, in a place that gets smaller every year, they know exactly what they have become.`,
  (nm) => `${nm} walks the lanes still, smiles when smiled at, says the right words in the right order. There is no one left inside to mean any of it, and the village has stopped being able to tell the difference, which is its own kind of horror.`,
  (nm) => `${nm} will grow old, or something that only looks like growing old, in service to the thing that took them: hollow, patient, and perfectly, permanently obedient, long after everyone who might have grieved them is gone too.`,
  (nm) => `Somewhere behind ${nm}'s familiar face there is a small cold room where the real ${nm} still stands, knocking, forever, on a door that will never again open from this side. Some nights, if you stand close enough, you can almost hear it.`,
];
/* Pass G2: the "joined" ending. The village's fates are no longer things
   that simply happened while the player searched; they are things the
   player will now deliver, or witness, from the other side of it. */
const JOINED_FATES = [
  (nm) => `${nm} does not know yet what has already been decided. You will be there when it comes for them, close enough to warn them, and you will not.`,
  (nm) => `${nm} still bars the door every night, still trusts the shape that knocks. You know better now. You may be the one who lets it in.`,
  (nm) => `${nm} will go on a little while yet, unwarned. You have already chosen not to be the one who tells them.`,
  (nm) => `Someday it will be ${nm}'s turn, and you will be standing just behind the thing that takes them, closer than anyone in this village has ever stood to it and lived to say so.`,
];
function seededShuffle(arr, seedStr) {
  let h = 0;
  for (let i = 0; i < seedStr.length; i++) h = (h * 31 + seedStr.charCodeAt(i)) >>> 0;
  const rand = () => { h = (h * 1664525 + 1013904223) >>> 0; return h / 4294967296; };
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
/* Deal one loss-fate line per villager, without repeats, stable for the run. */
function lossFate(s, x, kind) {
  const survivors = s.npcs.filter((n) => n.alive && !n.fled && n.id !== s.monster.vid).map((n) => n.id).sort();
  const idx = Math.max(0, survivors.indexOf(x.id));
  if (kind === "enslaved") {
    const pool = seededShuffle(LOSS_ENSLAVED, s.gameId + "-enslaved");
    return pool[idx % pool.length](x.name);
  }
  const m = monsterOf(s);
  const specific = LOSS_DEATHS[m.id] || [];
  const pool = seededShuffle([...specific, ...LOSS_DEATHS.generic], s.gameId + "-dead");
  return pool[idx % pool.length](x.name);
}
function joinedFate(s, x) {
  const survivors = s.npcs.filter((n) => n.alive && !n.fled && n.id !== s.monster.vid).map((n) => n.id).sort();
  const idx = Math.max(0, survivors.indexOf(x.id));
  const pool = seededShuffle(JOINED_FATES, s.gameId + "-joined");
  return pool[idx % pool.length](x.name);
}

/* Burial fates, drawn distinct per victim so an epilogue full of dead does
   not toll the same sentence over and over. */
const BURIED_WIN = [
  (nm) => `${nm} is buried in ground that can finally hold its dead. The bell tolled properly for them, at last.`,
  (nm) => `${nm} rests under a stone with their true name on it, in a churchyard no longer afraid of its own dark.`,
  (nm) => `${nm} is given the burying the nights denied them: slow, full, unhurried, the whole village standing witness.`,
  (nm) => `They lower ${nm} at noon, in daylight, unafraid, and the grave stays closed this time.`,
  (nm) => `${nm} has a proper stone now, and flowers no one is too frightened to bring.`,
  (nm) => `The bell counts ${nm} out honestly, one stroke a year, in a village that can afford to grieve again.`,
];
const BURIED_LOSS = [
  (nm) => `${nm} lies in ground that will not settle, in a village that no longer buries its dead one at a time.`,
  (nm) => `${nm} went into a shared trench with the others, nameless by nightfall, where the stones and the mourners ran out at once.`,
  (nm) => `${nm} was left where they fell, in the end. No one steady enough remained to lift them.`,
  (nm) => `They meant to bury ${nm} properly. The dark came again before the digging was done.`,
  (nm) => `${nm} has no marker. The hands that would have cut one were shaking too hard, or already still.`,
  (nm) => `${nm} is one more name the survivors will not say aloud, in a village learning to bury its dead in haste.`,
];

/* What became of them: one line per villager, shaped by this run. */
function epilogueLine(s, x) {
  const win = s.over.win;
  const joined = !win && s.over.reason === "joined";
  const m = monsterOf(s);
  if (x.id === s.monster.vid) return null;
  if (!x.alive) {
    const d = s.deaths.find((dd) => dd.id === x.id);
    if (!d) return null;
    if (d.kind === "executed") return `${x.name} was innocent, and hanged on your word. Their name is the one part of this that no dawn will come clean of.`;
    if (d.kind === "mobbed") return `${x.name} was hanged by the mob while the truth waited. The square is quieter for it, and worse.`;
    if (x.turned) return `${x.name} died already changed, which the village calls a mercy, in the voice people use when they are not sure.`;
    const buriedIdx = Math.max(0, s.deaths.filter((dd) => dd.kind === "slain").findIndex((dd) => dd.id === x.id));
    const buriedPool = seededShuffle(win ? BURIED_WIN : BURIED_LOSS, s.gameId + "-buried");
    return buriedPool[buriedIdx % buriedPool.length](x.name);
  }
  if (x.fled) return null;
  /* cured-but-scarred: distinct from both a normal survivor and a loss-ending
     fate. They were taken once, and brought back, and that does not wash out. */
  if (x.cured) return win
    ? `${x.name} came back from what took them, and is never quite the same for it. Wakes screaming some nights, but wakes. That is more than this village once thought possible.`
    : `${x.name} came back from what took them, one of the only mercies bought before the end. Wakes screaming some nights, in a village that may not survive to hear it.`;
  if (x.turned) return win
    ? `${x.name} woke at dawn as if from a long fever, remembering nothing. Their hands are still cold. Their hands will always be cold.`
    : joined ? joinedFate(s, x) : lossFate(s, x, "enslaved");
  if (!win) return joined ? joinedFate(s, x) : lossFate(s, x, m.attack === "turn" ? "enslaved" : "dead");
  if (x.secretKnown) return `${x.name} knows you learned their secret, and kept it. There is a loyalty in this village now that was not there before, and it is yours.`;
  if (s.hardCleared.includes(x.id)) return `${x.name} knows their neck was saved by a night you spent in the cold watching their door, and has never once said thank you out loud. Bread appears on your step anyway.`;
  if (x.offendedExam) return `${x.name} survived, and has not forgiven the glass you put to their chest. Survival, they would tell you, is not the same as thanks.`;
  if (x.sawYouWatching) return `${x.name} survived. They still glance at the shadow opposite their door before sleeping, and they still know it was you standing in it.`;
  return pick([
    `${x.name} goes on. Doors in the village are left unbarred again, one by one, and theirs was among the first.`,
    `${x.name} survived it all, and tells the story badly at the tavern, and you let every wrong detail stand.`,
    `${x.name} lives. On feast days they leave a place set for the dead, and never say which ones.`,
  ]);
}

    window.addEventListener("pointerdown", h, { once: true });

  const toggleSound = async () => {
    const on = await Snd.setEnabled(!snd);
    setSndOn(on);
    if (meta) saveMeta({ ...meta, sound: on });
  };

  /* -- record each finished game exactly once -- */
  useEffect(() => {
    if (!s || !s.over || !meta || recordedRef.current === s.gameId) return;
    recordedRef.current = s.gameId;
    const won = !!s.over.win;
    const defeated = { ...meta.defeated };
    if (won) defeated[s.monster.type] = (defeated[s.monster.type] || 0) + 1;
    const next = {
      ...meta,
      games: meta.games + 1,
      wins: meta.wins + (won ? 1 : 0),
      losses: meta.losses + (won ? 0 : 1),

      ach: [...meta.ach],
    };
    const earned = ACH.filter((a) => !next.ach.includes(a.id) && a.test(s, next)).map((a) => a.id);
    next.ach.push(...earned);
    setNewAch(earned);
    saveMeta(next);
    if (won) Snd.dawn(); else { Snd.sting(); try { if (navigator.vibrate) navigator.vibrate([70, 50, 70]); } catch (e2) {} }
  }, [s && s.over, meta]);

  /* -- ambience follows the phase -- */

    if (!s) { Snd.wind_(-34); Snd.beat(false); return; }

  if (s.phase === "night") {

        <style>{CSS_ALL}</style>
        <div className="absolute inset-0 mvNightFade" style={{ background: `linear-gradient(#0A0C18, ${C.sky} 70%, ${C.bg})` }} />
        <div className="mvSun absolute" style={{ left: "16%", top: "34%", width: 46, height: 46, borderRadius: "50%", background: "#E8B04B", boxShadow: "0 0 60px 22px rgba(232,176,75,0.35)" }} />
        <div className="mvMoon absolute" style={{ right: "14%", top: "10%", width: 34, height: 34, borderRadius: "50%", background: C.parch, boxShadow: "0 0 40px 12px rgba(233,223,200,0.15)" }} />
        <div className="relative max-w-md mx-auto px-6 pt-14 pb-8 h-full flex flex-col">
          <div className="flex items-baseline justify-between shrink-0">
            <span className="mv-display" style={{ fontSize: 16, letterSpacing: 3, textShadow: "0 1px 8px rgba(0,0,0,0.6)" }}>{s.beatTitle || `NIGHT ${s.nightNum}`}</span>
            <button onClick={toDawn} className="mv-body" style={{ background: "rgba(8,10,18,0.5)", border: "none", color: C.parch, fontSize: 13, cursor: "pointer", position: "relative", zIndex: 3, padding: "3px 10px", borderRadius: 8 }}>skip ≫</button>
          </div>
          <div className="mt-6 flex-1 min-h-0 overflow-y-auto pr-1" onClick={() => setBeatsRevealed(true)} style={{ cursor: beatsRevealed ? "default" : "pointer" }}>
            {beats.map((b, i) => (
              <p key={i} className={beatsRevealed ? "mt-4 first:mt-0" : "mvBeat mt-4 first:mt-0"} style={{ fontSize: 16, lineHeight: 1.45, animationDelay: beatsRevealed ? undefined : `${1.2 + i * 1.4}s`, textShadow: "0 1px 8px rgba(0,0,0,0.6)" }}>{b}</p>
            ))}
          </div>
          <div className={beatsRevealed ? "mt-6 shrink-0" : "mvBeat mt-6 shrink-0"} style={{ animationDelay: beatsRevealed ? undefined : `${total}s` }}>
            <Btn full kind="amber" onClick={toDawn}>{s.over ? "Onward →" : "Onward →"}</Btn>
          </div>
        </div>
      </div>
    );
  }

  /* ---------- Pass G2: the offer ----------
     Reached only in place of a death, and only once per game: a rare
     full-screen beat-reveal, pattern-matched to the night cinematic above,
     that ends on a real choice instead of "Onward". */
  if (s.phase === "offer") {
    const offerBeats = s.offerBeats || [];
    const offerTotal = 1.2 + offerBeats.length * 1.4;
    const monsterNpc = npcById(s, s.monster.vid);
    const joinIt = () => {
      setS({
        ...s,
        pendingOffer: null,
        phase: "day",
        over: {
          win: false,
          reason: "joined",
          text: `You take what it offers. Whatever ${monsterNpc.name} has been wearing this whole time, you walk out past the last house beside it now, and do not look back at the village that was still counting on you to save it.`,
        },
      });
    };
    const refuseIt = () => {
      const po = s.pendingOffer || {};
      const mm = monsterOf(s);
      const deathBeats = (DEATH_SCENES[mm.id] || DEATH_SCENES.wraith)(po.name || monsterNpc.name, po.where || "the dark");
      setS({
        ...s,
        pendingOffer: null,
        nightBeats: ["It waits one breath more for an answer that does not come the way it wanted, and then it stops waiting.", ...deathBeats],
        beatTitle: `NIGHT ${s.nightNum} · REFUSED`,
        phase: "night",
        over: { win: false, reason: "slain", text: po.overText || "Something found you in the dark, and this time it did not ask twice." },
      });
    };
    return (
      <div className="min-h-screen mv-body relative overflow-hidden" style={{ background: "linear-gradient(#3E3450, #B4623E 72%, #6E2530)", color: C.parch }}>
        <style>{CSS_ALL}</style>
        <div className="absolute inset-0 mvNightFade" style={{ background: `linear-gradient(#0A0C18, ${C.sky} 70%, ${C.bg})` }} />
        <div className="mvMoon absolute" style={{ right: "14%", top: "10%", width: 34, height: 34, borderRadius: "50%", background: C.parch, boxShadow: "0 0 40px 12px rgba(233,223,200,0.15)" }} />
        <div className="relative max-w-md mx-auto px-6 pt-14 pb-8 min-h-screen flex flex-col">
          <div className="flex items-baseline justify-between">
            <span className="mv-display" style={{ fontSize: 16, letterSpacing: 3, color: C.redBright, textShadow: "0 1px 8px rgba(0,0,0,0.6)" }}>IT MAKES AN OFFER</span>
          </div>
          <div className="mt-6 flex-1" onClick={() => setBeatsRevealed(true)} style={{ cursor: beatsRevealed ? "default" : "pointer" }}>
            {offerBeats.map((b, i) => (
              <p key={i} className={beatsRevealed ? "mt-4" : "mvBeat mt-4"} style={{ fontSize: 16, lineHeight: 1.45, animationDelay: beatsRevealed ? undefined : `${1.2 + i * 1.4}s`, textShadow: "0 1px 8px rgba(0,0,0,0.6)" }}>{b}</p>
            ))}
          </div>
          <div className={beatsRevealed ? "mt-6 flex flex-col gap-2" : "mvBeat mt-6 flex flex-col gap-2"} style={{ animationDelay: beatsRevealed ? undefined : `${offerTotal}s` }}>
            <Btn full kind="red" onClick={joinIt}>Take its hand</Btn>
            <Btn full onClick={refuseIt}>Refuse. Whatever comes next, comes</Btn>
          </div>
        </div>
      </div>
    );
  }

  /* ---------- Game over · the epilogue ---------- */
  if (s.over) {
    const monsterNpc = npcById(s, s.monster.vid);
    const mobbed = s.deaths.filter((d) => d.kind === "mobbed");
    const fates = s.npcs.map((x) => ({ x, line: epilogueLine(s, x) })).filter((f) => f.line);
    const planted = (s.planted || []);
    const joined = !s.over.win && s.over.reason === "joined";

    return (
      <div className="min-h-screen mv-body" style={{ background: C.bg, color: C.text }}>
        <style>{CSS_ALL}</style>
        <div className="max-w-md mx-auto px-5 pt-10 pb-10">
          <div className="mvIn" style={{ animationDelay: "0.2s" }}>
            <div className="mv-display" style={{ color: s.over.win ? C.amber : C.redBright, fontSize: 14, letterSpacing: 3 }}>
              {s.over.win ? "DAWN COMES CLEAN" : joined ? "YOU WALK ON, NOT ALONE" : "HOLLOW'S EDGE FALLS"}
            </div>
            <h1 className="mv-display mt-1" style={{ fontSize: 30, lineHeight: 1.1, color: C.parch }}>{s.over.win ? "It is over." : joined ? "It is over, and you did not stay to see the rest." : "It is over, and not in your favour."}</h1>
            <p className="mt-2" style={{ fontSize: 15 }}>{s.over.text}</p>
          </div>

          <div className="mvIn mt-4 rounded-lg p-3 flex gap-3 items-center" style={{ animationDelay: "0.9s", background: C.panel, border: `1px solid ${C.line}` }}>
            <MonsterArt id={m.id} size={72} />
            <div>
              <div className="mv-display" style={{ color: C.amber, fontSize: 12, letterSpacing: 2 }}>THE TRUTH</div>
              <p className="mt-1" style={{ color: C.parch, fontSize: 14 }}>
                <strong>{monsterNpc.name} {monsterNpc.role}</strong>, a <strong>{m.name}</strong>. The rite: <strong>{METHODS[m.method]}</strong>.
                {s.npcs.filter((x) => x.turned).length > 0 && ` It changed ${s.npcs.filter((x) => x.turned).map((x) => x.name).join(", ")} while you searched.`}
              </p>
            </div>
            <div className="ml-auto shrink-0"><Portrait id={monsterNpc.id} size={48} /></div>
          </div>

          <div className="mvIn mt-4" style={{ animationDelay: "1.6s" }}>
            <div className="mv-display" style={{ color: C.amber, fontSize: 12, letterSpacing: 2 }}>THE NIGHTS AS THEY TRULY WERE</div>
            <div className="mt-1 rounded-lg p-3" style={{ background: C.panel, border: `1px solid ${C.line}` }}>
              {s.nightLogs.map((log) => {
                const d = s.deaths.find((x) => x.night === log.night && x.kind === "slain");
                const t = s.deaths.find((x) => x.night === log.night && x.kind === "turned");
                const itTxt = log.active ? (log.huntLoc ? `it hunted the ${log.huntLoc}` : "it walked in the open") : "it kept perfectly still";
                const youTxt = !log.you ? "the village stood siege"
                  : log.you.kind === "out" ? `you searched the ${log.you.loc}`
                  : log.you.kind === "watch" ? `you watched ${(npcById(s, log.you.id) || {}).name}'s door`
                  : "you barred your door";
                return (
                  <div key={log.night} className="flex gap-2 py-0.5" style={{ fontSize: 13, borderBottom: `1px solid ${C.line}` }}>
                    <span className="mv-display shrink-0" style={{ width: 18, color: C.dim }}>{log.night}</span>
                    <span style={{ color: C.dim }}>{itTxt} · {youTxt}{d ? <span style={{ color: C.redBright }}> · {d.name} died</span> : t ? <span style={{ color: C.turn }}> · {t.name} was changed</span> : ""}</span>
                  </div>
                );
              })}
              {planted.length > 0 && (
                <p className="mt-2" style={{ fontSize: 13, color: C.redBright }}>
                  It salted your trail: {planted.map((p) => `false ${SIGNS[p.sg].toLowerCase()} at the ${p.loc}${p.exposed ? " (you caught it)" : ""}`).join("; ")}.
                </p>
              )}
            </div>
          </div>

          <div className="mvIn mt-4" style={{ animationDelay: "2.3s" }}>
            <div className="mv-display" style={{ color: C.amber, fontSize: 12, letterSpacing: 2 }}>{s.over.win ? "WHAT BECAME OF THEM" : joined ? "WHAT YOU LEAVE BEHIND" : "THE FALL OF HOLLOW'S EDGE"}</div>
            <div className="mt-1">
              {fates.map(({ x, line }) => (
                <div key={x.id} className="flex gap-3 items-start py-1.5" style={{ borderBottom: `1px solid ${C.line}` }}>
                  <div className="shrink-0"><Portrait id={x.id} size={36} dead={!x.alive} turnedKnown={x.turned && x.known} /></div>
                  <p style={{ fontSize: 13.5 }}>{line}</p>
                </div>
              ))}
            </div>
          </div>

          {newAch.length > 0 && (
            <div className="mvIn mt-4 rounded-lg p-3" style={{ animationDelay: "2.8s", background: "rgba(217,164,65,0.08)", border: `1px solid ${C.amber}` }}>
              <div className="mv-display" style={{ color: C.amber, fontSize: 12, letterSpacing: 2 }}>DEEDS EARNED</div>
              {newAch.map((id) => { const a = ACH.find((aa) => aa.id === id); return (
                <p key={id} className="mt-1" style={{ fontSize: 14 }}><span style={{ color: C.amber }}>✠ {a.name}</span> <span style={{ color: C.dim }}>: {a.desc}</span></p>
              ); })}
            </div>
          )}

          <p className="mvIn mt-3" style={{ animationDelay: "3s", color: C.dim, fontSize: 13 }}>
            {s.nightNum} night{s.nightNum === 1 ? "" : "s"} survived · {s.foundSigns.filter((sg) => m.signs.includes(sg)).length}/3 true signs surfaced · {s.deaths.filter((d) => d.kind === "executed").length} executed on your word{mobbed.length ? ` · ${mobbed.map((d) => d.name).join(", ")} hanged by the mob` : ""}
          </p>
          <div className="mvIn mt-3 grid grid-cols-1 gap-2" style={{ animationDelay: "3.2s" }}>
            <Btn kind="red" full onClick={() => setS(null)}>Return to the village gate</Btn>
          </div>
        </div>
      </div>
    );
  }

  const nightfall = (plan) => { setModal(null); setSheet(null); setProfile(null); setIv(null); setIvSub(null); setInvest(null); setWalk(null); Snd.beat(false); setS(resolveNight(s, plan)); if (typeof window !== "undefined") window.scrollTo({ top: 0 }); };

  /* ---------- The night walk ----------
     A fixed, ordered node queue is built once, here, from the facts already
     sampled for the night (sampleNight has already decided everything that
     WILL happen): the queue only ever reveals it, progressively, and lets
     player choices ride along as mods.* consumed later by resolveNight. The
     walk UI never rolls chance() to decide an outcome itself. */
  const nextStage = (w, fromType) => {
    const idx = (w.queue || []).indexOf(fromType);
    return (w.queue || [])[idx + 1] || "return";
  };

  const startWalk = (loc) => {
    const facts = sampleNight(s, monsterOf(s), s.nightNum + 1);
    const cand = s.npcs.filter((x) => x.alive && !x.fled && facts.outMap[x.id] && facts.outMap[x.id] !== "home");
    const queue = ["depart"];
    let lane = null;
    if (cand.length && chance(0.7)) {
      const w = pick(cand);
      lane = { wid: w.id, dest: facts.outMap[w.id], seen: facts.wx !== "fog" && chance(0.6) };
      queue.push("lane");
    }
    if (facts.evn && facts.eventLoc !== loc) queue.push("event");
    if (facts.wx !== "storm" && chance(0.55)) queue.push("sound");
    if (facts.active && (facts.huntLoc === loc || chance(0.25))) queue.push("hide");
    queue.push("approach");
    /* "company": every OTHER living villager (besides the monster, and
       besides whoever the "lane" node already covered) whose sampled
       destination for the night is this same location: decided here, once,
       from facts already locked in, never re-rolled. If nobody qualifies the
       stage is simply skipped (see goReturn). */
    const company = s.npcs.filter((x) => x.alive && !x.fled && x.id !== s.monster.vid && (!lane || x.id !== lane.wid) && facts.outMap[x.id] === loc).map((x) => x.id);
    if (company.length) queue.push("company");
    queue.push("return");
    setModal(null);
    setWalk({ mode: "out", loc, facts, mods: {}, queue, lane, company, vigilRoll: chance(0.5), chatUsed: false, soundLine: pickFreshIdx("walkSoundLines", WALK_SOUND_LINES), soundMundane: pickFreshIdx("soundChaseMundane", SOUND_CHASE_MUNDANE), soundHeard: soundFor(monsterOf(s).id), hideIntro: pickFreshIdx("hideIntro", HIDE_INTRO_LINES)(loc), approachLine: pickFreshIdx("quietApproach", QUIET_APPROACH_LINES)(loc), vigilLine: pickFreshIdx("vigilLines", VIGIL_LINES)(loc), log: [pickFreshIdx("outLines", OUT_LINES)(loc)], stage: "depart" });
  };

  const commitWalk = (extra) => nightfall({ kind: "out", loc: extra.loc || walk.loc, mods: { ...walk.mods, ...extra, walkLog: walk.log, closureLine: walk.closureLine || null }, facts: walk.facts });

  /* Funnels every "approach" branch (danger press/shadow/back, the quiet
     search-style choice, and the vigil hold/shift choice) back toward
     "return", but detours through "company" first, exactly once, if there
     are villagers left to reveal and the player actually arrived (didn't
     turn back). Dynamically excludes anyone already handled by a lane/event
     interaction this same walk, since startWalk could not have known those
     choices in advance. */
  const goReturn = (extraMods) => {
    const newMods = { ...walk.mods, ...(extraMods || {}) };
    const extraLog = [];
    const f = walk.facts;
    if (newMods.approach !== "back") {
      /* -- the boundary circuit pays out live, never silently -- */
      if (newMods.style === "circle" && !newMods.circleDone) {
        newMods.circleDone = true;
        const others = s.npcs.filter((x) => x.alive && !x.fled && x.id !== s.monster.vid && f.outMap[x.id] && f.outMap[x.id] !== "home" && f.outMap[x.id] !== walk.loc && ![newMods.follow, newMods.hailed, newMods.followSeen, newMods.mingledWith].includes(x.id));
        if (f.active && f.huntLoc && f.huntLoc !== walk.loc && chance(0.55)) {
          newMods.circleFigure = true;
          extraLog.push(`Half the circuit done, you see it: a hooded shape cutting between the houses at a distance, moving toward the ${f.huntLoc} with a purpose nothing innocent owns. Too far to swear to a face. Near enough that your body makes several decisions without consulting you.`);
        } else if (others.length && chance(0.7)) {
          const cw = pick(others);
          newMods.circleSaw = cw.id;
          extraLog.push(`From a gateway on the boundary you catch a lantern where no lantern should be: ${npcById(s, cw.id).name}, hooded and hurrying, slipping toward the ${f.outMap[cw.id]}.`);
        } else {
          extraLog.push("You walk the whole boundary of Hollow's Edge, gate by gate, dark window by dark window. Every door barred. Every light out. Whatever walks tonight is not using the roads, and knowing that is its own kind of answer.");
        }
      }
      /* -- the ground gives its answer live, too: rolled once, shown here,
         settled in resolveNight without re-rolling or re-narrating -- */
      if (!newMods.searchRoll) {
        const unfound = s.locEvidence[walk.loc].filter((sg) => !s.foundSigns.includes(sg));
        let findP = f.wx === "frost" && unfound.some((sg) => SIGN_CATS.ground.includes(sg)) ? 0.8 : 0.6;
        if (newMods.style === "ground") findP = Math.min(0.92, findP + 0.25);
        if (newMods.vigil === "shift") findP = Math.min(0.95, findP + 0.15);
        if (f.wx === "storm") findP = Math.max(0.15, findP - 0.2);
        const found = unfound.length && chance(findP) ? pick(unfound) : null;
        newMods.searchRoll = { found, sense: found ? senseFor(found) : null };
        if (found) extraLog.push(`Your lantern catches something half-hidden at your feet. You crouch, and look, and wish you had not. ${newMods.searchRoll.sense}`);
        else if (newMods.vigil === "shift") extraLog.push(`You shift for the better look, and the figure is gone by the time you have the angle: only scuffed ground where something stood, and the feeling of the ${walk.loc} being one heartbeat emptier than it should be. Someone real was here. Or something.`);
        else if (newMods.vigil === "hold") extraLog.push("You hold your vantage until your knees lock. The figure does not come again. Whatever it was, it waits better than you do.");
      }
    }
    const excluded = new Set([newMods.follow, newMods.hailed, newMods.followSeen, newMods.mingledWith].filter(Boolean));
    const companyIds = (walk.company || []).filter((id) => !excluded.has(id));
    const nextLog = extraLog.length ? [...walk.log, ...extraLog] : walk.log;
    if (newMods.approach !== "back" && !newMods.company && companyIds.length) {
      setWalk({ ...walk, mods: { ...newMods, company: companyIds }, log: nextLog, stage: "company" });
      return;
    }
    setWalk({ ...walk, mods: newMods, log: nextLog, stage: "return", closureLine: walk.closureLine || pickFreshIdx("walkClosures", WALK_CLOSURES)(walk.loc) });
  };

  const chooseHide = (choice) => { Snd.relief(); setWalk({ ...walk, mods: { ...walk.mods, hid: choice }, stage: nextStage(walk, "hide"), log: [...walk.log, pick(HIDE_CHOICES[choice]), `When the lane is empty again, you go on toward the ${walk.loc}.`] }); };

  const chooseStyle = (style) => {
    if ((style === "ground" || style === "wait") && walk.vigilRoll) setWalk({ ...walk, vigilStyle: style, stage: "vigil" });
    else goReturn({ style });
  };

  const startWatchWalk = (id) => {
    const facts = sampleNight(s, monsterOf(s), s.nightNum + 1);
    const tLoc = facts.outMap[id];
    const leaves = !!(tLoc && tLoc !== "home");
    /* Roll the stay-home outcome once, onto the shared facts, so the live walk
       (below) and the morning recap (resolveNight) tell the same story. */
    if (!leaves) facts.homeWatch = rollHomeWatch(s, id);
    setModal(null);
    const openLine = pickFreshIdx("watchLines", WATCH_LINES)(npcById(s, id).name);
    const log = watchIntroSeen ? [openLine] : ["You will live this night in the lanes, choice by choice.", openLine];
    setWalk({ mode: "watch", targetId: id, facts, mods: {}, leaves, quietLine: pickFreshIdx("quietWatch", QUIET_WATCH_LINES)(npcById(s, id).name), retireLine: pickFreshIdx("retireLines", RETIRE_LINES)(npcById(s, id).name), log, stage: "post" });
    if (!watchIntroSeen) setWatchIntroSeen(true);
  };

  const commitWatch = (extra) => nightfall({ kind: "watch", id: walk.targetId, facts: walk.facts, mods: { ...walk.mods, ...extra, walkLog: walk.log } });

  const followScene = (wid) => {
    const w = npcById(s, wid);
    const dest = walk.facts.outMap[wid] || walk.loc;
    if (wid === s.monster.vid && walk.facts.active) return { kind: "monster", dest, text: pickFreshIdx("followMonster", FOLLOW_MONSTER_SCENES)(w.name, dest) };
    if (w.turned) return { kind: "turned", dest, text: pickFreshIdx("followTurned", FOLLOW_TURNED_SCENES)(w.name, dest) };
    if (walk.facts.secretOut[wid]) return { kind: "secret", dest, text: SECRETS[wid].walk(w.name) };
    return { kind: "plain", dest, text: pickFreshIdx("followPlain", FOLLOW_PLAIN_SCENES)(w.name, dest) };
  };

  const hailLine = (wid) => {
    const w = npcById(s, wid);
    const dest = walk.facts.outMap[wid];
    if (wid === s.monster.vid && walk.facts.active) return pickFreshIdx("hailMonster", HAIL_MONSTER_LINES)(w.name, dest);
    if (w.turned) return pickFreshIdx("hailTurned", HAIL_TURNED_LINES)(w.name);
    if (walk.facts.secretOut[wid]) return SECRETS[wid].hail(w.name);
    return pickFreshIdx("hailPlain", HAIL_PLAIN_LINES)(w.name, dest);
  };

  /* ---------- a village event, met on the road ---------- */
  const mingleLine = (wid) => {
    const w = npcById(s, wid);
    if (wid === s.monster.vid && walk.facts.active) return `${w.name} raises a cup to you across the firelight, easy, unbothered. "Strange night for merriment," they say, and the smile takes one beat too long to arrive. "But then, here we both are."`;
    if (w.turned) return `${w.name} stands at the edge of the light and does not drink, does not dance, does not quite manage a smile that reaches anywhere past the mouth. "Good evening," they say, and the words come out a beat behind the lips that made them.`;
    if (walk.facts.secretOut[wid]) return SECRETS[wid].hail(w.name);
    return `"${w.name}!" You fall into easy talk for a few minutes, nothing that matters, and all the more welcome for it.`;
  };
  const mingleObservation = (excludeId) => {
    const attendees = s.npcs.filter((x) => x.alive && x.id !== excludeId && walk.facts.outMap[x.id] === walk.facts.eventLoc);
    const turnedThere = attendees.filter((x) => x.turned);
    if (turnedThere.length && chance(0.5)) {
      const t = pick(turnedThere);
      return `Across the light, ${t.name} stands apart from it all, touching nothing: not the cider, not a single hand offered in greeting.`;
    }
    const absent = s.npcs.filter((x) => x.alive && x.id !== s.monster.vid && x.id !== excludeId && walk.facts.outMap[x.id] !== walk.facts.eventLoc);
    if (absent.length && chance(0.5)) {
      const a = pick(absent);
      return `You notice, the way you notice everything now, who isn't here: ${a.name}, on a night when half the village turned out.`;
    }
    return "Nothing more than an ordinary crowd, for one ordinary hour.";
  };
  const mingle = () => {
    const attendees = s.npcs.filter((x) => x.alive && walk.facts.outMap[x.id] === walk.facts.eventLoc);
    if (!attendees.length) { setWalk({ ...walk, stage: nextStage(walk, "event"), log: [...walk.log, "The gathering thins before you reach it. You keep to your errand."] }); return; }
    const w = pick(attendees);
    /* -- Pass H: a warm chime for an ordinary, friendly mingle; the tense
       cases (the active monster itself, or someone already turned) get no
       such comfort. -- */
    const friendly = !(w.id === s.monster.vid && walk.facts.active) && !w.turned;
    if (friendly) Snd.warm();
    setWalk({ ...walk, mods: { ...walk.mods, mingled: walk.facts.evn.id, mingledWith: w.id }, mingleId: w.id, mingleText: mingleLine(w.id), mingleObs: mingleObservation(w.id), stage: "mingled" });
  };
  const watchShadows = () => {
    const cand = s.npcs.filter((x) => x.alive && !x.fled && walk.facts.outMap[x.id] && walk.facts.outMap[x.id] !== "home" && walk.facts.outMap[x.id] !== walk.facts.eventLoc);
    if (!cand.length) { setWalk({ ...walk, stage: nextStage(walk, "event"), log: [...walk.log, "You watch from the dark a while. Nothing peels away from the light worth following."] }); return; }
    const w = pick(cand);
    const sc = followScene(w.id);
    setWalk({ ...walk, lane: { wid: w.id, dest: sc.dest }, followScene: sc, followFrom: "event", stage: "followed", log: [...walk.log, `Someone slips away from the ${walk.facts.eventLoc}, alone, and you let curiosity get the better of you.`] });
  };

  const walkModal = walk && (() => {
    const isWatch = walk.mode === "watch";
    const evn = walk.facts.evn;
    const atEvent = !isWatch && evn && walk.facts.eventLoc === walk.loc;
    const danger = !isWatch && walk.stage === "approach" && walk.facts.active && walk.facts.huntLoc === walk.loc;
    const w = walk.lane ? npcById(s, walk.lane.wid) : null;
    return (
      <div className="fixed inset-0 z-40 mv-body overflow-hidden" style={{ background: `linear-gradient(#0A0C18, ${C.sky} 70%, ${C.bg})`, color: C.parch, WebkitOverflowScrolling: "touch" }}>
        <div className="max-w-md mx-auto px-6 pt-12 pb-10 h-full flex flex-col">
          <div className="flex items-baseline justify-between shrink-0">
            <span className="mv-display" style={{ fontSize: 16, letterSpacing: 3, textShadow: "0 1px 8px rgba(0,0,0,0.6)" }}>NIGHT {s.nightNum + 1} · {isWatch ? "THE WATCH" : "THE LANES"}</span>
            <span style={{ fontSize: 12, color: C.dim }}>{walk.facts.wx ? { fog: "fog", storm: "storm coming", frost: "hard frost" }[walk.facts.wx] : "clear"}</span>
          </div>
          <div ref={walkLogRef} className="flex-1 min-h-0 overflow-y-auto pr-1" style={{ WebkitOverflowScrolling: "touch" }}>
            {walk.log.map((t, i) => {
              const current = i === walk.log.length - 1;
              return (
                <p key={i} className="mt-4 first:mt-0" style={{ fontSize: 16, lineHeight: 1.45, color: current ? C.parch : "rgba(233,223,200,0.42)", textShadow: "0 1px 8px rgba(0,0,0,0.6)" }}>
                  {current ? <SpokenText text={t} speed={40} /> : t}
                </p>
              );
            })}
          </div>
          <div className="shrink-0 mt-3 pt-4" style={{ borderTop: `1px solid ${C.line}` }}>
            {!isWatch && walk.stage === "depart" && (
              <div className="flex flex-col gap-2">
                {walk.facts.wx && <p style={{ fontSize: 14, color: C.dim, fontStyle: "italic" }}>{WEATHER[walk.facts.wx].beat}</p>}
                <Btn full kind="amber" onClick={() => { const extra = []; if (walk.facts.wx) extra.push(WEATHER_WALK[walk.facts.wx]); if (chance(0.55)) extra.push(pick(WALK_ODD_SIGHTS)(walk.loc)); setWalk({ ...walk, stage: nextStage(walk, "depart"), log: extra.length ? [...walk.log, ...extra] : walk.log }); }}>Into the dark →</Btn>
              </div>
            )}
            {!isWatch && walk.stage === "lane" && (
              <div className="flex flex-col gap-2">
                <p style={{ fontSize: 15, color: C.text }}>
                  {walk.lane.seen
                    ? `Ahead in the lane, a figure with a hood half-up: ${w.name}, unmistakably, moving with purpose toward the ${walk.lane.dest}.`
                    : `A hooded figure crosses the lane ahead, face lost to the dark, making for the ${walk.lane.dest}.`}
                </p>
                <Btn full kind="amber" onClick={() => { const sc = followScene(walk.lane.wid); setWalk({ ...walk, followFrom: "lane", stage: "followed", followScene: sc, log: [...walk.log, `You fall in behind, two shadows back, matching their pace toward the ${sc.dest}.`] }); }}>Follow them, two shadows back</Btn>
                <Btn full kind="amber" onClick={() => setWalk({ ...walk, mods: { ...walk.mods, hailed: walk.lane.wid }, stage: "hailed", hailText: hailLine(walk.lane.wid) })}>Hail them, softly</Btn>
                <Btn full onClick={() => setWalk({ ...walk, stage: nextStage(walk, "lane"), log: [...walk.log, `You let the figure pass and keep to your own errand, toward the ${walk.loc}.`] })}>Let them go. Keep to your errand</Btn>
              </div>
            )}
            {!isWatch && walk.stage === "hailed" && (() => {
              const hw = npcById(s, walk.lane.wid);
              return (
                <div className="flex flex-col gap-2">
                  <div className="rounded-lg p-3 flex gap-3 items-start" style={{ background: C.panel, border: `1px solid ${C.line}` }}>
                    <div className="shrink-0"><Portrait id={hw.id} size={48} /></div>
                    <div>
                      <div className="mv-display" style={{ color: C.amber, fontSize: 13, letterSpacing: 1 }}>{hw.name} {hw.role}</div>
                      <p className="mt-1" style={{ fontSize: 14, fontStyle: "italic" }}>{walk.hailText}</p>
                      {walk.chatText && <p className="mt-1" style={{ fontSize: 14, fontStyle: "italic" }}>{walk.chatText}</p>}
                    </div>
                  </div>
                  {!walk.chatUsed && <Btn full onClick={() => setWalk({ ...walk, chatUsed: true, chatText: pick(LANE_CHAT_LINES) })}>Ask what they've seen</Btn>}
                  <Btn full kind="amber" onClick={() => setWalk({ ...walk, stage: nextStage(walk, "lane"), log: [...walk.log, `You met ${hw.name} in the lane. They went their way, and you go yours, toward the ${walk.loc}.`] })}>Go your way →</Btn>
                </div>
              );
            })()}
            {!isWatch && walk.stage === "followed" && (() => {
              const fsc = walk.followScene;
              const fw2 = npcById(s, walk.lane.wid);
              return (
                <div className="flex flex-col gap-2">
                  <p style={{ fontSize: 15, color: fsc.kind === "monster" ? C.redBright : C.text }}>{fsc.text}</p>
                  {fsc.kind === "monster" && (<>
                    {armedGuess && <p style={{ fontSize: 13, color: C.amber, fontStyle: "italic" }}>Your journal holds one name now: the {armedGuess.name}. The {METHODS[armedGuess.method]} is under your coat. If you are right, this ends tonight, before it takes another soul. If you are wrong, so do you.</p>}
                    <Btn full onClick={() => commitWalk({ follow: fw2.id, followAct: "flee", loc: fsc.dest })}>Flee, quietly, while it is busy</Btn>
                    <Btn full kind="amber" onClick={() => commitWalk({ follow: fw2.id, followAct: "watch", loc: fsc.dest })}>Stay hidden. Watch it. Learn it</Btn>
                    <Btn full kind="red" onClick={() => commitWalk({ follow: fw2.id, followAct: "confront", loc: fsc.dest })}>{armedGuess ? "Step out. Name it. End it here" : "Step out and say the name"}</Btn>
                  </>)}
                  {fsc.kind === "turned" && <Btn full kind="amber" onClick={() => commitWalk({ follow: fw2.id, loc: fsc.dest })}>Slip away with what you know</Btn>}
                  {fsc.kind === "secret" && <Btn full kind="amber" onClick={() => commitWalk({ follow: fw2.id, loc: fsc.dest })}>Leave without being seen</Btn>}
                  {fsc.kind === "plain" && (<>
                    <Btn full kind="amber" onClick={() => setWalk({ ...walk, mods: { ...walk.mods, followSeen: fw2.id }, stage: nextStage(walk, walk.followFrom || "lane"), log: [...walk.log, fsc.text, `You leave ${fw2.name} to it and turn for the ${walk.loc}.`] })}>Leave them to it. On to the {walk.loc}</Btn>
                    <Btn full onClick={() => commitWalk({ follow: fw2.id, followAct: "home", loc: fsc.dest })}>Enough for one night. Head home</Btn>
                  </>)}
                </div>
              );
            })()}
            {!isWatch && walk.stage === "event" && evn && (
              <div className="flex flex-col gap-2">
                <p style={{ fontSize: 15, color: C.text }}>Light and fiddle music drift from the {walk.facts.eventLoc}: the {evn.name}, defiant against the dark.</p>
                <Btn full kind="amber" onClick={mingle}>Mingle briefly</Btn>
                <Btn full kind="amber" onClick={watchShadows}>Watch from the shadows</Btn>
                <Btn full onClick={() => setWalk({ ...walk, stage: nextStage(walk, "event"), log: [...walk.log, `You give the ${evn.name} a wide berth and keep to your errand.`] })}>Pass on. Keep to your errand</Btn>
              </div>
            )}
            {!isWatch && walk.stage === "mingled" && (() => {
              const mw = npcById(s, walk.mingleId);
              return (
                <div className="flex flex-col gap-2">
                  <div className="rounded-lg p-3 flex gap-3 items-start" style={{ background: C.panel, border: `1px solid ${C.line}` }}>
                    <div className="shrink-0"><Portrait id={mw.id} size={48} /></div>
                    <div>
                      <div className="mv-display" style={{ color: C.amber, fontSize: 13, letterSpacing: 1 }}>{mw.name} {mw.role}</div>
                      <p className="mt-1" style={{ fontSize: 14, fontStyle: "italic" }}>{walk.mingleText}</p>
                    </div>
                  </div>
                  <p style={{ fontSize: 14, color: C.text }}>{walk.mingleObs}</p>
                  <Btn full kind="amber" onClick={() => setWalk({ ...walk, stage: nextStage(walk, "event"), log: [...walk.log, `You linger a while at the ${walk.facts.eventLoc}, and then turn back to your own errand.`] })}>On, into the dark →</Btn>
                </div>
              );
            })()}
            {!isWatch && walk.stage === "sound" && (
              <div className="flex flex-col gap-2">
                <p style={{ fontSize: 15, color: C.text }}>{walk.soundLine}</p>
                <Btn full kind="red" onClick={() => setWalk({ ...walk, mods: { ...walk.mods, soundChase: true, soundHeard: walk.soundHeard }, stage: "chased", log: [...walk.log, walk.soundLine, "You turn off your road, toward it."] })}>Follow the sound</Btn>
                <Btn full onClick={() => setWalk({ ...walk, stage: nextStage(walk, "sound"), log: [...walk.log, walk.soundLine, "You let the dark keep its noises, and press on."] })}>Keep to your road</Btn>
              </div>
            )}
            {!isWatch && walk.stage === "chased" && (() => {
              /* the outcome here was already decided by the facts sampled
                 before the walk began (whether the night is active): the
                 only randomness is which mundane thing it turns out to be on
                 a quiet night, and that was pre-drawn at startWalk time
                 (walk.soundMundane), never rolled here. */
              const heard = walk.soundHeard || "A thin sound, like grief drawn through a keyhole, that stops the instant you stop.";
              return (
                <div className="flex flex-col gap-2">
                  <p style={{ fontSize: 15, color: walk.facts.active ? C.redBright : C.text }}>
                    {walk.facts.active
                      ? `You follow the sound until it stops being ahead of you and starts being everywhere at once. You stand very still in the middle of it, and listen, and learn something you will not be able to unlearn. ${heard}`
                      : walk.soundMundane}
                  </p>
                  <Btn full kind="amber" onClick={() => setWalk({ ...walk, stage: nextStage(walk, "sound"), log: [...walk.log, `You find your road again and go on toward the ${walk.loc}.`] })}>Find your road again, on to the {walk.loc} →</Btn>
                </div>
              );
            })()}
            {!isWatch && walk.stage === "hide" && (
              <div className="flex flex-col gap-2">
                <p style={{ fontSize: 15, color: C.redBright }}>{walk.hideIntro || HIDE_INTRO_LINES[(s.nightNum + walk.loc.length) % HIDE_INTRO_LINES.length](walk.loc)}</p>
                <Btn full kind="amber" onClick={() => chooseHide("doorway")}>Press into a doorway</Btn>
                <Btn full kind="amber" onClick={() => chooseHide("shadow")}>Drop into shadow and wait it out</Btn>
                <Btn full kind="red" onClick={() => chooseHide("still")}>Stand very still, and hope</Btn>
              </div>
            )}
            {!isWatch && walk.stage === "approach" && danger && (
              <div className="flex flex-col gap-2">
                <p style={{ fontSize: 15, color: C.redBright }}>
                  {atEvent
                    ? `You reach the edge of the ${evn.name}'s firelight, and something about the crowd feels wrong before you can say why: a shape moving against the grain of the dancing, patient, at the margins where the light gives out.`
                    : `You are close now. And something is already at the ${walk.loc}: a movement low against the stones, with terrible purpose in it. Your heart is louder than your boots.`}
                </p>
                <Btn full kind="red" onClick={() => goReturn({ approach: "press" })}>Press closer. You need to SEE it</Btn>
                <Btn full kind="amber" onClick={() => goReturn({ approach: "shadow" })}>Hold to the shadows and watch</Btn>
                <Btn full onClick={() => goReturn({ approach: "back" })}>Turn for home, while you can</Btn>
              </div>
            )}
            {!isWatch && walk.stage === "approach" && !danger && (
              <div className="flex flex-col gap-2">
                <p style={{ fontSize: 15, color: C.text }}>
                  {atEvent
                    ? `You reach the ${evn.name}, and the ordinary business of searching feels almost obscene here, among the fiddle music and the cider. But you came to look, so you look, at the edges where the firelight doesn't quite reach.`
                    : (walk.approachLine || QUIET_APPROACH_LINES[0](walk.loc))}
                </p>
                <Btn full kind="amber" onClick={() => chooseStyle("ground")}>Search the ground, inch by inch</Btn>
                <Btn full kind="amber" onClick={() => chooseStyle("wait")}>Find a vantage and wait. Watch who comes</Btn>
                <Btn full kind="amber" onClick={() => chooseStyle("circle")}>Circle the boundary lanes</Btn>
              </div>
            )}
            {!isWatch && walk.stage === "vigil" && (
              <div className="flex flex-col gap-2">
                <p style={{ fontSize: 15, color: C.text }}>{walk.vigilLine || VIGIL_LINES[0](walk.loc)}</p>
                <Btn full kind="amber" onClick={() => goReturn({ style: walk.vigilStyle, vigil: "hold" })}>Hold your vantage</Btn>
                <Btn full kind="red" onClick={() => goReturn({ style: walk.vigilStyle, vigil: "shift" })}>Shift for a better look</Btn>
              </div>
            )}
            {!isWatch && walk.stage === "company" && (() => {
              /* who is shown here, and what they're doing, was fixed at
                 startWalk time (walk.company): this is the ONLY place an
                 "other villager also out tonight" encounter is narrated, so
                 resolveNight's dawn report can only ever report on exactly
                 what is shown on this screen (mods.company). */
              const ids = walk.mods.company || walk.company || [];
              const names = ids.map((id) => npcById(s, id).name);
              const secretId = walk.mods.style === "wait" ? ids.find((id) => walk.facts.secretOut[id] && !npcById(s, id).secretKnown) : null;
              const text = secretId
                ? SECRETS[secretId].walk(npcById(s, secretId).name)
                : names.length === 1
                ? `A lantern across the way: ${names[0]}, out on some errand of their own. You keep to your shadow and let them pass.`
                : `You are not alone out here tonight. ${names.join(" and ")}, each about their own business, lanterns bobbing at a careful distance.`;
              return (
                <div className="flex flex-col gap-2">
                  <p style={{ fontSize: 15, color: C.text }}>{text}</p>
                  <Btn full kind="amber" onClick={() => goReturn({})}>On, toward the {walk.loc} →</Btn>
                </div>
              );
            })()}
            {!isWatch && walk.stage === "return" && (
              <div className="flex flex-col gap-2">
                <p style={{ fontSize: 15, color: C.text }}>{walk.closureLine || pickFreshIdx("walkClosures", WALK_CLOSURES)(walk.loc)}</p>
                <Btn full kind="amber" onClick={() => commitWalk({})}>Head home, and bar the door →</Btn>
              </div>
            )}

            {isWatch && walk.stage === "post" && (
              <div className="flex flex-col gap-2">
                {walk.facts.wx && <p style={{ fontSize: 14, color: C.dim, fontStyle: "italic" }}>{WEATHER[walk.facts.wx].beat}</p>}
                <Btn full kind="amber" onClick={() => setWalk({ ...walk, stage: walk.leaves ? "leave" : "quiet" })}>Settle in and watch →</Btn>
              </div>
            )}
            {isWatch && walk.stage === "leave" && (() => {
              const t = npcById(s, walk.targetId);
              return (
                <div className="flex flex-col gap-2">
                  <p style={{ fontSize: 15, color: C.text }}>{`${t.name}'s door opens, soft as breath. A figure slips out into the lane, and you are already moving.`}</p>
                  <Btn full kind="amber" onClick={() => setWalk({ ...walk, stage: "trail", trailLine: pickFreshIdx("walkSoundLines", WALK_SOUND_LINES) })}>Follow, keeping to the walls →</Btn>
                </div>
              );
            })()}
            {isWatch && walk.stage === "trail" && (
              <div className="flex flex-col gap-2">
                <p style={{ fontSize: 15, color: C.text }}>{walk.trailLine}</p>
                <Btn full kind="amber" onClick={() => { const t = npcById(s, walk.targetId); const sc = followScene(walk.targetId); setWalk({ ...walk, followScene: sc, stage: "reveal", log: [...walk.log, `${t.name}'s door opens, soft as breath. A figure slips out into the lane.`, `You keep close through the lanes, two shadows back, all the way to the ${sc.dest}.`] }); }}>Keep close →</Btn>
              </div>
            )}
            {isWatch && walk.stage === "reveal" && (() => {
              const fsc = walk.followScene;
              return (
                <div className="flex flex-col gap-2">
                  <p style={{ fontSize: 15, color: fsc.kind === "monster" ? C.redBright : C.text }}>{fsc.text}</p>
                  {fsc.kind === "monster" && (<>
                    {armedGuess && <p style={{ fontSize: 13, color: C.amber, fontStyle: "italic" }}>Your journal holds one name now: the {armedGuess.name}. The {METHODS[armedGuess.method]} is under your coat. If you are right, this ends tonight, before it takes another soul. If you are wrong, so do you.</p>}
                    <Btn full onClick={() => commitWatch({ follow: walk.targetId, followAct: "flee" })}>Flee, quietly, while it is busy</Btn>
                    <Btn full kind="amber" onClick={() => commitWatch({ follow: walk.targetId, followAct: "watch" })}>Stay hidden. Watch it. Learn it</Btn>
                    <Btn full kind="red" onClick={() => commitWatch({ follow: walk.targetId, followAct: "confront" })}>{armedGuess ? "Step out. Name it. End it here" : "Step out and say the name"}</Btn>
                  </>)}
                  {fsc.kind === "turned" && (<>
                    <Btn full kind="amber" onClick={() => commitWatch({ follow: walk.targetId })}>Let them go. Slip away with what you know</Btn>
                    <Btn full onClick={() => commitWatch({ follow: walk.targetId, followAct: "help" })}>Try to reach them</Btn>
                  </>)}
                  {fsc.kind === "secret" && <Btn full kind="amber" onClick={() => commitWatch({ follow: walk.targetId })}>Leave without being seen</Btn>}
                  {fsc.kind === "plain" && <Btn full kind="amber" onClick={() => commitWatch({ follow: walk.targetId })}>Enough for one night. Head home</Btn>}
                </div>
              );
            })()}
            {isWatch && walk.stage === "quiet" && (() => {
              const t = npcById(s, walk.targetId);
              const hw = walk.facts.homeWatch;
              const vis = hw && hw.kind === "visitor" ? npcById(s, hw.visitorId) : null;
              const quietText =
                hw && hw.kind === "secret"
                  ? `Through a gap in the shutter, ${t.name} does the very thing they have been lying about, alone, human, and sadder than you had let yourself expect. You have their secret now, and it is not the thing you hunt.`
                  : hw && hw.kind === "visitor" && vis
                  ? `${t.name} never leaves. But past midnight a second figure crosses the lane to their door, is let in without a knock, and is gone before the bell. You know that gait. It is ${vis.name}.`
                  : hw && hw.kind === "restless"
                  ? WATCH_RESTLESS[hw.ri % WATCH_RESTLESS.length](t.name)
                  : walk.quietLine || QUIET_WATCH_LINES[(s.nightNum + t.name.length) % QUIET_WATCH_LINES.length](t.name);
              const settled = hw && hw.kind !== "quiet";
              return (
                <div className="flex flex-col gap-2">
                  <p style={{ fontSize: 15, color: C.text }}>{quietText}</p>
                  <Btn full kind="amber" onClick={() => setWalk({ ...walk, stage: "retire" })}>{settled ? "Slip away with what you have →" : "Wait it out →"}</Btn>
                </div>
              );
            })()}
            {isWatch && walk.stage === "retire" && (() => {
              const t = npcById(s, walk.targetId);
              const hw = walk.facts.homeWatch;
              const settled = hw && hw.kind !== "quiet";
              const retireText = settled
                ? `You have carried enough out of the dark for one night. You go back the way you came, turning it over, and do not breathe easy until your own bolt is thrown.`
                : walk.retireLine || RETIRE_LINES[0](t.name);
              return (
                <div className="flex flex-col gap-2">
                  <p style={{ fontSize: 15, color: C.text }}>{retireText}</p>
                  <Btn full kind="amber" onClick={() => commitWatch({})}>Head home yourself, and bar the door →</Btn>
                </div>
              );
            })()}
          </div>
        </div>
      </div>
    );
  })();

  /* ---------- Journal ---------- */
  const journal = tab && (
    <div className="fixed inset-0 z-40 flex flex-col" style={{ background: "rgba(8,10,18,0.85)" }} onClick={() => setTab(null)}>
      <div className="mt-auto rounded-t-xl p-4 max-h-[85vh] overflow-y-auto mv-body" style={{ background: C.parch, color: C.ink, WebkitOverflowScrolling: "touch", overscrollBehavior: "contain" }} onClick={(e) => e.stopPropagation()}>
        <div className="flex gap-2 flex-wrap mb-3">
          {[["evidence", "Evidence"], ["bestiary", "Bestiary"], ["statements", "Testimony"], ["nights", "Nights"], ["help", "Help"]].map(([k, label]) => (
            <button key={k} onClick={() => setTab(k)} className="mv-display px-3 py-1 rounded"
              style={{ fontSize: 13, letterSpacing: 1, background: tab === k ? C.ink : "transparent", color: tab === k ? C.parch : C.inkDim, border: `1px solid ${tab === k ? C.ink : C.parchLine}` }}>
              {label}
            </button>
          ))}
          <button onClick={() => setTab(null)} className="ml-auto mv-display px-3 py-1" style={{ color: C.inkDim, fontSize: 13 }}>Close ✕</button>
        </div>

        {tab === "evidence" && (
          <div>
            <div className="mv-display" style={{ fontSize: 16, letterSpacing: 1 }}>Signs · tick what you believe</div>
            <div className="grid grid-cols-2 gap-x-4 mt-2">
              {Object.entries(SIGNS).filter(([k]) => k !== "wail").map(([k, label]) => {
                const ticked = s.playerSigns.includes(k);
                const witnessed = s.foundSigns.includes(k);
                return (
                  <button key={k} onClick={() => setS({ ...s, playerSigns: ticked ? s.playerSigns.filter((x) => x !== k) : [...s.playerSigns, k] })}
                    className="flex items-center gap-2 py-0.5" style={{ background: "transparent", border: "none", cursor: "pointer", padding: 0, textAlign: "left", color: C.ink, opacity: ticked ? 1 : 0.55 }}>
                    <span style={{ width: 14, textAlign: "center", color: ticked ? C.red : C.inkDim }}>{ticked ? "☒" : "☐"}</span>
                    <span style={{ fontWeight: ticked ? 700 : 400 }}>{label}</span>
                    {witnessed && !ticked && <span title="you have sensed this in the dark" style={{ width: 5, height: 5, borderRadius: "50%", background: C.inkDim, display: "inline-block" }} />}
                  </button>
                );
              })}
            </div>
            {(() => {
              const ticked = s.playerSigns.includes("wail");
              const witnessed = s.foundSigns.includes("wail");
              return (
                <button onClick={() => setS({ ...s, playerSigns: ticked ? s.playerSigns.filter((x) => x !== "wail") : [...s.playerSigns, "wail"] })}
                  className="flex items-center gap-2 py-0.5 mt-1 w-full" style={{ background: "transparent", border: "none", borderTop: `1px solid ${C.parchLine}`, cursor: "pointer", padding: "4px 0 0", textAlign: "left", color: C.ink, opacity: ticked ? 1 : 0.55 }}>
                  <span style={{ width: 14, textAlign: "center", color: ticked ? C.red : C.inkDim }}>{ticked ? "☒" : "☐"}</span>
                  <span style={{ fontWeight: ticked ? 700 : 400 }}>{SIGNS.wail}</span>
                  {witnessed && !ticked && <span title="you have sensed this in the dark" style={{ width: 5, height: 5, borderRadius: "50%", background: C.inkDim, display: "inline-block" }} />}
                  <span className="ml-auto" style={{ fontSize: 12, color: C.inkDim, fontStyle: "italic" }}>heard on the wind, never found on the ground</span>
                </button>
              );
            })()}
            <p className="mt-2" style={{ fontSize: 13, color: C.inkDim }}>Tick what the nights have shown you. The book dims what cannot be.</p>

                  <button key={mm.id} onClick={() => setS({ ...s, struck: struckM ? s.struck.filter((x) => x !== mm.id) : [...s.struck, mm.id] })}

              return (
                <div key={mm.id} onClick={() => setS({ ...s, struck: struckM ? s.struck.filter((x) => x !== mm.id) : [...s.struck, mm.id] })}

        {tab === "help" && (
          <div style={{ fontSize: 14 }}>
            <p><strong>By day, 2 actions:</strong> investigate a fresh death where it happened, search a location, hold an interview, have someone examined for the change, or speak against a mob if one has chosen a neck.</p>
            <p className="mt-2"><strong>Interviews:</strong> one action buys three questions. Ask about the nights, press them about a particular person, ask who they suspect, or use their trade: Falk reads wounds, Marta sees who comes home at dawn, Liesel hears everything said in the tavern, Ansel keeps the ledger of deaths, and Greta knows the old lore. Sit and talk of nothing, sometimes: warmth loosens tongues. On the mornings after gatherings, ask who came, who stayed away, and who was not themselves. People remember what you have asked. Pester them and they will tell you where to go.</p>
            <p className="mt-2"><strong>The journal ticks nothing for you.</strong> When a sign turns up, tick it yourself in the Evidence page, and the bestiary dims to match. Tap a creature to strike it out; tap a villager's page to strike them from suspicion. Your reasoning, your marks, your mistakes. A site ever holds only two of a creature's three signs: the third clings to its victims, not the ground.</p>
            <p className="mt-2"><strong>Liars:</strong> the thing lies well; the changed lie for it and point at nothing. Every honest neighbour hides one human secret, badly. Catch a lie and press it: the innocent confess something ordinary. The other kind do not.</p>
            <p className="mt-2"><strong>By night:</strong> bar your door, investigate one villager, or search an area. Searching is a walk: follow who you meet, hail them, press close or turn back. A villager seen home on a killing night is cleared. Fog hides faces; frost holds prints.</p>
            <p className="mt-2"><strong>The armed confrontation:</strong> work the journal down to a single possible creature and you walk the nights carrying its remedy. Catch the thing at its business and confront it, and you can name it and end it right there in the dark, before it takes another soul. Carry the wrong name into that moment and you will not carry anything home again.</p>

            <p className="mt-2"><strong>Accusing:</strong> name a person and a creature together. Right on both, it ends. Wrong person: an innocent dies by the rite. Right face, wrong name: it flees and besieges the village. Get it wrong twice in any mix, and it stops feeding on the village and comes for you.</p>

  /* ---------- Modals ---------- */

  /* --- interview --- */
  const startInterview = (id) => {
    const s2 = JSON.parse(JSON.stringify(s));
    s2.ap -= 1; s2.questionedToday.push(id);
    const npc = npcById(s2, id);
    const opener = [demeanorLine(s2, id), pickFreshIdx(`dispLine:${dispTier(npc.disp)}`, DISP_LINES[dispTier(npc.disp)])];
    if (npc.sawYouWatching) opener.push(`Before you can speak: "I saw you. The other night, in the lane, watching my door. So am I a suspect, then? Say it to my face."`);
    if (npc.offendedExam) opener.push(`They fold their arms. "You had a glass put to my chest like I was cattle at market. I have not forgotten it."`);
    if (s2.fled) opener.push(pick(FLED_OPENERS)(npcById(s2, s2.monster.vid).name));
    setS(s2); setModal(null);
    const valid = s2.nightLogs.filter((lg) => lg.outMap[id] !== undefined).map((lg) => lg.night);
    setIv({ id, night: valid.length ? valid[valid.length - 1] : s2.nightNum, left: 3, transcript: opener.map((t) => ({ q: null, a: t })) });
  };
  const askQ = (q, targetId) => {
    const prevDisp = (npcById(s, iv.id) || {}).disp || 0;
    const { s: ns, ans } = applyAnswer(s, iv.id, iv.night, q, targetId);
    /* -- Pass H: a soft warm chime whenever this question happened to lift
       their disposition (report-backs, gossip favours, and the like). Pure
       side effect off a before/after read, no change to applyAnswer itself. -- */
    if (((npcById(ns, iv.id) || {}).disp || 0) > prevDisp) Snd.warm();
    setS(ns); setIvSub(null);
    const qLabel = q === "craft" ? PERSONA[iv.id].craftLabel : targetId ? Q_LABELS[q].replace("someone", npcById(s, targetId).name) : Q_LABELS[q];
    setIv({ ...iv, left: iv.left - 1, transcript: [...iv.transcript, { q: qLabel, night: iv.night, a: ans.quote, flag: ans.flag, sign: ans.foundSign, refused: ans.refused, repeat: ans.repeat, followUps: ans.followUps || [] }] });
  };
  /* free follow-up: does not touch iv.left, at most one per answered main question */
  const askFollowUp = (fu) => {
    const prevDisp = (npcById(s, iv.id) || {}).disp || 0;
    const { s: ns, ans } = applyAnswer(s, iv.id, iv.night, fu.q, fu.targetId);
    if (((npcById(ns, iv.id) || {}).disp || 0) > prevDisp) Snd.warm();
    setS(ns); setIvSub(null);
    setIv({ ...iv, transcript: [...iv.transcript, { q: fu.label, night: iv.night, a: ans.quote, flag: ans.flag, sign: ans.foundSign, refused: ans.refused, repeat: ans.repeat, followUps: ans.followUps || [] }] });
  };
  /* -- Pass G2: expose the coercion note to a villager, once, in any
     interview. Trades the grim bargain for a real investigative payoff, and
     leaves the whole village a little more wary of the player. -- */
  const showNote = () => {
    const s2 = JSON.parse(JSON.stringify(s));
    const npc = npcById(s2, iv.id);
    const namedTarget = npcById(s2, s2.coerceNote.target);
    s2.coerceNote = { ...s2.coerceNote, shown: true };
    s2.npcs = s2.npcs.map((x) => (x.alive && !x.fled ? { ...x, disp: clampDisp((x.disp || 0) - 1) } : x));
    const bc = addBuildClue(s2);
    s2.clues.push(bc.cands.length === 1
      ? `Day ${s2.dayNum}: showing ${npc.name} the note loosened something. Between what you already knew and what came out today, its build is certain now: ${bc.b}.`
      : `Day ${s2.dayNum}: showing ${npc.name} the note loosened something. What came out today: ${bc.pair[0]} of build, or ${bc.pair[1]}; still not certain which.`);
    s2.noteExposedPending = true;
    setS(s2); setIvSub(null);
    setIv({ ...iv, transcript: [...iv.transcript, { q: "Show them the note", night: iv.night, a: `${npc.name} reads it twice, in silence, going pale around the mouth at "${namedTarget.name}." Then looks up at you as if seeing you clearly for the first time. "Show the others," ${npc.name} says at last, quiet and not at all friendly. "Show everyone."`, followUps: [] }] });
  };
  const endInterview = () => {
    const npc = npcById(s, iv.id);
    if (!s.sideQuest && npc && npc.alive && !npc.fled && npc.disp >= 1 && chance(0.4)) {
      const targets = s.npcs.filter((x) => x.alive && !x.fled && x.id !== iv.id);
      if (targets.length) {
        const target = pick(targets);
        const s2 = JSON.parse(JSON.stringify(s));
        s2.sideQuest = { giver: iv.id, target: target.id, night: s2.nightNum, done: false, reported: false };
        const line = pickFreshIdx("sideQuestAsk", SIDE_QUEST_ASK)(target.name);
        setS(s2);
        setSheet([ev(line, npc.id)]);

  const questionModal = modal === "question" && modalWrap("Interview whom? (1 action, 3 questions)", (
    <div className="flex flex-col gap-2">
      {aliveNpcs(s).map((n) => villagerBtn(n, () => startInterview(n.id), s.questionedToday.includes(n.id), s.questionedToday.includes(n.id) ? " · already questioned today" : (s.patience[n.id] <= 0 ? " · out of patience with you" : "")))}
    </div>

  const interviewModal = iv && (() => {
    const n = npcById(s, iv.id);
    const nights = s.nightLogs.filter((lg) => lg.outMap[iv.id] !== undefined).map((lg) => lg.night).slice(-3);
    const done = iv.left <= 0;
    const craftUsed = (s.askedLog[iv.id] || []).includes(`${s.dayNum}:craft`);
    const suspectUsed = (s.askedLog[iv.id] || []).includes(`${s.dayNum}:suspect:`);
    const last = iv.transcript.length - 1;
    const pickTargets = s.npcs.filter((x) => x.id !== iv.id);
    const gossipUsed = (s.askedLog[iv.id] || []).includes(`${s.dayNum}:gossip`);
    const talkUsed = (s.askedLog[iv.id] || []).includes(`${s.dayNum}:talk`);
    const howareUsed = (s.askedLog[iv.id] || []).includes(`${s.dayNum}:howare:`);
    const pastUsed = (s.askedLog[iv.id] || []).includes("past");
    const shareCandidates = s.npcs.filter((x) => x.id !== iv.id && x.secretKnown && SECRETS[x.id]);
    const canReport = s.sideQuest && s.sideQuest.giver === iv.id && s.sideQuest.done && !s.sideQuest.reported;
    const lastFollowUps = last >= 0 ? (iv.transcript[last].followUps || []) : [];
    return (
      <div className="fixed inset-0 z-30 flex flex-col" style={{ background: "rgba(8,10,18,0.9)" }}>
        <div className="mt-auto rounded-t-xl p-4 mv-body max-h-[92vh] overflow-y-auto" style={{ background: C.panel, borderTop: `1px solid ${C.amber}`, color: C.text, WebkitOverflowScrolling: "touch", overscrollBehavior: "contain" }}>
          <div className="flex gap-3 items-start">
            <Portrait id={n.id} size={64} turnedKnown={n.turned && n.known} />
            <div>
              <div className="mv-display" style={{ fontSize: 18, color: C.parch }}>{n.name} {n.role}</div>
              <p style={{ fontSize: 12, color: C.dim }}>{NPC_LORE[n.id].body}</p>
            </div>
            <span className="ml-auto mv-display" style={{ color: C.amber, fontSize: 13 }}>{iv.left} left</span>
          </div>

          <div className="flex gap-2 mt-3 flex-wrap items-center">
            <span style={{ fontSize: 12, color: C.dim }}>Asking about:</span>
            {nights.map((nn) => (
              <button key={nn} onClick={() => setIv({ ...iv, night: nn })} className="mv-display px-2.5 py-1 rounded"
                style={{ fontSize: 12, background: iv.night === nn ? C.amber : "transparent", color: iv.night === nn ? C.ink : C.dim, border: `1px solid ${iv.night === nn ? C.amber : C.line}`, cursor: "pointer" }}>

              </button>

          </div>
          {s.nightNum <= 2 && nights.length > 0 && <p style={{ fontSize: 11, color: C.dim }} className="mt-1">Pick which night you're asking about.</p>}

            <div key={i} className="mt-3">

              <p style={{ fontSize: 15, fontStyle: t.q ? "italic" : "normal", color: t.q ? C.text : C.dim }}>
                {i === last && t.q ? <SpokenText text={t.a} /> : t.a}
              </p>
              {t.flag && <p style={{ fontSize: 13, color: C.redBright, fontWeight: 700 }}>✕ {t.flag}</p>}
              {t.sign && <p style={{ fontSize: 13, color: C.amber }}>{senseFor(t.sign, 0)}</p>}
            </div>
          ))}

          {lastFollowUps.length > 0 && (
            <div className="mt-2 ml-3 pl-3 flex flex-col gap-1.5" style={{ borderLeft: `2px solid ${C.amber}` }}>
              {lastFollowUps.map((fu, fi) => (
                <Btn key={fi} small onClick={() => askFollowUp(fu)}>{fu.label}</Btn>
              ))}

          {!done && !ivSub && (
            <div className="mt-4">
              <div className="grid grid-cols-2 gap-2">
                <Btn onClick={() => setIvSub("catN")}>The nights</Btn>
                <Btn onClick={() => setIvSub("catP")}>Press them</Btn>
                <Btn onClick={() => setIvSub("catV")}>The village</Btn>
                <Btn onClick={() => setIvSub("catH")}>The person</Btn>

              )}
              {(iv.transcript.some((t) => t.flag) || s.statements.some((st) => st.id === iv.id && st.flag)) && (
                <div className="grid grid-cols-1 gap-2 mt-2">
                  <Btn small kind="red" onClick={() => askQ("press")}>You lied to me. Why?</Btn>
                </div>

          )}
          {!done && ivSub === "catN" && (
            <div className="mt-4">

              <div className="grid grid-cols-2 gap-2 mt-1">
                <Btn small onClick={() => askQ("where")}>Where were you?</Btn>
                <Btn small onClick={() => askQ("saw")}>Who did you see?</Btn>

              <div className="grid grid-cols-1 gap-2 mt-2">
                <Btn small onClick={() => setIvSub("person")}>Ask about someone</Btn>
                <Btn small onClick={() => setIvSub(null)}>← Back</Btn>
              </div>
