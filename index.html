        if (n >= 2 && chance(0.4)) dawn.push(ev(pickFreshIdx("crueltyDawn", CRUELTY_DAWN)));
        if (n > 1 && chance(0.12)) {
          const closeSign = m.signs[2];
          if (chance(0.5) && !s.foundSigns.includes(closeSign)) {
            s.foundSigns.push(closeSign);
            dawn.push(ev(`${victim.name} was alive when they were found, just. Long enough to grip Falk's sleeve, and long enough for everyone kneeling there to notice it too. ${senseFor(closeSign)} Then they were gone.`, victim.id));
          } else {
            const d = descriptorFor(s);
            s.clues.push(`Night ${n}: ${victim.name}'s last words: what came for them was ${d.descr}. That fits ${d.names.join(", ")}.`);
            dawn.push(ev(`${victim.name} was alive when they were found, just. They said one thing, twice, before the end: what came was ${d.descr}. Among the living, that fits ${d.names.join(", ")}.`, victim.id));
          }
        }
      } else {
        beats.push("Late, very late, you hear a window ease open somewhere across the village. A long while after, it eases shut.");
        s.npcs = s.npcs.map((x) => (x.id === victim.id ? { ...x, turned: true } : x));
        s.deaths.push({ night: n, id: victim.id, name: victim.name, kind: "turned" });
        dawn.push(ev(chance(0.3) ? pickFreshIdx("noBodySharp", NO_BODY_SHARP) : pickFreshIdx("noBody", NO_BODY)));
      }
    } else {
      beats.push(pickFreshIdx("circleLines", CIRCLE_LINES));
      dawn.push(ev("The night passed without a death. Perhaps barred doors saved someone. Perhaps it simply found no one."));
    }
    if (victimKind === "kill" && n > 1 && chance(0.4)) dawn.push(ev(pickFreshIdx("carterLines", CARTER_LINES)(huntLoc)));
    const placed = s.locEvidence[huntLoc];
    const site = m.signs.slice(0, 2).filter((sg) => !placed.includes(sg));
    if (site.length) placed.push(pick(site));
    /* -- counterplay: a thing that knows it is hunted plants false marks -- */
    if ((s.wrongExecutions > 0 || s.monsterSawYou || s.enraged) && chance(0.45)) {
      const pLoc = pick(LOCS.filter((l) => !m.hunts.includes(l)));
      const decoys = Object.keys(SIGNS).filter((sg) => sg !== "wail" && !m.signs.includes(sg) && !s.locEvidence[pLoc].includes(sg));
      if (decoys.length) {
        const sg = pick(decoys);
        s.locEvidence[pLoc].push(sg);
        s.planted.push({ loc: pLoc, sg, night: n, exposed: false });
      }
    }
  } else if (!wailTonight && !s.over) {
    beats.push(pickFreshIdx("quietNight", QUIET_NIGHT));
    dawn.push(ev(pickFreshIdx("quietDawn", QUIET_DAWN)));
  }

  /* --- the weather leaves a morning behind it --- */
  if (n > 1 && wx && !s.over && chance(0.7)) dawn.push(ev(WEATHER_DAWN[wx]));

  /* --- the morning after an evening event --- */
  if (evn) {
    dawn.push(ev(pickFreshIdx("eventDawn", EVENT_DAWN)(evn.name)));
    if (evFight) dawn.push(ev(`${npcById(s, evFight[0]).name} and ${npcById(s, evFight[1]).name} are not speaking after their quarrel at the ${evn.name}. Each has friends whispering for their side.`));
    if (evPair && chance(0.6)) dawn.push(ev(`Tongues wag about ${npcById(s, evPair[0]).name} and ${npcById(s, evPair[1]).name} leaving the ${evn.name} together. At least two people can account for each other, for once.`));
    if (evSweepFind) dawn.push(ev(`The torch search turned something up among the graves, and by morning the whole village knows it. ${evSweepSense}`));
    if (mods.mingled) {
      dawn.push(ev(`You spent part of the ${evn.name} in company, half-listening, half-watching. For an hour, it almost felt like a night from before.`));
      if (s.monsterFancies && active && mods.mingledWith === s.monster.vid) s.bond = (s.bond || 0) + 1;
    }
  }

  const hiddenTurned = s.npcs.filter((x) => x.alive && x.turned && !x.known && x.id !== s.lastRumor);
  if (chance(hiddenTurned.length ? 0.4 : 0.3) && (hiddenTurned.length || chance(0.3))) {
    const rPool = hiddenTurned.length && chance(0.7) ? hiddenTurned : s.npcs.filter((x) => x.alive && !x.turned && x.id !== s.lastRumor);
    const target = rPool.length ? pick(rPool) : null;
    if (target) { s.lastRumor = target.id; dawn.push(ev(pickFreshIdx("rumorStrange", RUMOR_STRANGE)(target.name), target.id)); }
  }

  if (watchStayedHome) {
    const target = npcById(s, watchStayedHome);
    if (victim && victimKind === "kill") {
      s.clues.push(`Night ${n}: ${target.name} never left their door, and yet ${victim.name} was taken. It was not ${target.name} that night.`);
      if (!s.hardCleared.includes(watchStayedHome)) s.hardCleared.push(watchStayedHome);
      dawn.push(ev(`${target.name} never left their door all night, and yet ${victim.name} was taken. Whatever it is, it was not ${target.name} last night.`, watchStayedHome));
    } else {
      dawn.push(ev(`${target.name} never left their door. A still night proves little, but you know where they were.`, watchStayedHome));
    }
  }

  /* --- side quest: did the player watch/follow the quest target tonight? --- */
  if (s.sideQuest && !s.sideQuest.done) {
    const qt = s.sideQuest.target;
    if (watching === qt || mods.follow === qt) {
      s.sideQuest = { ...s.sideQuest, done: true, doneNight: n };
    } else if (n - s.sideQuest.night > 2) {
      s.sideQuest = null;
    }
  } else if (s.sideQuest && s.sideQuest.done && !s.sideQuest.reported && n - s.sideQuest.night > 2) {
    s.sideQuest = null;
  }

  /* --- a secret the player has been spreading may reach its owner --- */
  if (s.secretSpread) {
    for (const ownerId of Object.keys(s.secretSpread)) {
      const rec = s.secretSpread[ownerId];
      if (!rec || rec.reached) continue;
      if (n - rec.by >= 1 && chance(0.5)) {
        rec.reached = true;
        const owner = npcById(s, ownerId);
        if (owner && owner.alive && !owner.fled) {
          s.npcs = s.npcs.map((x) => (x.id === ownerId ? { ...x, secretKnown: true, disp: -2 } : x));
          s.patience[ownerId] = 0;
          dawn.push(ev(`By midday it is all anyone speaks of: ${owner.name}'s secret is secret no longer. Someone talked. ${owner.name} will want to know who.`, ownerId));
          if (ownerId === FLEE_ON_SECRET_ID && chance(0.25)) {
            s.npcs = s.npcs.map((x) => (x.id === FLEE_ON_SECRET_ID ? { ...x, fled: true } : x));
            dawn.push(ev(`By the time anyone checks, the forge is cold and the boys taken in next door. ${owner.name} has gone north, ahead of what the lord's men do to a man caught poaching deer. He does not come back.`, ownerId));
          }
        }
      }
    }
  }

  if (victim && victimKind === "kill") s.dawnScene = { loc: victimWhere === "home" ? "Cottage" : victimWhere, kind: "body" };
  else if (out) s.dawnScene = { loc: plan.loc, kind: "quiet" };
  else if (watching) s.dawnScene = { loc: "Cottage", kind: "quiet" };
  else s.dawnScene = { loc: LOCS[(n + 2) % LOCS.length], kind: "quiet" };

  s.dayEvents = []; s.ap = 2; s.questionedToday = []; s.investigatedNight = null;

  /* --- false calm: a hanging followed by quiet feels like victory --- */
  const slainTonight = s.deaths.some((d) => d.kind === "slain" && d.night === n);
  if (s.calmHope && !slainTonight && !s.over) {
    if (!s.calmSaid) {
      s.calmSaid = true;
      s.calmEchoNight = n;
      dawn.push(ev(`A clean dawn, and the square almost smiles. "It was ${s.calmHope} after all," someone dares say. "It's over." Doors unbar by noon. You know the arithmetic of its patient nights. They do not.`));
    }
  } else if (s.calmHope && slainTonight) {
    dawn.push(ev(`Whatever peace the village bought with ${s.calmHope}'s death, this morning spends it all. It was never ${s.calmHope}, and the question follows right behind the knowledge: whose word was that rope on?`));
    s.calmHope = null; s.calmSaid = false;
  }

  /* --- panic does its own damage --- */
  const slainSoFar = s.deaths.filter((d) => d.kind === "slain").length;
  if (!s.over && n >= 3 && chance(0.12 + s.wrongExecutions * 0.08 + (slainSoFar >= 3 ? 0.08 : 0))) {
    if (!s.burned.includes("Old Church") && slainSoFar >= 3 && chance(0.5)) {
      s.burned.push("Old Church");
      const ans = npcById(s, "ansel");
      dawn.push(ev(`In the small hours someone put fire to the Old Church. "If God will not clean His house, fire will." It burned to the rafters while the village watched and fetched no water.${ans && ans.alive ? " Ansel stood closest of all, and his face held no grief." : ""}`));
    } else {
      const pv = pick(s.npcs.filter((x) => x.alive && !x.fled));
      if (pv) {
        const panicLine = pickFreshIdx("panicLines", PANIC_LINES);
        const panicIdx = PANIC_LINES.indexOf(panicLine);
        dawn.push(ev(panicLine(pv.name), chance(0.5) ? pv.id : null));
        s.lastPanic = { kind: panicIdx, name: pv.name, night: n };
      }
    }
  }

  /* --- the village reckons with yesterday's rope --- */
  const ropeDeath = s.deaths.find((d) => d.id !== s.monster.vid && ((d.kind === "executed" && d.night === n - 1) || (d.kind === "mobbed" && d.night === n)));
  if (ropeDeath && !s.over) {
    dawn.push(ev(pick(EXEC_AFTERMATH)(ropeDeath.name)));
    const stained = ropeDeath.kind === "mobbed" && s.ropeStain ? npcById(s, s.ropeStain) : null;
    if (stained && stained.alive && chance(0.8)) dawn.push(ev(pick(ROPE_SUSPICION)(stained.name, ropeDeath.name), stained.id));
  }

  /* --- a mob may form at dawn --- */
  const slainCount = s.deaths.filter((d) => d.kind === "slain").length;
  if (!s.mob && !s.over && slainCount >= 2 && chance(0.22)) {
    const accCand = s.npcs.filter((x) => x.alive && !x.fled);
    /* the thing (or its changed) may be the one steering the rope */
    const schemers = accCand.filter((x) => x.id === s.monster.vid || x.turned);
    const accuser = schemers.length && chance(0.4) ? pick(schemers) : pick(accCand);
    let tgtPool = [];
    for (const x of accCand) { if (x.id === accuser.id) continue; tgtPool.push(x); if (x.id === "rosa") tgtPool.push(x); }
    if (accuser.id === s.monster.vid || accuser.turned) tgtPool = tgtPool.filter((x) => x.id !== s.monster.vid && !x.turned);
    const target = pick(tgtPool);
    if (target) {
      const mobReason = pick(MOB_REASONS)(target.name);
      s.mob = { accuser: accuser.id, target: target.id, deadline: n + 1, reason: mobReason };
      dawn.push(ev(pick(MOB_ULTIMATUM)(accuser.name, target.name, mobReason), target.id, 2));
    }
  }

  /* --- Pass G2: word of an exposed note reaches the square the morning
     after it was shown, never the same day --- */
  if (s.noteExposedPending) {
    dawn.push(ev("Word of the note reaches the square before you do: what it asked, and that you did not simply burn it. People do not meet your eye today. It did not choose you at random, and the village has begun to wonder what you did to earn that.", undefined, 2));
    s.noteExposedPending = false;
  }

  /* --- Pass G2: the coercion note. Rare, mid-game, and only ever from a
     monster that has come, in its hidden way, to want the player spared:
     a private, complicit bargain offered instead of an ultimatum. Never
     before night 3, never without at least two deaths already on the
     ledger, and only ever once per game. --- */
  if (!s.over && s.monsterFancies && s.bond >= COERCE_NOTE_BOND_MIN && n > 2 && s.deaths.length >= 2 && !s.coerceNote && chance(0.5)) {
    const noteCand = s.npcs.filter((x) => x.alive && !x.fled && !x.turned && x.id !== s.monster.vid);
    if (noteCand.length) {
      const target = pick(noteCand);
      s.coerceNote = { target: target.id, night: n, shown: false };
      dawn.push(ev(`Folded where only you would have reached, a scrap you did not put there, in a small unhurried hand: "GIVE ME ${target.name.toUpperCase()} AND THIS ENDS, FOR YOU. NO ONE ELSE NEED EVER KNOW WHY." You read it twice, alone, and are grateful you are.`, target.id, 2));
      s.clues.push(`Night ${n}: a note offering your own safety in exchange for ${target.name}. To hand it ${target.name} is to hang an innocent on a monster's word. Burn it, or show it in the square (open ${target.name}'s profile). Do not give it what it wants.`);
    }
  }

  finish();

  if (!s.over) {
    if (turnedAlive(s).length >= untainted(s).length && turnedAlive(s).length > 0) {
      s.over = { win: false, reason: "overrun", text: "You look around the square at dawn and count the faces you still trust, and understand, too late, that the changed now outnumber the living. Hollow's Edge belongs to it. Perhaps it always did." };
    } else if (untainted(s).length <= 2) {
      s.over = { win: false, reason: "lost", text: "Too few remain to bury the dead. The village is finished, and the thing that did it walks away wearing a neighbour's smile." };
    }
  }
  return s;
}

/* ================= DAY ACTIONS ================= */

function investLook(prev, catKey) {
  const s = JSON.parse(JSON.stringify(prev));
  const m = monsterOf(s);
  const act = INVEST_ACTS.find((a) => a.key === catKey);
  const dRec = s.deaths.find((d) => d.night === s.nightNum && d.kind === "slain");
  const candidates = m.signs.filter((sg) => sg !== "wail" && SIGN_CATS[catKey].includes(sg) && !s.foundSigns.includes(sg));
  let line;
  if (candidates.length && chance(0.75)) {
    const sg = pick(candidates);
    s.foundSigns.push(sg);
    if (dRec) dRec.found.push(sg);
    line = senseFor(sg);
  } else {
    line = pickFreshIdx(`investNone:${catKey}`, act.none);
  }
  if (dRec) dRec.examined = true;
  s.dayEvents.push(ev(`${act.label}: ${line}`));
  return { s, line };
}

function actLookOver(prev, targetId) {
  const s = JSON.parse(JSON.stringify(prev));
  s.ap -= 1;
  const target = npcById(s, targetId);
  const falk = npcById(s, "falk");
  const examiner = targetId === "falk" ? npcById(s, "greta") : falk;
  const exName = examiner ? examiner.name : "";
  if (!examiner || !examiner.alive || examiner.fled) {
    s.dayEvents.push(ev("There is no one left with the knowledge to make such an examination."));
    return s;
  }
  /* being examined like cattle costs trust, whatever the result */
  s.npcs = s.npcs.map((x) => (x.id === targetId ? { ...x, disp: clampDisp((x.disp || 0) - 2) } : x));
  if (examiner.turned) {
    s.dayEvents.push(ev(`${exName} examines ${target.name} at length, listens, peers, hums. "Nothing amiss," ${exName} says. "Nothing amiss at all."`, examiner.id));
    return s;
  }
  const rate = targetId === "falk" ? 0.45 : 0.65;
  if (target.turned && chance(rate)) {
    s.npcs = s.npcs.map((x) => (x.id === targetId ? { ...x, known: true } : x));
    s.clues.push(`Day ${s.dayNum}: ${exName} examined ${target.name} and went pale. ${target.name} is changed.`);
    s.dayEvents.push(ev(`${exName} presses a glass to ${target.name}'s chest, listens a long while, and slowly straightens. "This person is cold where they should be warm. God help us. They are changed."`, examiner.id));
  } else {
    if (!target.turned) {
      s.npcs = s.npcs.map((x) => (x.id === targetId ? { ...x, offendedExam: s.dayNum } : x));
      s.patience[targetId] = Math.max(0, (s.patience[targetId] || 3) - 2);
    }
    s.dayEvents.push(ev(`${exName} looks ${target.name} over carefully and finds nothing amiss. ${target.turned ? "It proves less than you would like." : `${target.name} submits to it in stony silence, and does not look at you once.`}`, examiner.id));
  }
  return s;
}

function actSearch(prev, loc) {
  const s = JSON.parse(JSON.stringify(prev));
  s.ap -= 1;
  s.searchCount[loc] = (s.searchCount[loc] || 0) + 1;
  /* a second daylight look can expose a planted mark */
  const suspect = (s.planted || []).find((p) => p.loc === loc && !p.exposed && s.foundSigns.includes(p.sg));
  if (suspect && chance(0.65)) {
    suspect.exposed = true;
    s.foundSigns = s.foundSigns.filter((sg) => sg !== suspect.sg);
    s.clues.push(`Day ${s.dayNum}: the ${SIGNS[suspect.sg]} at the ${loc} were MADE. Too regular, cut with a tool, meant to be found. Something is salting your trail. Untick it if you ticked it.`);
    s.dayEvents.push(ev(`You go back over what you found at the ${loc} in good light, and your stomach drops. Too neat. Made by a hand, to be found by yours. It knows you read the ground, and it is writing back. Untick whatever you ticked for this.`));
    return s;
  }
  const unfound = s.locEvidence[loc].filter((sg) => !s.foundSigns.includes(sg));
  /* last night's weather works for you or against you by daylight */
  const lastWx = (s.nightLogs[s.nightLogs.length - 1] || {}).weather;
  const dayFindP = lastWx === "frost" ? 0.55 : lastWx === "storm" ? 0.22 : 0.4;
  if (unfound.length && chance(dayFindP)) {
    const sg = pick(unfound);
    s.foundSigns.push(sg);
    s.dayEvents.push(ev(`Searching the ${loc} in daylight, you find it. ${senseFor(sg)} ${lastWx === "frost" ? "The frost held it for you overnight, sharp as the moment it was made." : "Fainter than it would have been by night, but real."}`));
  } else if (lastWx === "storm") {
    s.dayEvents.push(ev(`The storm did the ${loc} no favours: mud over everything, the ground churned and rinsed, every mark scoured down to guesses. If it knew the rain was coming, it chose its night well.`));
  } else {
    s.dayEvents.push(ev(pickFreshIdx("daySearchNothing", [
      `You search the ${loc} in daylight and find nothing. Traces fade fast in the sun, the way a dream does, the way a scream does, halfway to noon.`,
      `An hour combing the ${loc} for anything the night left behind. If it left anything, the day has already taken it back, the way daylight takes back everything you were sure of at three in the morning.`,
      `The ${loc} by daylight is only itself: ordinary, indifferent, and telling you nothing. It is almost obscene, how ordinary it looks, considering.`,
      `You go over the ${loc} in good clean light and find nothing but the marks of every foot that has passed through since, including your own, coming back for another look.`,
    ])));
  }
  return s;
}

function actDefend(prev) {
  const s = JSON.parse(JSON.stringify(prev));
  if (!s.mob) return s;
  s.ap -= 1; s.defendedToday = true;
  const tgt = npcById(s, s.mob.target);
  const acc = npcById(s, s.mob.accuser);
  const hard = s.hardCleared.includes(tgt.id);
  if (hard || chance(0.45)) {
    s.dayEvents.push(ev(hard
      ? `You stand in the square and give your evidence: you watched ${tgt.name}'s door yourself on a night of killing, and it never opened. ${acc.name} stares a long time, then throws the coil of rope in the mud and walks away. The mob goes with the rope.`
      : `You speak for ${tgt.name} in the square: loudly, carefully, naming what is known and what is only fear. It is enough, barely. ${acc.name} backs down, hating you a little for it.`, tgt.id));
    s.npcs = s.npcs.map((x) => (x.id === tgt.id ? { ...x, disp: clampDisp((x.disp || 0) + 2) } : x));
    s.mob = null;
  } else {
    s.patience[acc.id] = Math.max(0, (s.patience[acc.id] || 3) - 1);
    s.dayEvents.push(ev(`You speak for ${tgt.name}, and the square hears you out in silence, and the silence says no. "Then find it," ${acc.name} says. "You have until dusk tomorrow. After that, the rope decides."`, tgt.id));
  }
  return s;
}

/* Rite of Unbinding: a full day's work, one attempt per turned villager,
   with a real reward on success and a real cost on failure. Success chance
   depends on who performs it, in the same priority order the rest of the
   book's rites already use (see officiantFor). */
function actUnbind(prev, id) {
  const s = JSON.parse(JSON.stringify(prev));
  const m = monsterOf(s);
  const npc = npcById(s, id);
  s.ap = 0;
  s.npcs = s.npcs.map((x) => (x.id === id ? { ...x, unbindTried: true } : x));
  const off = officiantFor(s, id);
  const beats = [`At your word, ${off.name} draws the old circle around ${npc.name}, and you hold it closed while the rite is said.`];
  if (chance(off.p)) {
    beats.push(...unbindSuccessScene(npc.name));
    s.npcs = s.npcs.map((x) => (x.id === id ? { ...x, turned: false, cured: true, unbindDay: s.dayNum } : x));
    s.enraged = true;
    s.bond = 0;
    s.embolden = s.nightNum + 1;
    let rewarded = false;
    const unfoundSign = m.signs.find((sg) => !s.foundSigns.includes(sg));
    if (unfoundSign) {
      s.foundSigns.push(unfoundSign);
      beats.push(`"${senseFor(unfoundSign)}" ${npc.name} says, when they can speak again. "That much I remember of it. That much I will never stop remembering."`);
      rewarded = true;
    }
    if (!s.knownBuild && chance(0.5)) {
      const bc = addBuildClue(s);
      beats.push(bc.cands.length === 1
        ? `"And I saw who wore it," ${npc.name} adds, shaking. "${bc.b}, past any doubt. I was closer to it than anyone living."`
        : `"And I saw who wore it," ${npc.name} adds, shaking. "${buildPhrase(bc.pair)}."`);
      s.clues.push(`Day ${s.dayNum}: ${npc.name}, freed of the thing, described what wore them: ${bc.cands.length === 1 ? bc.b : `${bc.pair[0]} or ${bc.pair[1]}`} of build.`);
      rewarded = true;
    }
    if (!rewarded) {
      const loc = pick(m.hunts);
      s.clues.push(`Day ${s.dayNum}: ${npc.name}, freed of the thing, named a place: "It keeps its nights at the ${loc}. I have stood there with it."`);
      beats.push(`"It keeps its nights at the ${loc}," ${npc.name} says. "I have stood there with it, more times than I want to count."`);
    }
    s.dayEvents.push(...beats.map((b, i) => ev(b, i === 0 ? npc.id : undefined)));
  } else {
    s.enraged = true;
    s.bond = 0;
    if (chance(0.4)) {
      beats.push(...unbindFailDeathScene(npc.name));
      s.npcs = s.npcs.map((x) => (x.id === id ? { ...x, alive: false } : x));
      s.deaths.push({ night: s.nightNum, id, name: npc.name, kind: "slain", where: "home", examined: true, found: [] });
      beats.push("Somewhere beyond the torchlight, something feels the working fail, and is not sorry.");
    } else {
      beats.push(unbindFailSurviveLine(npc.name));
      beats.push("Somewhere beyond the torchlight, something feels the working, and does not forget it.");
    }
    s.dayEvents.push(...beats.map((b, i) => ev(b, i === 0 ? npc.id : undefined)));
  }
  return s;
}

/* ================= INTERVIEW ENGINE ================= */

function craftAnswer(s, id) {
  const m = monsterOf(s);
  const remaining = MONSTERS.filter((mm) => !s.struck.includes(mm.id));
  const mentions = [];
  let quote = "", foundSign = null, clue = null;
  const speakerDisp = (npcById(s, id) || {}).disp || 0;

  if (id === "falk") {
    const d = [...s.deaths].reverse().find((x) => x.kind === "slain");
    if (!d) quote = `"No bodies, no wounds, no opinion. A rare mercy in my line."`;
    else {
      const woundy = m.signs.includes("claw") || m.signs.includes("bite");
      if (woundy) { quote = `"I have dressed wounds from wolf, boar, and men with knives. ${d.name}'s were none of those, and all of those. Something with an animal's tools and a man's intent. Rule out anything that kills without touching."`; clue = `Falk, Day ${s.dayNum}: the wounds are a beast's work. Whatever it is, it kills with tooth or claw.`; }
      else { quote = `"That is the trouble. There was no wound on ${d.name} at all. The heart simply stopped. Nothing natural stops a heart like that, and nothing with teeth needs to."`; clue = `Falk, Day ${s.dayNum}: no wound on the body. It kills without touching. Strike out anything with teeth or claws.`; }
    }
  } else if (id === "greta") {
    const hints = [...FOLK_HINTS, COLLECTOR_HINT].filter((h) => h.m.some((mm) => remaining.find((r) => r.id === mm)));
    quote = hints.length ? pick(hints).t : `"I have told you what the old stories hold. The rest is in the ground and the mirrors and the dead, not in my jars."`;
  } else if (id === "tobias") {
    const gy = s.locEvidence["Graveyard"].filter((sg) => !s.foundSigns.includes(sg));
    if (gy.length && dispChance(0.6, speakerDisp)) { foundSign = pick(gy); quote = `"Come and see, then." He shows you, out among the stones. "${senseFor(foundSign)} Been that way three days. The ground don't lie, whatever else does."`; }
    else quote = pick([`"The ground's unhappy. Won't settle over the new graves like it should. Beyond that it's keeping its own counsel, same as me."`, `"Nothing new among the stones. Old bones lying quiet. It's the quiet above ground I'd worry at."`]);
  } else if (id === "ansel") {
    const kills = s.deaths.filter((d) => d.kind === "slain").map((d) => d.night);
    const wails = s.nightLogs.filter((l) => l.wail).map((l) => l.night);
    quote = kills.length
      ? `"The ledger, then. Deaths on ${kills.map((k) => `night ${k}`).join(", ")}.${wails.length ? ` Wailing heard on ${wails.map((w) => `night ${w}`).join(", ")}.` : ""} The old books say the ritual-bound kinds cannot break their count. Do the arithmetic I have been too afraid to do."`
      : `"The ledger holds births and burials. Pray the second column stays short."`;
  } else if (id === "wilhelm") {
    const first = pick(MONSTERS);
    const two = [first, pick(MONSTERS.filter((mm) => mm.id !== first.id))];
    quote = `"My grandfather kept the old rites behind the anvil. ${two[0].name}: ${METHODS[two[0].method]}. ${two[1].name}: ${METHODS[two[1].method]}. Name the thing rightly and we will see to the rest. Name it wrong and we are all dead men holding the wrong tool."`;
  } else if (id === "liesel") {
    const logs = s.nightLogs.filter((l) => Object.values(l.outMap).some((v) => v !== "home"));
    if (logs.length && dispChance(0.55, speakerDisp)) {
      const lg = pick(logs);
      const outs = Object.entries(lg.outMap).filter(([oid, loc]) => loc !== "home" && oid !== id && npcById(s, oid));
      if (outs.length) {
        const [oid, loc] = pick(outs);
        mentions.push({ id: oid, loc, kind: "craft", night: lg.night });
        quote = `"Tavern hears everything, love. Night ${lg.night}, ${npcById(s, oid).name} came past late, mud to the knee, from the ${loc} way. Make of it what you will. I pour, I don't judge."`;
      } else quote = `"Quiet as the grave in here lately. Poor choice of words. Buy something."`;
    } else quote = pick([`"Half of what I hear is lies and the other half is worse. Come back tomorrow, the vintage improves."`, `"Nothing worth your time tonight, love. Even the liars are staying home."`]);
  } else if (id === "marta") {
    const logs = s.nightLogs.slice(-3).filter((l) => Object.values(l.outMap).some((v) => v !== "home"));
    if (logs.length && dispChance(0.5, speakerDisp)) {
      const lg = pick(logs);
      const outs = Object.entries(lg.outMap).filter(([oid, loc]) => loc !== "home" && oid !== id && npcById(s, oid));
      if (outs.length) {
        const [oid, loc] = pick(outs);
        mentions.push({ id: oid, loc, kind: "craft", night: lg.night });
        quote = `"I light the ovens before the birds are up. Night ${lg.night}, I saw ${npcById(s, oid).name} coming home at first light, from the ${loc} direction, walking like the ground owed them money."`;
      } else quote = `"Only the milk cart and the fog. Some mornings that is blessing enough."`;
    } else quote = pick([`"I see who comes home at dawn, when there is anyone to see. Lately everyone claims to sleep like saints. Saints don't bolt their doors."`, `"Nothing this morning but frost and my own breath. Ask me again after a bad night. Bad nights have busy dawns."`]);
  } else if (id === "rosa") {
    const speaker = npcById(s, id);
    const hidden = s.npcs.filter((x) => x.alive && x.turned && !x.known && x.id !== id);
    if (speaker.turned) {
      /* a changed watcher points the outsider's eye at the innocent */
      const t = pick(s.npcs.filter((x) => x.alive && !x.turned && x.id !== id && x.id !== s.monster.vid));
      if (t) {
        mentions.push({ id: t.id, kind: "odd" });
        quote = `"Where I am from we watch the small things. ${t.name} has stopped humming while they work. People do not stop humming." She says it without blinking, and does not hum, herself, anymore.`;
      } else quote = `"I watch. I see nothing worth your time." She has stopped watching the north road, you notice. She watches you now.`;
    } else if (hidden.length && dispChance(0.45, speakerDisp)) {
      const t = pick(hidden);
      mentions.push({ id: t.id, kind: "odd" });
      quote = `"Where I am from we watch the small things. ${t.name} has stopped humming while they work. People do not stop humming. Something took the song out of them, and recently."`;
    } else quote = pick([`"You all watch the dark. I watch the living. So far the living are lying to each other at roughly the usual rate."`, `"I have sewn four shrouds and let out no wedding dresses. That is everything I know about this village, in one sentence."`]);
  }
  return { quote, foundSign, clue, mentions };
}

function computeAnswer(s, id, night, q, targetId) {
  const m = monsterOf(s);
  const npc = npcById(s, id);
  const per = PERSONA[id];
  const log = s.nightLogs.find((x) => x.night === night);
  const actual = log ? log.outMap[id] : undefined;
  const isMonster = id === s.monster.vid;
  const tn = turnNightOf(s, id);
  const lying = (isMonster && log && log.active) || (npc.turned && tn !== null && night >= tn);
  const evn = log ? log.event : null;
  const mentions = [];
  let quote = "", claim = null, foundSign = null, clue = null;

  const key = ["opinion", "suspect", "mobcalm", "mobagree", "mobplea", "howare"].includes(q) ? `${s.dayNum}:${q}:${targetId || ""}`
    : q === "craft" ? `${s.dayNum}:craft`
    : q === "past" ? "past"
    : q === "talk" ? `${s.dayNum}:talk`
    : q === "gossip" ? `${s.dayNum}:gossip`
    : q === "share" ? `${s.dayNum}:share:${targetId || ""}`
    : q === "report" ? `${s.dayNum}:report`
    : `${night}:${q}${targetId ? ":" + targetId : ""}`;
  s.askedLog[id] = s.askedLog[id] || [];
  if (s.askedLog[id].includes(key)) {
    s.patience[id] = Math.max(0, (s.patience[id] || 3) - 1);
    return { quote: pick(per.annoyed), mentions, claim, flag: null, foundSign, clue, repeat: true, followUps: [] };
  }
  s.askedLog[id].push(key);

  if ((s.patience[id] || 0) <= 0 && !isMonster && q !== "talk") {
    return { quote: pick(per.refusal), mentions, claim, flag: null, foundSign, clue, refused: true, followUps: [] };
  }

  const monsterClaim = () => {
    if (!s.monsterClaims[night]) {
      const truth = actual;
      if (!log || !log.active || truth === "home") s.monsterClaims[night] = { loc: truth || "home", admitOut: truth && truth !== "home" };
      else {
        const r = Math.random();
        if (r < 0.6) s.monsterClaims[night] = { loc: "home", admitOut: false };
        else if (r < 0.8) s.monsterClaims[night] = { loc: pick(LOCS.filter((l) => l !== truth)), admitOut: false };
        else s.monsterClaims[night] = { loc: pick(LOCS.filter((l) => l !== truth)), admitOut: true };
      }
    }
    return s.monsterClaims[night];
  };

  if (q === "where") {
    if (!log || (actual === undefined && !isMonster)) {
      return { quote: `"That night we were all barricaded in the church together. You know exactly where I was. Beside you, praying."`, mentions, claim: null, flag: null, foundSign, clue, followUps: [] };
    }
    /* if the player has firsthand knowledge of where this NPC actually was
       that night (hailed, followed, watched, or simply crossed paths with
       them at a location), there is no plausible reason left to deny the
       plain fact of the place itself -- only to be evasive about why. */
    const playerWitnessed = s.playerSaw.find((f) => f.night === night && f.id === id && f.loc && f.loc !== "home");
    let witnessedHandled = false;
    if (isMonster) {
      const mc = monsterClaim();
      claim = mc.loc;
      if (playerWitnessed) {
        claim = playerWitnessed.loc;
        s.monsterClaims[night] = { loc: playerWitnessed.loc, admitOut: true };
        quote = `"The ${playerWitnessed.loc}. You saw me yourself. Sleep and I have parted ways, that is all."`;
        witnessedHandled = true;
      } else if (mc.loc === "home" && actual === "home") quote = pick(per.whereHome)();
      else if (evn && mc.loc === evn.loc && actual === evn.loc) quote = `"At the ${evn.name}, with half the village. Ask anyone there."`;
      else if (mc.loc === "home") quote = `"Home, with the door barred, like any sane soul."`;
      else if (mc.admitOut) quote = `"I was out, yes. At the ${mc.loc}, walking. Sleep does not come anymore, and I have stopped pretending otherwise."`;
      else quote = `"The ${mc.loc}, briefly. Saw nothing, heard nothing."`;
    } else if (lying) {
      if (playerWitnessed) {
        claim = playerWitnessed.loc;
        quote = `"The ${playerWitnessed.loc}. You saw me there yourself." The words come out flat, a fact recited rather than felt.`;
        witnessedHandled = true;
      } else {
        claim = "home";
        quote = `"Home. Asleep. Why do you ask me this?"`;
      }
    } else if (log && log.secretOut && log.secretOut[id] && !npc.secretKnown) {
      /* an innocent hiding a human secret lies too: badly, unless the lie is already dead on arrival */
      if (playerWitnessed) {
        claim = playerWitnessed.loc;
        quote = `"You know where. The ${playerWitnessed.loc}. What I was doing there is mine."`;
        witnessedHandled = true;
      } else {
        claim = "home";
        quote = pick([
          `"Home. Abed early." They do not meet your eye when they say it.`,
          `"Home, of course. Where else?" The answer arrives half a beat too fast, rehearsed on the way over.`,
          `"At home. Alone. Doors barred." Three answers to one question, each smaller than the last.`,
          `"Home." A pause. "Why? Did someone say otherwise?" Which is not what innocence sounds like, and not quite what guilt sounds like either.`,
        ]);
      }
    } else if (log && log.secretOut && log.secretOut[id] && npc.secretKnown) {
      claim = actual;
      quote = `"You know where. The ${actual}. My business there is my own, and you of all people know what it is. Ask what you actually want to ask."`;
    } else if (evn && actual === evn.loc) {
      claim = actual;
      quote = `"At the ${evn.name}, with half the village around me, thank God. Ask anyone who was there."`;
    } else if (actual === "home") {
      claim = "home";
      quote = pick(per.whereHome)();
      if (evn && chance(0.4)) quote += ` "I had no heart for the ${evn.name}. Not with things as they are."`;
      else if (log && log.active && log.huntLoc && dispChance(0.35, npc.disp)) quote += ` "Though I heard something, late, out toward the ${log.huntLoc}. I did not open the shutters to look."`;
    } else {
      claim = actual;
      quote = pick(per.whereOut)(actual);
    }
    /* -- the night walk is remembered, both ways -- */
    if (!witnessedHandled) {
      const metMe = (npc.sawYouOut || []).find((e2) => e2.night === night && e2.met);
      if (metMe && claim && claim !== "home") {
        quote += ` "But you know that. You hailed me in the lane yourself, remember. Two fools abroad on the same bad night."`;
      } else if (claim && claim !== "home" && s.playerSaw.some((f) => f.night === night && f.id === id && f.loc === claim)) {
        quote += ` "But then, you know that already. You were there yourself. I saw your lantern."`;
      } else if ((isMonster || npc.turned) && claim === "home" && (npc.sawYouOut || []).some((e2) => e2.night === night) && chance(0.5)) {
        quote += ` A pause, one beat too long. "Strange question, though \u2014 from you. I could swear I saw YOU abroad that night. What is it you do out there, in the dark, while honest folk sleep?"`;
      }
    }
  }

  if (q === "saw") {
    if (lying || (isMonster && log && log.active)) {
      quote = chance(0.7) ? `"No one. It was a night for seeing no one."` : (() => {
        const t = pick(s.npcs.filter((x) => x.alive && x.id !== id && x.id !== s.monster.vid));
        if (!t) return `"No one at all."`;
        mentions.push({ id: t.id, loc: "home", kind: "vouch" });
        return `"Only ${t.name}, through their window, safe at home where good folk belong."`;
      })();
    } else if (actual === "home" || !actual) {
      quote = `"From behind a barred door? Nothing but my own reflection in the window glass."`;
    } else if (evn && actual === evn.loc && log) {
      const there = s.npcs.filter((x) => x.alive && x.id !== id && log.outMap[x.id] === evn.loc);
      const absent = s.npcs.filter((x) => x.alive && x.id !== id && log.outMap[x.id] !== evn.loc);
      const co = there.slice(0, 2);
      co.forEach((x) => mentions.push({ id: x.id, loc: evn.loc, kind: "with", night }));
      let line = co.length ? `"Half the village was at the ${evn.name}. ${co.map((x) => x.name).join(" and ")} beside me most of the evening."` : `"A thin crowd at the ${evn.name}, and I knew every face in it."`;
      if (absent.length && dispChance(0.65, npc.disp)) {
        const ab = pick(absent);
        mentions.push({ id: ab.id, kind: "absent", night });
        line += ` "${ab.name} never came, though. Folk noticed."`;
      }
      const odd = evn.odd && evn.odd.filter((oid) => oid !== id).map((oid) => npcById(s, oid)).filter((x) => x && x.alive);
      if (odd && odd.length && dispChance(0.35, npc.disp)) {
        const o = pick(odd);
        mentions.push({ id: o.id, kind: "odd" });
        line += ` "And ${o.name} stood apart all evening and touched nothing. Not a drop, not a bite."`;
      }
      quote = line;
    } else {
      const seen = s.npcs.filter((x) => x.alive && x.id !== id && log.outMap[x.id] === actual);
      seen.forEach((x) => mentions.push({ id: x.id, loc: actual, kind: "with", night }));
      quote = seen.length
        ? `"${seen.map((x) => x.name).join(" and ")} ${seen.length > 1 ? "were" : "was"} at the ${actual} with me. Ask them if you doubt me."`
        : `"I was alone at the ${actual}. Foolish, I know."`;
      const elsewhere = s.npcs.filter((x) => x.alive && x.id !== id && log.outMap[x.id] && log.outMap[x.id] !== "home" && log.outMap[x.id] !== actual);
      if (elsewhere.length && dispChance(0.45, npc.disp)) {
        const w = pick(elsewhere);
        mentions.push({ id: w.id, loc: log.outMap[w.id], kind: "passed", night });
        quote += ` "And I passed ${w.name} on the road, making for the ${log.outMap[w.id]}."`;
      }
    }
  }

  if (q === "about" && targetId) {
    const t = npcById(s, targetId);
    const tLoc = log ? log.outMap[targetId] : undefined;
    if (!t.alive && !tLoc) {
      quote = `"${t.name}? ${t.name} was already in the ground by then. Have some respect."`;
    } else if (lying || (isMonster && log && log.active)) {
      if (targetId === s.monster.vid && lying && !isMonster) {
        mentions.push({ id: targetId, loc: "home", kind: "vouch" });
        quote = `"${t.name} was home, I am certain of it. I looked in on them myself. Leave them be."`;
      } else if (chance(0.25)) {
        const fakeLoc = pick(LOCS);
        mentions.push({ id: targetId, loc: fakeLoc, kind: "placed", night });
        quote = `"Now that you mention it, I believe I saw ${t.name} near the ${fakeLoc} that night. Make of it what you will."`;
      } else {
        quote = `"I saw nothing of ${t.name}. Nothing at all."`;
      }
    } else if (evn && actual === evn.loc && tLoc === evn.loc) {
      mentions.push({ id: targetId, loc: evn.loc, kind: "with", night });
      quote = `"${t.name} was at the ${evn.name}, same as me. ${chance(0.5) ? "We spoke, even." : "In plain sight the whole evening, more or less."}"`;
    } else if (evn && actual === evn.loc && tLoc !== evn.loc) {
      mentions.push({ id: targetId, kind: "absent", night });
      quote = `"${t.name}? Not at the ${evn.name}, and everyone marked it. Ask ${t.name} where the evening went."`;
    } else if (actual && actual !== "home" && tLoc === actual) {
      mentions.push({ id: targetId, loc: actual, kind: "with", night });
      quote = `"Yes. ${t.name} was at the ${actual}, same as me. We spoke, even."`;
    } else if (actual && actual !== "home" && tLoc && tLoc !== "home" && dispChance(0.35, npc.disp)) {
      mentions.push({ id: targetId, loc: tLoc, kind: "passed", night });
      quote = `"I passed ${t.name} on the road that night, heading for the ${tLoc}."`;
    } else {
      quote = `"No. Wherever ${t.name} was that night, it was not where I was."`;
    }
  }

  if (q === "opinion" && targetId) {
    const t = npcById(s, targetId);
    const g = s.grudges[id];
    if (g && g.other === targetId && s.dayNum <= g.until && !isMonster) {
      mentions.push({ id: targetId, kind: "suspects" });
      quote = pick([
        `"${t.name}? We had words, and I meant every one of mine. I'd tie the knot in the rope myself."`,
        `"Ask me tomorrow, when my knuckles stop aching. Today my opinion of ${t.name} is not fit for church ears."`,
      ]);
    } else if (isMonster) {
      if (targetId !== s.monster.vid && chance(0.6)) {
        mentions.push({ id: targetId, kind: "suspects" });
        quote = pick(SUSPECT_REASONS)(t.name);
      } else quote = `"${t.name}? Solid as church stone. You are wasting your daylight."`;
    } else if (lying) {
      if (targetId === s.monster.vid) {
        mentions.push({ id: targetId, kind: "cleared" });
        quote = `"It is certainly not ${t.name}. Put it out of your mind entirely."`;
      } else {
        mentions.push({ id: targetId, kind: "suspects" });
        quote = pick(SUSPECT_REASONS)(t.name);
      }
    } else {
      let vouched = false;
      for (const lg of [...s.nightLogs].reverse()) {
        if (!lg.active) continue;
        const d = s.deaths.find((x) => x.night === lg.night && x.kind === "slain");
        if (!d) continue;
        const myLoc = lg.outMap[id];
        if (!myLoc || myLoc === "home" || myLoc === lg.huntLoc) continue;
        if (lg.outMap[targetId] === myLoc) {
          mentions.push({ id: targetId, kind: "cleared", loc: myLoc, night: lg.night });
          quote = `"One thing I do know. It is not ${t.name}. ${t.name} was beside me at the ${myLoc} the very night ${d.name} was taken."`;
          vouched = true;
        }
        break;
      }
      if (!vouched) {
        quote = chance(0.4) ? pick(SUSPECT_REASONS)(t.name) : pick([
          `"I've known ${t.name} for years. But then, I would have said that of anyone, a month ago."`,
          `"${t.name}? I could not say. I trust nobody past their own doorstep now."`,
          `"They keep to themselves. That used to be a virtue."`,
          `"A good neighbour, as far as daylight goes. It is nobody's daylight I doubt."`,
        ]);
        if (quote.includes("dog") || quote.includes("candle") || quote.includes("bone") || quote.includes("nowhere") || quote.includes("wept") || quote.includes("bread") || quote.includes("bell")) mentions.push({ id: targetId, kind: "suspects" });
      }
    }
  }

  if (q === "suspect") {
    if (s.fled && !isMonster) {
      const mn = npcById(s, s.monster.vid);
      quote = `"We all saw whose face it wore. ${mn.name}'s, God keep us, all those years. What it IS, is the question now, and that answer is in the signs and the dead, not in me."`;
    } else if (isMonster) {
      const t = pick(s.npcs.filter((x) => x.alive && x.id !== id));
      mentions.push({ id: t.id, kind: "suspects" });
      quote = `"You want a name. Fine. ${pick(SUSPECT_REASONS)(t.name).slice(1)}`;
    } else if (lying) {
      const t = pick(s.npcs.filter((x) => x.alive && x.id !== id && x.id !== s.monster.vid));
      if (t) { mentions.push({ id: t.id, kind: "suspects" }); quote = `"${t.name}. I feel it when they pass. Do not ask me to explain a feeling."`; }
      else quote = `"I no longer trust myself to say."`;
    } else {
      let evidenced = null;
      for (const lg of [...s.nightLogs].reverse()) {
        if (!lg.active || !lg.huntLoc) continue;
        const d = s.deaths.find((x) => x.night === lg.night && x.kind === "slain");
        if (!d) continue;
        const myLoc = lg.outMap[id];
        if (myLoc && myLoc !== "home" && myLoc === lg.outMap[s.monster.vid] && chance(0.4)) { evidenced = { night: lg.night, loc: myLoc, dead: d.name }; break; }
      }
      if (evidenced) {
        const mn = npcById(s, s.monster.vid);
        mentions.push({ id: mn.id, kind: "suspects", evidenced: true });
        quote = `They lower their voice to almost nothing. "${mn.name}. I saw ${mn.name} at the ${evidenced.loc} the night ${evidenced.dead} died, and I have told no one, and I have not slept since. God forgive me if I am wrong."`;
      } else if (id === "ansel" && chance(0.5)) {
        quote = `"No. I will not put a rope around a neighbour's neck on a feeling. Bring me proof and I will swing it myself."`;
      } else if (s.mob && chance(0.5)) {
        const t = npcById(s, s.mob.target);
        if (t && t.alive && t.id !== id) {
          mentions.push({ id: t.id, kind: "suspects" });
          quote = `"The square has already chosen ${t.name}, hasn't it. I don't know if the square is right. I know I want it to be, so it can be over. God forgive us all."`;
        } else {
          const t2 = pick(s.npcs.filter((x) => x.alive && x.id !== id));
          mentions.push({ id: t2.id, kind: "suspects" });
          quote = pick(SUSPECT_REASONS)(t2.name) + ` "But it is a feeling, mind. Feelings have hanged better people than us."`;
        }
      } else if (s.ropeStain && s.ropeStain !== id && npcById(s, s.ropeStain) && npcById(s, s.ropeStain).alive && chance(0.4)) {
        const rs = npcById(s, s.ropeStain);
        mentions.push({ id: rs.id, kind: "suspects" });
        quote = `"You want a name? ${rs.name}." They hold your eye and do not blink. "An innocent went to the beam on ${rs.name}'s counting, and ${rs.name} has slept sound every night since. What sleeps sound after that?"`;
      } else {
        const t = pick(s.npcs.filter((x) => x.alive && x.id !== id));
        mentions.push({ id: t.id, kind: "suspects" });
        quote = pick(SUSPECT_REASONS)(t.name) + ` "But it is a feeling, mind. Feelings have hanged better people than us."`;
      }
    }
  }

  if (q === "strange") {
    const SIGN_TALK = { bite: "the marks on the miller's gatepost look like teeth, if you stare", claw: "something has been sharpening itself on the churchyard yew", tracks: "there are prints by the well that belong to no farm animal", reflect: "the mirrors in this village have all gone dull, have you noticed", cold: "no fire seems to warm a room past midnight anymore", flora: "the herb beds are dying from the north end inward", sulfur: "there is a smell around lately, like struck matches", hex: "someone has been scratching signs on the lych-gate", graves: "the ground in the churchyard will not stay settled", skin: "something was found behind the tavern like a snake's leavings, but far larger" };
    if (npc.turned && night >= (tn || 0)) {
      /* the changed serve it now: they name signs the thing does NOT carry */
      const falseSigns = Object.keys(SIGN_TALK).filter((sg) => !m.signs.includes(sg));
      if (chance(0.6)) {
        const fs = pick(falseSigns);
        quote = `"Strange?" They laugh, and it is not quite their laugh. "Only that ${SIGN_TALK[fs]}. Worth a look, I'd have thought. Worth a tick in that journal of yours."`;
      } else {
        quote = `"Everything is strange now. Pick a thing."`;
      }
    } else if (isMonster) {
      if (s.monsterSawYou && chance(0.5)) quote = `"Strange? You look tired, is what I notice. All that standing about in cold lanes at night. A person could catch their death."`;
      else quote = pick([`"Only the fear. The fear is the strangest thing of all, don't you find?"`, `"Nothing you have not already heard."`, `"The village has never been so devout, or so well locked. Take your pick of miracles."`]);
    } else {
      quote = chance(0.4) && log && log.active && log.huntLoc
        ? `"I will say this. The dogs would not settle that night, and they were all of them facing the ${log.huntLoc}."`
        : pick([`"Nothing I could put a name to. A feeling, at dusk. Everyone has it now."`, `"Ask the priest. He has stopped sleeping, and priests know why they stop sleeping."`, `"The birds have gone from the churchyard. Make of that what you like."`, `"My candle burns blue some nights. My grandmother had a word for that. I've been afraid to remember it."`]);
    }
  }

  if (q === "press") {
    const sec = SECRETS[id];
    const secretNight = log && log.secretOut && log.secretOut[id] ? night
      : (() => { const lg = [...s.nightLogs].reverse().find((x) => x.secretOut && x.secretOut[id]); return lg ? lg.night : null; })();
    if (isMonster) {
      quote = pick([
        `"Lied?" The word sits comfortably in their mouth. "Memory frays, in times like these. Yours as much as mine, I'd imagine. You look like you haven't slept."`,
        `They hold your gaze a fraction too long. "If my nights don't add up, look to whoever did the counting. I've nothing to hide, and nothing more to say."`,
        `"You press everyone this way? No wonder the village sleeps badly." The smile arrives, eventually. Nothing else about the face moves.`,
      ]);
    } else if (npc.turned) {
      quote = pick([
        `A long pause, as if the answer had to travel a distance to reach them. "I was mistaken. I am often mistaken now." They touch their own wrist, once.`,
        `"Did I lie?" they say, mildly, as though asking about the weather. "Then I lied. It hardly seems to matter anymore, does it."`,
      ]);
    } else if (sec && secretNight !== null && !npc.secretKnown) {
      s.npcs = s.npcs.map((x) => (x.id === id ? { ...x, secretKnown: true } : x));
      s.clues.push(`Day ${s.dayNum}: pressed on the lie, ${npc.name} confessed the truth of their nights: ${sec.short}. Human, and nothing worse. Their false alibis are explained.`);
      quote = sec.confess;
    } else if (sec && npc.secretKnown) {
      quote = `"You know why I lied. You've known since you dragged it out of me. Do not make me say it twice in one lifetime."`;
    } else {
      quote = pick([
        `"Then I misspoke. God's teeth, we are all of us half-mad with fear. I barely know what I said an hour ago, let alone a night ago."`,
        `They flush, angry and ashamed at once. "Fine. I was out, briefly, and I said home because HOME IS THE ONLY SAFE ANSWER NOW. You've seen what happens to people who were out."`,
      ]);
    }
  }

  if (q === "mobwhy" && s.mob) {
    const mt = npcById(s, s.mob.target);
    const reason = s.mob.reason || `${mt ? mt.name : "they"} was seen. That is all I will say. Seen.`;
    if (isMonster) {
      quote = `"Because the village needs a name more than it needs the right one." A beat, while you both hear what was just said. "I misspoke. Because it IS the right one: ${reason}" The certainty never once reaches the eyes.`;
    } else if (npc.turned) {
      quote = `"${reason}" They recite it in the flat cadence of something learned by rote, and having finished, they simply stop, like a music box run down.`;
    } else {
      quote = `They grip your sleeve, and their hand is shaking. "${reason} I know how it sounds. God help me, I know. But I have people behind my door, and the rope is the only thing I have left to offer them."`;
    }
  }

  if (q === "mobview" && s.mob) {
    const acc2 = npcById(s, s.mob.accuser);
    const mt2 = npcById(s, s.mob.target);
    if (id === s.mob.accuser || !acc2 || !mt2) {
      quote = `"I stand by it." Nothing else.`;
    } else if (isMonster) {
      quote = chance(0.5)
        ? `"${acc2.name} may well be right." Said mildly, the way you would remark on weather. "The rope has a way of ending questions, either way."`
        : `"A village needs its certainty. I would not stand between ${acc2.name} and the beam. Would you?" The question hangs there, with interest behind it.`;
    } else if (npc.turned) {
      quote = `"Let it happen," they say, without heat, without anything at all in it. "One fewer is one fewer." You are not sure they mean fewer suspects.`;
    } else if (chance(0.45)) {
      mentions.push({ id: acc2.id, kind: "suspects" });
      quote = `They lower their voice. "${acc2.name} was quickest to the rope. Quickest by a street. My grandmother had a saying: grief reaches for God, and something else reaches for rope. I am not saying it. I am saying my grandmother said it."`;
    } else {
      quote = pick([
        `"${mt2.name}?" They shake their head, and keep shaking it. "I have shared a table with ${mt2.name} a hundred times. But then, whoever it is, someone has shared a table with them a hundred times. That is the whole horror of it."`,
        `"If the rope is wrong, the thing wins twice: the grave and the guilt. If it is right, we sleep. Half the village is hoping without asking which half of that bargain we get."`,
        `"I keep away from the square now. Whatever ${mt2.name} is or is not, a crowd holding rope is not my neighbour either."`,
      ]);
    }
  }

  if (q === "craft") {
    if (lying && !isMonster && chance(0.5)) {
      quote = `"Not today. My head aches. Everything aches, since." They do not say since what.`;
    } else {
      const c = craftAnswer(s, id);
      quote = c.quote; foundSign = c.foundSign || foundSign; clue = c.clue;
      c.mentions.forEach((mm) => mentions.push(mm));
    }
  }

  if (q === "talk") {
    s.npcs = s.npcs.map((x) => (x.id === id ? { ...x, disp: clampDisp((x.disp || 0) + 1) } : x));
    s.patience[id] = Math.min(PERSONA[id].patience + 1, (s.patience[id] || 0) + 1);
    if (isMonster) {
      quote = pick(TALK_MONSTER);
    } else if (npc.turned) {
      quote = pick(TALK_TURNED);
    } else {
      quote = pick(TALK_LINES[id] || [`They talk, and you listen, and for an hour the village is only a village again.`]);
      const lastActive = [...s.nightLogs].reverse().find((lg) => lg.active && lg.huntLoc);
      if (lastActive && dispChance(0.3, (npc.disp || 0) + 1)) {
        quote += ` Then, at the door, quieter: "Keep away from the ${lastActive.huntLoc} after dark. Don't ask me how I know. Just keep away."`;
        clue = `Day ${s.dayNum}: ${npc.name}, warmed by an hour's company, let one thing slip at the door: keep away from the ${lastActive.huntLoc} after dark.`;
      }
    }
  }

  if (q === "howare") {
    if (isMonster) {
      quote = pick([
        `"Holding up?" A small smile. "Better than most, I think. I sleep well." Which is such an ordinary thing to say that it is only on the walk home you notice how few in Hollow's Edge could say it and mean it.`,
        `"One day at a time, like everyone." The words are right, and the warmth almost reaches the eyes. "You look tired, though. You should rest. The village leans on you too hard." It is kindly meant. You spend a while, later, deciding whether you believe that.`,
      ]);
    } else if (npc.turned) {
      quote = pick([
        `"I am well," they say, and stop, as if the sentence has run out of the things it was given to say. "I am well," they say again, softer, checking the fit of it.`,
        `A long pause. "It is quieter now," they say at last. "Inside." They seem to believe that answers the question. Perhaps, somewhere, it does.`,
      ]);
    } else {
      quote = pick(HOWARE_LINES[id] || [`"Holding. Barely. Same as everyone."`]);
      if (chance(0.5)) s.npcs = s.npcs.map((x) => (x.id === id ? { ...x, disp: clampDisp((x.disp || 0) + 1) } : x));
    }
  }

  if (q === "past") {
    if (isMonster) {
      quote = `They tell it well. Dates, names, the dead and the living, the bad winters, all of it in the right order, all of it word-perfect. It is only on the walk home that you place what was missing: not one detail you hadn't already heard from somebody else. A life, recited. Not one thing remembered.`;
    } else if (npc.turned) {
      quote = `They begin the story warmly enough, and lose their way somewhere in the middle of it, and finish with "it was a long time ago" - about their own wedding day, or their own children, or their own name. Then they look at you, politely, to see if that was sufficient.`;
    } else {
      quote = pick(PAST_LINES[id] || [`They talk about before, haltingly, and before was ordinary, and the ordinariness of it is the saddest sound in Hollow's Edge tonight.`]);
    }
  }

  if (q === "mobcalm" && s.mob && id === s.mob.accuser) {
    const mt = npcById(s, s.mob.target);
    if (isMonster) {
      quote = `"No." Pleasant, and final. "The village wants a name, and I have given it one. Would you rather it went on looking?" The reasoning is sound. That is the part that stays with you afterward: how sound it is, and how little saying it seems to cost them.`;
    } else if (npc.turned) {
      quote = `"The rope is decided," they say, in the flat cadence of a lesson being repeated. "Let it be ${mt ? mt.name : "anyone"}. Let it be anyone at all." The second sentence is the honest one.`;
    } else if (chance(Math.min(0.85, 0.35 + 0.2 * Math.max(0, npc.disp || 0)))) {
      s.mob = null;
      if (mt) s.npcs = s.npcs.map((x) => (x.id === mt.id ? { ...x, disp: clampDisp((x.disp || 0) + 1) } : x));
      quote = `They listen. To you, they actually listen; you watch the rage bank down like a fire being damped for the night. "If it were anyone else asking…" The coil of rope goes into the corner. "One more dawn, then. Find it. Because if I'm wrong about ${mt ? mt.name : "them"}, I want it to be your doing I stopped, and not my own weakness."`;
    } else {
      s.patience[id] = Math.max(0, (s.patience[id] || 3) - 1);
      quote = `"Don't." The voice cracks clean in half on the word. "Don't stand there and lawyer at me while the ground is still fresh. The rope holds until tomorrow dusk. Bring me something better than doubt by then, or stand out of my way."`;
    }
  }

  if (q === "mobagree" && s.mob && id === s.mob.accuser) {
    s.npcs = s.npcs.map((x) => (x.id === id ? { ...x, disp: clampDisp((x.disp || 0) + 1) } : x));
    quote = isMonster
      ? `"Good." A slow nod, and something settles in them that you cannot quite name. "Then we understand each other, you and I. I thought we might." There is nothing in it you could repeat to anyone. Only that you leave feeling you agreed to more than you actually said.`
      : `Something in their shoulders lets go all at once. "Thank you. God help me - you don't know what it is, being the only one willing to say it out loud." They grip your hand too hard and too long. If the rope is wrong, you have just bought yourself a share of it, and you both know that too.`;
  }

  if (q === "mobplea" && s.mob && id === s.mob.target) {
    if (isMonster) {
      quote = `"Let them bring their rope." It is said gently, while they study their own hands. "I have been doubted before, and outlived the doubting. Tomorrow will sort itself out." A pause, almost peaceable. "These things generally do."`;
    } else if (npc.turned) {
      quote = `"If they hang me, I stop," they say, with a mildness that takes the floor out from under the room. "That might be best for everyone. I don't say that the way it sounds." A pause. "Or perhaps I do."`;
    } else {
      const lgp = [...s.nightLogs].reverse().find((l) => l.outMap[id] !== undefined);
      const truth = lgp ? lgp.outMap[id] : "home";
      quote = `They grip the table until the knuckles go white. "I did not do this. You know me. You KNOW me." A breath, fought for. "Last night I was ${truth === "home" ? "behind my own bolted door, and no one alive can swear to it, and that is the whole of my crime" : `at the ${truth}, and God as my witness that is the whole of it`}. Watch my door yourself tonight if you doubt me. Watch it all night. Please."`;
    }
  }

  if (q === "gossip") {
    const turnedNow = npc.turned && tn !== null;
    const misdirect = (isMonster || turnedNow) && chance(0.6);
    if (misdirect) {
      const t = pick(s.npcs.filter((x) => x.alive && x.id !== id && x.id !== s.monster.vid));
      if (t) {
        mentions.push({ id: t.id, kind: "gossip" });
        quote = `"Only that folk are whispering about ${t.name}. ${pick(SUSPECT_REASONS)(t.name).slice(1)}`;
      } else quote = `"Nothing worth repeating. This village gossips about everything and knows nothing true."`;
    } else {
      const grudgeEntries = Object.entries(s.grudges).filter(([gid, g]) => g && s.dayNum <= g.until && gid !== id && g.other !== id && npcById(s, gid) && npcById(s, gid).alive && npcById(s, g.other) && npcById(s, g.other).alive);
      const lastLog = s.nightLogs.length ? s.nightLogs[s.nightLogs.length - 1] : null;
      const hidden = s.npcs.filter((x) => x.alive && x.turned && !x.known && x.id !== id);
      if (grudgeEntries.length) {
        const [gid, g] = pick(grudgeEntries);
        const a = npcById(s, gid), b = npcById(s, g.other);
        mentions.push({ id: a.id, kind: "gossip" }, { id: b.id, kind: "gossip" });
        quote = pickFreshIdx("gossipGrudge", GOSSIP_GRUDGE)(a.name, b.name);
      } else if (lastLog && lastLog.event && (lastLog.event.fight || lastLog.event.pair)) {
        const pair2 = lastLog.event.fight || lastLog.event.pair;
        const a = npcById(s, pair2[0]), b = npcById(s, pair2[1]);
        if (a && b) {
          mentions.push({ id: a.id, kind: "gossip" }, { id: b.id, kind: "gossip" });
          quote = lastLog.event.fight ? pickFreshIdx("gossipFight", GOSSIP_EVENT_FIGHT)(a.name, b.name) : pickFreshIdx("gossipPair", GOSSIP_EVENT_PAIR)(a.name, b.name);
        }
      }
      if (!quote && !isMonster && !turnedNow && hidden.length && npc.disp >= 1 && chance(0.3)) {
        const t = pick(hidden);
        mentions.push({ id: t.id, kind: "odd" });
        quote = pickFreshIdx("gossipTrueHint", GOSSIP_TRUE_HINT)(t.name);
      }
      if (!quote) {
        const t = pick(s.npcs.filter((x) => x.alive && x.id !== id));
        if (t) {
          mentions.push({ id: t.id, kind: "gossip" });
          quote = pickFreshIdx("gossipRumor", RUMOR_STRANGE)(t.name);
        } else quote = `"Nothing worth repeating today."`;
      }
    }
    if (id === GOSSIP_LOVER_ID) s.npcs = s.npcs.map((x) => (x.id === id ? { ...x, disp: clampDisp((x.disp || 0) + 1) } : x));
  }

  if (q === "share" && targetId) {
    const owner = npcById(s, targetId);
    const sec = SECRETS[targetId];
    if (owner && sec) {
      s.secretSpread = s.secretSpread || {};
      const rec = s.secretSpread[targetId] || { by: s.dayNum, told: [] };
      const alreadyTold = rec.told.includes(id);
      if (!alreadyTold) rec.told.push(id);
      s.secretSpread[targetId] = rec;
      if (alreadyTold) {
        quote = `"You've told me that already." They do not seem to need reminding.`;
      } else if (id === GOSSIP_LOVER_ID) {
        s.npcs = s.npcs.map((x) => (x.id === id ? { ...x, disp: clampDisp((x.disp || 0) + 1) } : x));
        quote = `Their eyes light up. "${owner.name}? Well now. Tell me everything, and don't leave a single word out." They will not be the one to keep this quiet, and you both know it.`;
      } else if (id === DISCREET_ID) {
        s.npcs = s.npcs.map((x) => (x.id === id ? { ...x, disp: clampDisp((x.disp || 0) - 1) } : x));
        quote = `Their face closes like a door. "I did not ask, and I did not want to know. What ${owner.name} keeps behind their own door is their own business, not mine, and certainly not yours to hand about."`;
      } else {
        quote = `They take it in without much reaction. "${owner.name}, is it. I'll keep that in mind." Whether they keep it quiet is another matter entirely.`;
      }
    } else quote = `"I don't follow. Whose secret?"`;
  }

  if (q === "report") {
    if (s.sideQuest && s.sideQuest.giver === id && s.sideQuest.done && !s.sideQuest.reported) {
      const target = npcById(s, s.sideQuest.target);
      const wn = s.sideQuest.doneNight || s.sideQuest.night + 1;
      const lg = s.nightLogs.find((l) => l.night === wn);
      const loc = lg ? lg.outMap[s.sideQuest.target] : undefined;
      const turnedThatNight = target && target.turned && target.known && turnNightOf(s, target.id) === wn;
      let useful = false, summary;
      if (target && turnedThatNight) {
        summary = `${target.name} is changed. I watched it happen with my own eyes, and I will not forget it.`;
        useful = true;
      } else if (!loc || loc === "home") {
        summary = `${target ? target.name : "They"} never left the house. Whatever you feared, it was a quiet night.`;
      } else {
        summary = `${target.name} was out at the ${loc}, plain as anything, the whole night.`;
        useful = true;
      }
      quote = `"${summary}"`;
      s.sideQuest = { ...s.sideQuest, reported: true };
      s.npcs = s.npcs.map((x) => (x.id === id ? { ...x, disp: clampDisp((x.disp || 0) + (useful ? 2 : 1)) } : x));
      const recip = craftAnswer(s, id);
      if (recip.quote) quote += ` They study you a long moment, then offer something back for the favour: ${recip.quote}`;
      if (recip.foundSign) foundSign = recip.foundSign || foundSign;
      if (recip.clue) clue = recip.clue;
      recip.mentions.forEach((mm) => mentions.push(mm));
    } else {
      quote = `"There's nothing to tell you yet."`;
    }
  }

  if (q === "sawAt") {
    const claimLoc = targetId;
    if (!claimLoc || claimLoc === "home" || !log) {
      quote = `"No one. I kept to myself, like I said."`;
    } else {
      const seenThere = s.npcs.filter((x) => x.alive && x.id !== id && log.outMap[x.id] === claimLoc);
      seenThere.forEach((x) => mentions.push({ id: x.id, loc: claimLoc, kind: "with", night }));
      quote = seenThere.length
        ? `"${seenThere.map((x) => x.name).join(" and ")} ${seenThere.length > 1 ? "were" : "was"} there too, near the ${claimLoc}. Ask them, if you don't believe me."`
        : `"No one. I had the ${claimLoc} to myself, as far as I could tell."`;
    }
  }

  if (q === "proof" && targetId) {
    const t = npcById(s, targetId);
    if (t) {
      const seenLoc = (() => {
        const ps = [...s.playerSaw].reverse().find((f) => f.id === targetId && f.loc && f.loc !== "home");
        if (ps) return ps.loc;
        const lg2 = [...s.nightLogs].reverse().find((l) => l.outMap && l.outMap[targetId] && l.outMap[targetId] !== "home");
        return lg2 ? lg2.outMap[targetId] : null;
      })();
      quote = seenLoc
        ? `"Watch the ${seenLoc}, some night you feel it in your bones. ${t.name} was there once already, and the guilty go back to their own ground."`
        : pick([
            `"Watch their door, some night you think it might act. Proof is patience, mostly, and a cold few hours."`,
            `"Search wherever ${t.name} was last seen acting strangely, if anyone can name the place."`,
            `"Catch them at it, or catch them lying about it. There is no third way with a thing like this."`,
          ]);
    }
  }

  let flag = null;
  if (q === "where" && claim) {
    const contra = s.playerSaw.find((f) => f.night === night && f.id === id && f.loc !== claim);
    if (contra) flag = `You saw them out that night, near the ${contra.loc}. This is a lie.`;
  }
  if (q === "about" && targetId) {
    const placed = mentions.find((mn) => mn.kind === "placed");
    if (placed) {
      const truth = s.playerSaw.find((f) => f.night === night && f.id === targetId && f.loc !== placed.loc);
      if (truth) flag = `You know where ${npcById(s, targetId).name} truly was that night. This is a lie.`;
    }
  }

  /* -- follow-up chains: at most one free follow-up per answered main
     question, never chained off a follow-up's own answer -- */
  const followUps = [];
  if (q === "where" && claim && claim !== "home") {
    const fkey = `${night}:sawAt:${claim}`;
    if (!(s.askedLog[id] || []).includes(fkey)) followUps.push({ q: "sawAt", label: `Did you see anyone at the ${claim}?`, targetId: claim });
  } else if (q === "suspect") {
    const sm = mentions.find((mn) => mn.kind === "suspects" && mn.id);
    if (sm) {
      const fkey = `${night}:proof:${sm.id}`;
      if (!(s.askedLog[id] || []).includes(fkey)) followUps.push({ q: "proof", label: "How would we get proof?", targetId: sm.id });
    }
  } else if (q === "saw") {
    const wm = mentions.find((mn) => mn.kind === "with" && mn.id);
    if (wm) {
      const fkey = `${night}:about:${wm.id}`;
      const wt = npcById(s, wm.id);
      if (wt && !(s.askedLog[id] || []).includes(fkey)) followUps.push({ q: "about", label: `What do you make of ${wt.name} being there?`, targetId: wm.id });
    }
  }

  return { quote, mentions, claim, flag, foundSign, clue, followUps };
}

const Q_LABELS = {
  where: "Where were you that night?",
  saw: "Who did you see?",
  about: "Did you see someone in particular?",
  opinion: "What do you make of someone?",
  suspect: "Who do you think is doing this?",
  strange: "Noticed anything strange lately?",
  press: "You lied to me. Why?",
  mobwhy: "Why this person? Why the rope?",
  mobview: "What do you make of the accusation?",
  craft: "craft",
  gossip: "What's the talk of the village?",
  share: "Share what you know about someone",
  report: "Tell them what you saw",
  talk: "Sit a while. Talk of nothing.",
  howare: "How are you holding up?",
  past: "Tell me about before.",
  mobcalm: "Talk them out of the rope",
  mobagree: "Tell them you think they're right",
  mobplea: "The rope is coming for you. Talk to me.",
};

function applyAnswer(prev, id, night, q, targetId) {
  const s = JSON.parse(JSON.stringify(prev));
  const ans = computeAnswer(s, id, night, q, targetId);
  const npc = npcById(s, id);
  if (ans.foundSign && !s.foundSigns.includes(ans.foundSign)) s.foundSigns.push(ans.foundSign);
  if (ans.clue) s.clues.push(ans.clue);
  if (!ans.repeat && !ans.refused) s.statements.push({ day: s.dayNum, night, id, name: npc.name, q, claim: ans.claim, mentions: ans.mentions, quote: ans.quote, flag: ans.flag });
  return { s, ans };
}

/* ================= ACCUSATION ================= */

/* Dusk-rite openers, drawn so the naming does not read word-for-word the same
   every time. (name, creature) => line. */
const RITE_OPEN = [
  (nm, cr) => `At dusk the village gathers, torches guttering. You say it aloud: ${nm}. And what you believe wears their face: a ${cr}.`,
  (nm, cr) => `The square fills at dusk, every torch lit. You give them a name, ${nm}, and then the truer one you swear is under the skin: a ${cr}.`,
  (nm, cr) => `Dusk. The village closes into a ring of light around you. You name ${nm}, and the thing you believe them to be: a ${cr}.`,
];

function actAccuse(prev, id, typeId) {
  const s = JSON.parse(JSON.stringify(prev));
  const m = monsterOf(s);
  const npc = npcById(s, id);
  const declared = MONSTERS.find((x) => x.id === typeId);
  const beats = [];
  if (s.mob) { s.mob = null; }
  beats.push(pick(RITE_OPEN)(npc.name, declared.name));
  beats.push(`${ritePreparer(s, id)} readies what the old books prescribe: the ${METHODS[declared.method]}.`);

  if (id === s.monster.vid && typeId === s.monster.type) {
    beats.push(`${npc.name} smiles. It is the last time anyone mistakes that smile for a neighbour's.`);
    beats.push(METHOD_KILL_LINES[declared.method]);
    beats.push(`What dies in front of the village is not ${npc.name}. It has not been ${npc.name} for a long time.`);
    s.over = { win: true, reason: "won", text: `Right face, right name. ${npc.name} ${npc.role} was a ${m.name}, and the ${METHODS[m.method]} ended it in front of everyone it fed on.` };
    s.nightBeats = beats; s.beatTitle = "THE RECKONING"; s.phase = "night";
    return s;
  }

  if (id === s.monster.vid) {
    s.wrongGuesses += 1;
    if (s.wrongGuesses >= 2) {
      beats.push(`The rite is performed. The circle closes. Nothing happens.`);
      beats.push(`${npc.name} looks at the ${METHODS[declared.method]}, then at you, and the last of the pretence falls away. Right face. Wrong name. Again. And this time it does not run.`);
      monsterKillsAccuser(s, beats, `It crosses the broken circle before anyone's legs will answer, and the village whose trust you have spent only watches.`);
      s.ap = 0;
      s.nightBeats = beats; s.beatTitle = "THE RECKONING"; s.phase = "night";
      return s;
    }
    s.fled = true;
    s.npcs = s.npcs.map((x) => (x.id === id ? { ...x, fled: true } : x));
    beats.push(`The rite is performed. The circle closes. Nothing happens.`);
    beats.push(`${npc.name} looks at the ${METHODS[declared.method]}, then at you, and laughs. It is the last human sound it makes, before it goes over the churchyard wall into the trees.`);
    beats.push("Right face, wrong name. It has no reason to hide now, and every reason to make you pay. Learn what it is from what it leaves, and quickly. Name it wrong once more and it comes for you, not them.");
    s.dayEvents.push(ev(`The village knows the face now, but not the name, and only the right rite ends this. Study the signs and be sure: you have one wrong name left before it stops taking neighbours and takes you.`, id));
    s.ap = 0;
    s.nightBeats = beats; s.beatTitle = "THE RECKONING"; s.phase = "night";
    return s;
  }

  s.npcs = s.npcs.map((x) => (x.id === id ? { ...x, alive: false, known: x.turned ? true : x.known } : x));
  s.deaths.push({ night: s.nightNum, id, name: npc.name, kind: "executed" });
  s.wrongExecutions += 1;
  s.wrongGuesses += 1;
  s.embolden = s.nightNum + 1;
  for (const pid of Object.keys(s.patience)) s.patience[pid] = Math.max(0, s.patience[pid] - 1);
  beats.push(`${npc.name} protests. To the end, ${npc.name} protests.`);
  if (npc.turned) beats.push(`As the rite begins, their eyes flash with something that was never theirs. Changed. They were changed.`);
  beats.push(`The ${METHODS[declared.method]} does its work on plain human flesh. The village does not have a dead monster. It has a dead neighbour, and everyone's silence.`);
  beats.push(`They go home in the dark, and no one meets your eye.`);
  s.calmHope = npc.name;
  /* -- Pass G2: the grim bargain pays off, quietly, without ever announcing
     itself as a reward -- */
  if (s.coerceNote && s.coerceNote.target === id) {
    s.monsterProtects = true;
    beats.push("Somewhere beyond the torchlight, something that once left you a note reads the outcome in the crowd's own grief, and is, for the first time in this whole affair, satisfied.");
  }
  if (s.wrongGuesses >= 2) {
    monsterKillsAccuser(s, beats, "Out beyond the torchlight, something that has watched you spend the village's trust decides it has seen enough. Tonight it does not go looking for a neighbour.");
  } else {
    beats.push("And out beyond the torchlight, something that watched the whole thing turns away satisfied. Tonight it will feed without fear. An innocent hanged is a village half-beaten.");
    s.dayEvents.push(ev(`${npc.name} is dead on your word. Name the thing wrong once more and it stops taking neighbours and comes for you.`, id));
  }
  s.ap = 0;
  s.nightBeats = beats; s.beatTitle = "JUDGMENT"; s.phase = "night";
  return s;
}

function SpokenText({ text, speed = 38 }) {
  const words = text.split(" ");
  const [n, setN] = useState(1);
  useEffect(() => {
    setN(1);
    const t = setInterval(() => setN((x) => (x >= words.length ? (clearInterval(t), x) : x + 1)), speed);
    return () => clearInterval(t);
  }, [text]);
  return <span onClick={() => setN(words.length)} style={{ cursor: "pointer" }}>{words.slice(0, n).join(" ")}<span style={{ opacity: 0.4 }}>{n < words.length ? " ▍" : ""}</span></span>;
}

function MoonStrip({ s }) {
  const pips = [];
  for (let n = 1; n <= s.nightNum; n++) {
    const slain = s.deaths.find((x) => x.night === n && x.kind === "slain");
    const turned = s.deaths.find((x) => x.night === n && x.kind === "turned");
    const log = s.nightLogs.find((x) => x.night === n);
    let bg = "transparent", border = C.dim;
    if (slain) { bg = C.redBright; border = C.redBright; }
    else if (turned && npcById(s, turned.id) && npcById(s, turned.id).known) { bg = C.turn; border = C.turn; }
    pips.push(
      <span key={n} className="inline-flex flex-col items-center">
        <span className="inline-block rounded-full" style={{ width: 11, height: 11, background: bg, border: `1.5px solid ${border}` }} />
        <span style={{ color: C.amber, fontSize: 9, lineHeight: "9px" }}>{log && log.wail ? "≈" : "\u00A0"}</span>
      </span>
    );
  }
  return <div className="flex gap-1.5 items-end flex-wrap">{pips}</div>;
}

function EventLine({ e, s, onOpen }) {

/* One-card-at-a-time pager, shared by the dawn report and the loss epilogue.
   Long lists were being dumped as one scrolling wall of text. Swipe or use
   the chevrons; a row of dots tracks where you are. */
function Carousel({ items, renderItem, minHeight = 120, onDone, doneLabel = "Done ✓" }) {
  const [idx, setIdx] = useState(0);
  const touchX = useRef(null);
  useEffect(() => { setIdx(0); }, [items.length]);
  const last = items.length - 1;
  const atLast = idx >= last;
  const go = (d) => setIdx((i) => Math.max(0, Math.min(last, i + d)));
  const onTouchStart = (e) => { touchX.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (touchX.current == null) return;
    const dx = e.changedTouches[0].clientX - touchX.current;
    touchX.current = null;
    if (dx <= -40) go(1);
    else if (dx >= 40) go(-1);
  };
  const navBtn = (label, onClick, disabled) => (
    <button onClick={onClick} disabled={disabled} className="mv-display"
      style={{ background: "transparent", border: "none", color: disabled ? C.dim : C.amber, fontSize: 22, lineHeight: 1, cursor: disabled ? "default" : "pointer", padding: "4px 10px", opacity: disabled ? 0.3 : 1 }}>
      {label}
    </button>
  );
  return (
    <div>
      <div onTouchStart={onTouchStart} onTouchEnd={onTouchEnd} style={{ minHeight }}>
        {renderItem(items[idx], idx)}
      </div>
      <div className="flex items-center justify-between mt-1">
        {navBtn("‹", () => go(-1), idx === 0)}
        <div className="flex gap-1.5">
          {items.map((_, i) => (
            <span key={i} style={{ width: 6, height: 6, borderRadius: 3, display: "inline-block", background: i === idx ? C.amber : C.line }} />
          ))}
        </div>
        {atLast && onDone
          ? <button onClick={onDone} className="mv-display" style={{ background: "transparent", border: "none", color: C.amber, fontSize: 12, letterSpacing: 1, cursor: "pointer", padding: "4px 10px" }}>{doneLabel}</button>
          : navBtn("›", () => go(1), atLast)}
      </div>
    </div>
  );
}

/* The dawn report as a deck of cards instead of one long scroll. */

function demeanorLine(s, id) {
  if (id === s.monster.vid && s.monster.type === "vampire" && chance(0.22)) return "They keep to the doorway the whole time, weight on the outer step. However the conversation turns, they never quite come inside.";
  const npc = npcById(s, id);
  if (id === s.monster.vid) return chance(0.3) ? pickFreshIdx("demeanorMonsterTell", DEMEANOR.monsterTell) : pickFreshIdx("demeanorNormal", DEMEANOR.normal);
  if (npc.turned) return chance(0.5) ? pickFreshIdx("demeanorTurnedTell", DEMEANOR.turnedTell) : pickFreshIdx("demeanorNormal", DEMEANOR.normal);
  return pickFreshIdx("demeanorNormal", DEMEANOR.normal);
}

  if (s.investigatedNight === s.nightNum) return "You have already searched where the body fell today.";
  if (!freshDeath) return "No one died last night. There is nothing to investigate.";
  return `Go to where ${freshDeath.name} fell`;
}
function examineLabel(canExamine) {
  return canExamine ? "Have someone examined for the change" : "No physician remains to examine anyone";

function defendLabel(s, mobT) {
  if (s.defendedToday) return "You have already spoken for them in the square today";
  if (s.hardCleared.includes(mobT.id)) return `Speak for ${mobT.name} in the square: you have proof`;
  return `Speak for ${mobT.name} in the square`;
}
